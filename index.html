/* ---------- Training & Events ----------
   Fed by the daily watcher (CHIA, CCHI, NCIHC, Cross-Cultural Communications)
   and by anyone on the team adding something they spotted elsewhere. Kept in
   its own collection and its own section so CE opportunities aren't buried
   under everyday glossary edits. */
function startCeListener(){
  if(ceListenerStarted || !db) return;
  ceListenerStarted = true;
  db.collection('ce-events').orderBy('timestamp').onSnapshot(snap=>{
    CE_EVENTS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(isInitialCeLoad){
      isInitialCeLoad = false;
      lastSeenCeCount = CE_EVENTS.length;
      CE_EVENTS.forEach(e => notifiedCeIds.add(e.id));
    }else{
      CE_EVENTS.forEach(e=>{
        if(notifiedCeIds.has(e.id)) return;
        notifiedCeIds.add(e.id);
        if(document.visibilityState === 'visible' && activeCategory === 'events') return;
        showCeNotification(e);
      });
    }
    if(activeCategory === 'events'){
      lastSeenCeCount = CE_EVENTS.length;
      renderContent();
    }
    updateCeBadge();
  }, err => console.warn('Events listener unavailable:', err));
}

function updateCeBadge(){
  const badge = document.getElementById('ceBadge');
  if(!badge) return;
  const unread = Math.max(0, CE_EVENTS.length - lastSeenCeCount);
  const next = String(unread > 0 ? unread : CE_EVENTS.length);
  const changed = badge.textContent !== next;
  badge.textContent = next;
  badge.classList.toggle('unread', unread > 0);
  if(changed) pulseBadge(badge);
}

async function showCeNotification(ev){
  if(!notifyCeEnabled) return;
  const body = ev.title || ev.summary || 'New training opportunity';
  await sendNotification(`${ev.source || 'Training'} \u2014 Interpreter Hub`, body, 'events', 'interpreter-hub-events');
}

function renderEvents(){
  const sorted = CE_EVENTS.slice().sort((a,b)=> (b.timestamp||0) - (a.timestamp||0));

  let html = `<div class="section-head"><h2>Training &amp; Events</h2><span class="sub">${sorted.length} item${sorted.length===1?'':'s'}</span>${
    notificationsSupported()
      ? `<button class="head-action ${notifyCeEnabled?'on':''}" onclick="toggleCeNotifications()">${ICON_BELL_SM} ${notifyCeEnabled?'Alerts on':'Alert me'}</button>`
      : ''
  }<button class="head-action" onclick="openAddEventModal()">+ Add</button></div>`;

  html += `<p class="practice-intro">Checked daily across CHIA, CCHI, NCIHC, and Cross-Cultural Communications. Anyone can add something they spotted elsewhere \u2014 a hospital in-service, a conference, a newsletter item.</p>`;

  if(!sorted.length){
    html += `<div class="empty"><div class="glyph">${ICON_CALENDAR}</div>Nothing yet.<br>The watcher checks once a day, or add something manually.</div>`;
    return html;
  }

  html += `<div class="dir-group">`;
  sorted.forEach(ev=>{
    const when = ev.timestamp ? relativeTime(ev.timestamp) : '';
    const src = ev.source || 'Added by the team';
    html += `
      <div class="ce-row">
        <div class="ce-head">
          <span class="ce-src">${escapeHtml(src)}</span>
          <span class="ce-time" data-ts="${ev.timestamp||''}">${when}</span>
          <button class="activity-delete" title="Remove" onclick="deleteCeEvent('${ev.id}')">\u2715</button>
        </div>
        <p class="ce-title">${escapeHtml(ev.title || ev.summary || 'Untitled')}</p>
        ${ev.notes ? `<p class="ce-notes">${escapeHtml(ev.notes)}</p>` : ''}
        ${(ev.link || ev.addedBy) ? `<div class="ce-foot">
          ${ev.link ? `<a class="tr-mini" href="${escapeAttr(ev.link)}" target="_blank" rel="noopener">${ICON_EXTERNAL} Open</a>` : ''}
          ${ev.addedBy ? `<span class="ce-by">added by ${escapeHtml(ev.addedBy)}</span>` : ''}
        </div>` : ''}
      </div>`;
  });
  html += `</div>`;
  return html;
}

function openAddEventModal(){

  document.getElementById('fEvLink').value = '';
  document.getElementById('fEvNotes').value = '';
  document.getElementById('eventOverlay').classList.add('show');

function closeEventModal(){
  document.getElementById('eventOverlay').classList.remove('show');

async function saveEvent(){
  const title = document.getElementById('fEvTitle').value.trim();
  if(!title){ showToast('Give the event a title.'); return; }
  let link = document.getElementById('fEvLink').value.trim();
  if(link && !/^https?:\/\//i.test(link)) link = 'https://' + link;
  const record = {
    title,
    source: document.getElementById('fEvSource').value.trim() || 'Added by the team',
    link,
    notes: document.getElementById('fEvNotes').value.trim(),
    addedBy: whoAmI() || '',
    timestamp: Date.now()
  };
  if(!db){ showToast('Not connected to the database.'); return; }
  try{
    await db.collection('ce-events').add(record);
    closeEventModal();
    successBurst();
    showToast('Event added.');
  }catch(err){
    showToast(saveErrorMessage(err, 'ce-events'));
  }
}

async function deleteCeEvent(id){
  if(!confirm('Remove this from Training & Events?')) return;
  if(!db) return;
  try{
    await db.collection('ce-events').doc(id).delete();
  }catch(err){
    showToast('Could not remove \u2014 check your connection.');
  }
}

/* Firestore rejects writes to a collection with no matching security rule.
   That surfaced as "check your connection", which sent people hunting for a
   network problem that didn't exist. This names the real cause. */
function saveErrorMessage(err, collection){
  const code = (err && (err.code || err.message) || '').toString().toLowerCase();
  if(code.includes('permission') || code.includes('insufficient')){
    return `Saving was blocked by the database rules${collection ? ` for "${collection}"` : ''}. Add the matching Firestore rule, then try again.`;
  }
  if(code.includes('unavailable') || code.includes('network') || code.includes('offline')){
    return 'Could not reach the database — check your connection.';
  }
  return 'Could not save. Please try again.';
}

function prefersAutoFocus(){
  try{
    return window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  }catch(err){
    return true;
  }
}

function showToast(msg){
  const t = document.getElementById('toast');

  t.classList.add('show');
  clearTimeout(showToast._h);

}
// Darkens a hex color by a percentage, so a domain's single stored color
// can produce a two-tone gradient (matching the bold icon style already
// used for Training & Events, Translate, and the rest of the tools list)
// without storing a second color per domain.
// Deterministic per-person color for chat/initials avatars — the same name
// always lands on the same color, so people become visually recognizable
// across messages without needing real photos.
function nameToColor(name){
  const str = (name || '?').trim() || '?';
  let hash = 0;
  for(let i=0; i<str.length; i++){ hash = (hash * 31 + str.charCodeAt(i)) | 0; }
  return DOMAIN_COLORS[Math.abs(hash) % DOMAIN_COLORS.length];
}

function initialsOf(name){
  const trimmed = (name || '').trim();
  if(!trimmed) return '?';
  return trimmed.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

function darkenHex(hex, pct){
  const n = hex.replace('#','');
  const r = parseInt(n.substring(0,2),16), g = parseInt(n.substring(2,4),16), b = parseInt(n.substring(4,6),16);
  const f = 1 - (pct/100);
  const clamp = v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2,'0');
  return `#${clamp(r*f)}${clamp(g*f)}${clamp(b*f)}`;
}

function renderLinks(t, categoryId){
  const links = [];
  if(t.url){
    // A team member's own pasted link takes priority — trust it as the exact source.
    links.push(`<a class="link-pill" href="${escapeAttr(t.url)}" target="_blank" rel="noopener">Source ${ICON_EXTERNAL}</a>`);
  } else if(categoryId !== 'resources' && t.en){
    links.push(`<a class="link-pill" href="${escapeAttr(mplusUrl(t.en,'en'))}" target="_blank" rel="noopener">Look up ${ICON_EXTERNAL}</a>`);
  }
  if(!t.url && categoryId !== 'resources' && t.es){
    links.push(`<a class="link-pill es" href="${escapeAttr(mplusUrl(t.es,'es'))}" target="_blank" rel="noopener">Buscar en español ${ICON_EXTERNAL}</a>`);
  }
  if(links.length===0) return '';
  return `<div class="links">${links.join('')}</div>`;
}

/* ============ Rendering ============ */

  } else if(activeCategory === 'chat'){
    showTopbar = false;
    showStatStrip = false;

    showTopbar = false;

function renderContent(){
  const content = document.getElementById('content');
  const q = searchQuery.trim().toLowerCase();

  if(activeCategory === 'home'){
    content.innerHTML = renderHome();
    startGreetingRotation();
    animateCountUps();
    return;
  }
  stopGreetingRotation(); // never leave the timer running on other sections

  if(activeCategory === 'events'){
    content.innerHTML = renderEvents();
    return;
  }

  if(activeCategory === 'translate'){
    content.innerHTML = renderTranslate();
    if(trQuery) runTranslate();
    return;
  }

  if(activeCategory === 'practice'){
    content.innerHTML = renderPractice();
    // Celebrate a strong score once the results panel is on screen.
    if(!quizActive && quizQuestions.length && quizIndex >= quizQuestions.length){
      const correct = quizQuestions.reduce((n,q,i)=> n + (quizAnswers[i] === q.a ? 1 : 0), 0);
      if(Math.round((correct/quizQuestions.length)*100) >= 80) celebrateScore('.results-head');
    }
    return;
  }

  if(activeCategory === 'updates'){
    content.innerHTML = `
      <div class="section-head"><h2>Recent Updates</h2><span class="sub">${ACTIVITY.length} update${ACTIVITY.length===1?'':'s'}</span>${
        notificationsSupported()
          ? `<button class="head-action ${notifyActivityEnabled?'on':''}" onclick="toggleActivityNotifications()" title="${notifyActivityEnabled?'Turn off update notifications':'Get notified when your team adds or edits something'}">${ICON_BELL_SM} ${notifyActivityEnabled?'Notifications on':'Notify me'}</button>`
          : ''
      }${ACTIVITY.length ? `<button class="head-action" onclick="clearAllActivity()">Clear all</button>` : ''}</div>
      <div id="activityFeed"></div>
    `;
    renderActivityFeed();
    return;
  }

  if(activeCategory === 'directory'){
    content.innerHTML = renderDirectory(q);
    return;
  }

  if(activeCategory === 'providers'){
    content.innerHTML = renderProviders(q);
    return;
  }

  if(activeCategory === 'notes'){
    content.innerHTML = renderNotes(q);
    return;
  }

  if(activeCategory === 'chat'){
    const hasName = !!whoAmI();
    content.innerHTML = `
      <div class="section-head"><h2>Team Chat</h2><span class="sub" id="chatCount">${CHAT_MESSAGES.length} message${CHAT_MESSAGES.length===1?'':'s'}</span>${
        notificationsSupported()
          ? `<button class="head-action ${notifyEnabled?'on':''}" onclick="toggleNotifications()" title="${notifyEnabled?'Turn off chat notifications':'Get notified about new messages'}">${ICON_BELL_SM} ${notifyEnabled?'Notifications on':'Notify me'}</button>`
          : ''
      }</div>
      <div class="hipaa-notice-inline">${ICON_SHIELD}<span>Remember to adhere to HIPAA — no patient names or identifying details here.</span></div>
      <div class="chat-panel">
        <div class="chat-messages" id="chatMessages"></div>
        ${hasName ? `
          <div class="typing-indicator" id="typingIndicator"></div>
          <div class="chat-attach-preview" id="chatAttachPreview"></div>
          <div class="chat-input-row">
            <button class="attach-btn" title="Attach a photo or PDF" onclick="document.getElementById('chatFileInput').click()">${ICON_PAPERCLIP}</button>
            <input class="file-input-hidden" id="chatFileInput" type="file" accept="image/*,application/pdf" onchange="handleChatFileSelected(event)">
            <input id="chatInput" type="text" placeholder="Message your team…" oninput="handleChatTyping()" onkeydown="handleChatKeydown(event)">
            <button class="chat-send-btn" onclick="sendChatMessage()" title="Send">${ICON_SEND}</button>
          </div>
        ` : `
          <div class="chat-join-hint">👋 Set your name to join the conversation — your team will see it next to your messages.</div>
          <button class="btn btn-primary" style="border-radius:24px; align-self:center;" onclick="openNameModal()">Set your name</button>
        `}
      </div>
    `;
    renderChatMessages();
    renderChatAttachPreview();
    renderTypingIndicator();
    if(hasName){
      const focusTarget = document.getElementById('chatInput');
      if(focusTarget && prefersAutoFocus()) focusTarget.focus();
    }
    return;
  }

  let cats = activeCategory==='all' ? DATA.categories : DATA.categories.filter(c=>c.id===activeCategory);

  let html = '';
  cats.forEach(cat=>{
    // Sort a *copy* for display only. Each item keeps _idx — its true position
    // in the stored array — so the edit and delete buttons still target the
    // right term. Reordering the stored data itself would risk mismatches
    // when two people edit at once.
    let terms = cat.terms.map((t,i)=>({...t, _idx:i}));
    terms.sort((a,b)=> collateTerms(a.en, b.en));
    // Number the cards from the full sorted list, before filtering, so a
    // search doesn't renumber everything.
    terms.forEach((t,i)=>{ t._num = i+1; });
    if(q){
      terms = terms.filter(t =>
        (t.en||'').toLowerCase().includes(q) ||
        (t.es||'').toLowerCase().includes(q) ||
        (t.def||'').toLowerCase().includes(q)
      );
    }
    if(terms.length===0) return;

    html += `<div class="section-head" id="domain-${cat.id}"><h2>${escapeHtml(cat.name)}</h2><span class="sub">${terms.length} term${terms.length===1?'':'s'}</span></div>`;
    html += `<div class="grid">`;
    terms.forEach((t, cardIdx)=>{
      const termAttachments = ATTACHMENTS.filter(a=>a.termId===t.id);
      const delay = Math.min(cardIdx * 0.03, 0.3);
      html += `
        <div class="card" style="--card-accent:${cat.color}; animation-delay:${delay.toFixed(2)}s;">
          <div class="card-top">
            <span class="tag" style="color:${cat.color}; background:${cat.color}1F;">${escapeHtml(cat.name.split(',')[0].split('&')[0].trim())}</span>
            <span class="chart-id">${cat.id.slice(0,3).toUpperCase()}-${String(t._num).padStart(2,'0')}</span>
          </div>
          <div class="actions" style="position:absolute; top:16px; right:16px;">
            <button class="attach-btn" title="Attach a photo or PDF" onclick="attachToTerm('${t.id}')">${ICON_PAPERCLIP}</button>
            <button class="icon-btn" title="Edit" onclick="openEditModal('${cat.id}', '${t.id}')">✎</button>
            <button class="icon-btn danger" title="Delete" onclick="deleteTerm('${cat.id}', '${t.id}')">✕</button>
          </div>
          <div class="term-en">
            <span>${escapeHtml(t.en)}</span>
            <button class="copy-btn" title="Copy term" onclick="copyText(this, ${JSON.stringify(t.en).replace(/"/g,'&quot;')})">${ICON_COPY}</button>
          </div>
          ${t.es ? `<div class="term-es">
            <span>${escapeHtml(t.es)}</span>
            <button class="copy-btn" title="Copy Spanish term" onclick="copyText(this, ${JSON.stringify(t.es).replace(/"/g,'&quot;')})">${ICON_COPY}</button>
          </div>` : ''}
          <p class="def">${escapeHtml(t.def)}</p>
          ${renderLinks(t, cat.id)}
          ${termAttachments.length ? `<div class="attach-row">${termAttachments.map(a=>attachmentChipHtml(a, `deleteAttachment('${a.id}')`)).join('')}</div>` : ''}
          ${(t.source || t.editedBy) ? `<div class="meta">
            <span class="source">${t.source ? escapeHtml(t.source) : ''}</span>
            <span class="source">${t.editedBy ? 'Edited by ' + escapeHtml(t.editedBy) : ''}</span>
          </div>` : ''}
        </div>
      `;
    });
    html += `</div>`;
  });

  if(!html){
    html = `<div class="empty"><div class="glyph">⌕</div>No terms match your search.<br>Try a different word, or add this term.</div>`;
  }

  content.innerHTML = html;
}

function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if(isDark){
    document.documentElement.removeAttribute('data-theme');
    try{ localStorage.setItem('ih_theme', 'light'); }catch(e){}
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    try{ localStorage.setItem('ih_theme', 'dark'); }catch(e){}
  }
  render(); // the button's own icon needs to flip too
}

function toggleDomainsCollapsed(){
  domainsCollapsed = !domainsCollapsed;
  try{ localStorage.setItem('ih_domainsCollapsed', domainsCollapsed ? '1' : '0'); }catch(e){}
  render();
}

function toggleToolsCollapsed(){
  toolsCollapsed = !toolsCollapsed;
  try{ localStorage.setItem('ih_toolsCollapsed', toolsCollapsed ? '1' : '0'); }catch(e){}
  render();
}

// The greeting banner's shortcut button: expand Recent Activity if it's
// currently collapsed, then scroll down to it — one tap from "Hello" to
// the actual list, instead of expand-then-hunt-for-it.
function setCategory(id){
  activeCategory = id;
  if(id === 'chat'){
    lastSeenChatCount = CHAT_MESSAGES.length;
    // Prompt for a name right away rather than waiting for someone to
    // notice the inline "add your name" hint or the floating button.
    if(!whoAmI()) openNameModal();
  }
  if(id === 'updates'){ lastSeenActivityCount = ACTIVITY.length; }
  if(id === 'events'){ lastSeenCeCount = CE_EVENTS.length; }
  render();
}

// The floating Home button needs to do two things a plain setCategory('home')
// wouldn't: switching screens doesn't reset scroll position, so without this
// someone who jumped deep into a domain would land on Home already scrolled
// halfway down the page.
function goHome(){
  setCategory('home');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Lets someone set or change their attribution name from any screen,
// including the focused views where the sidebar (and its own name field)
// is hidden. window.__lastWho is the single source of truth either way —
// see whoAmI() — so this just needs to keep that, and the sidebar field
// when it happens to be present, in sync.
function openNameModal(){
  const input = document.getElementById('fMyName');
  input.value = whoAmI();
  document.getElementById('nameOverlay').classList.add('show');
  if(prefersAutoFocus()) input.focus();
}

function closeNameModal(){
  document.getElementById('nameOverlay').classList.remove('show');
}

// Canceling shouldn't still barge ahead with whatever add/edit/chat action
// triggered the prompt — only a saved name does that.
function cancelNameModal(){
  pendingNameAction = null;
  closeNameModal();
}

/* ============ CoreCHI practice ============ */
function allQuestions(){
  return SEED_QUESTIONS.concat(CUSTOM_QUESTIONS);
}

function domainMeta(id){
  return CCHI_DOMAINS.find(d=>d.id===id) || { id, name:id, weight:0, color:'#7A7A70' };
}

// Builds a quiz that mirrors the real exam's domain proportions rather than
// picking uniformly at random, so practice reflects where the marks actually are.
//
// A short quiz can't split cleanly into 23/24/25/13/15 — rounding always has a
// remainder. Rounding the same way every time would permanently over-represent
// some domains, so leftover slots are handed out randomly in proportion to each
// domain's fractional remainder. Any single quiz is approximate; the average
// across sessions lands on the true weights.
function buildWeightedQuiz(pool, n){
  const byDomain = {};
  CCHI_DOMAINS.forEach(d=>{ byDomain[d.id] = shuffle(pool.filter(q=>q.d===d.id)); });

  const alloc = {};
  const remainders = [];
  let assigned = 0;
  CCHI_DOMAINS.forEach(d=>{
    const exact = n * (d.weight/100);
    const base = Math.floor(exact);
    alloc[d.id] = base;
    assigned += base;
    remainders.push({ id:d.id, frac: exact - base });
  });

  // Hand out the remaining slots by weighted random draw on the fractional
  // remainders. Sorting by remainder would be deterministic — the same domains
  // would win every single time and stay permanently over-represented.
  let leftoverSlots = n - assigned;
  const candidates = remainders.slice();
  while(leftoverSlots > 0 && candidates.length){
    const totalFrac = candidates.reduce((s,c)=> s + c.frac, 0);
    let roll = Math.random() * (totalFrac || candidates.length);
    let pick = candidates.length - 1;
    for(let i=0;i<candidates.length;i++){
      roll -= (totalFrac ? candidates[i].frac : 1);
      if(roll <= 0){ pick = i; break; }
    }
    alloc[candidates[pick].id]++;
    candidates.splice(pick, 1); // one extra slot per domain at most
    leftoverSlots--;
  }

  const chosen = [];
  CCHI_DOMAINS.forEach(d=>{ chosen.push(...byDomain[d.id].splice(0, alloc[d.id])); });

  // If a domain didn't have enough questions, top up from whatever remains.
  const leftovers = shuffle(Object.values(byDomain).flat());
  while(chosen.length < n && leftovers.length) chosen.push(leftovers.shift());
  return shuffle(chosen).slice(0, n);
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Randomizes the order of a question's options and remaps the correct index.
// Without this, a fixed answer position becomes a giveaway pattern — someone
// could score well by spotting the pattern instead of reasoning through the
// scenario, which defeats the point of practising. Shuffling per session also
// means repeating a question isn't just recall of "it was the third one".
function shuffleOptions(q){
  const order = shuffle(q.o.map((_, i) => i));
  return { ...q, o: order.map(i => q.o[i]), a: order.indexOf(q.a) };
}

function startQuiz(){
  const lenEl = document.getElementById('quizLenSel');
  const domEl = document.getElementById('quizDomainSel');
  quizLength = lenEl ? Number(lenEl.value) : 10;
  quizDomainFilter = domEl ? domEl.value : 'all';

  const pool = quizDomainFilter === 'all'
    ? allQuestions()
    : allQuestions().filter(q=>q.d === quizDomainFilter);

  if(!pool.length){ showToast('No questions available for that domain yet.'); return; }

  quizQuestions = (quizDomainFilter === 'all'
    ? buildWeightedQuiz(pool, Math.min(quizLength, pool.length))
    : shuffle(pool).slice(0, Math.min(quizLength, pool.length))
  ).map(shuffleOptions);

  if(quizQuestions.length < quizLength){
    showToast(`Only ${quizQuestions.length} questions available \u2014 starting with those.`);
  }
  quizIndex = 0;
  quizAnswers = [];
  quizRevealed = false;
  quizActive = true;
  renderContent();
}

function renderQuiz(){
  const q = quizQuestions[quizIndex];
  const dm = domainMeta(q.d);
  const chosen = quizAnswers[quizIndex];
  const pct = Math.round((quizIndex / quizQuestions.length) * 100);
  const letters = ['A','B','C','D','E','F'];

  let html = `<div class="section-head"><h2>CoreCHI Practice</h2><span class="sub">${quizIndex+1} of ${quizQuestions.length}</span>
    <button class="head-action" onclick="exitQuiz()">Exit</button></div>`;

  html += `<div class="quiz-card">
    <div class="quiz-progress-track"><span class="quiz-progress-fill" style="width:${pct}%"></span></div>
    <div class="quiz-meta">
      <span class="tag" style="color:${dm.color}; background:${dm.color}1F;">${escapeHtml(dm.name)}</span>
      <span class="quiz-counter">Question ${quizIndex+1} / ${quizQuestions.length}</span>
    </div>
    <p class="quiz-question">${escapeHtml(q.q)}</p>
    <div class="quiz-options">`;

  q.o.forEach((opt, i)=>{
    let cls = '';
    if(quizRevealed){
      if(i === q.a) cls = 'correct';
      else if(i === chosen) cls = 'wrong';
    }
    html += `<button class="quiz-option ${cls}" ${quizRevealed?'disabled':''} onclick="answerQuiz(${i})">
      <span class="opt-letter">${letters[i]}</span><span>${escapeHtml(opt)}</span>
    </button>`;
  });
  html += `</div>`;

  if(quizRevealed){
    const right = chosen === q.a;
    html += `<div class="quiz-explain"><b>${right ? 'Correct.' : 'Not quite.'}</b> ${escapeHtml(q.e)}</div>`;
    html += `<div class="quiz-actions">
      <button class="btn btn-primary" onclick="nextQuestion()">${quizIndex+1 < quizQuestions.length ? 'Next question' : 'See results'}</button>
    </div>`;
  }
  html += `</div>`;
  return html;
}

function answerQuiz(i){
  if(quizRevealed) return;
  quizAnswers[quizIndex] = i;
  quizRevealed = true;
  renderContent();
}

function nextQuestion(){
  quizIndex++;
  quizRevealed = false;
  if(quizIndex >= quizQuestions.length){
    quizActive = false; // triggers the results view
  }
  renderContent();
}

function exitQuiz(){
  quizActive = false;
  quizQuestions = [];
  quizAnswers = [];
  quizIndex = 0;
  quizRevealed = false;
  renderContent();
}

function renderQuizResults(){
  const total = quizQuestions.length;
  const correct = quizQuestions.reduce((n,q,i)=> n + (quizAnswers[i] === q.a ? 1 : 0), 0);
  const pct = total ? Math.round((correct/total)*100) : 0;

  // Per-domain breakdown, mirroring how CCHI reports subscores.
  const dom = {};
  quizQuestions.forEach((q,i)=>{
    if(!dom[q.d]) dom[q.d] = { right:0, total:0 };
    dom[q.d].total++;
    if(quizAnswers[i] === q.a) dom[q.d].right++;
  });

  const ringColor = pct >= 80 ? '#4E9E74' : pct >= 60 ? '#BFA05E' : '#B5707D';
  const verdict = pct >= 80
    ? '🎉 Strong result — you\u2019re tracking well. Keep cycling through the domains to stay sharp.'
    : pct >= 60
      ? '👍 A solid base. Focus your next sessions on the weakest domains below.'
      : '📘 Worth slowing down and reading the explanations before retrying — that\u2019s where the learning happens.';

  let html = `<div class="section-head"><h2>Practice Results</h2><span class="sub">${correct} of ${total} correct</span></div>`;
  html += `<div class="results-head">
    <div class="score-ring${pct >= 80 ? ' celebrate' : ''}" style="background:conic-gradient(${ringColor} ${pct*3.6}deg, var(--line-soft) 0deg);">
      <div class="score-ring-inner"><span class="score-pct">${pct}%</span><span class="score-label">Score</span></div>
    </div>
    <div class="results-summary">
      <h3>${correct} of ${total} correct</h3>
      <p>${verdict}</p>
    </div>
  </div>`;

  html += `<div class="domain-bars">`;
  CCHI_DOMAINS.forEach(d=>{
    const s = dom[d.id];
    if(!s) return;
    const dpct = Math.round((s.right/s.total)*100);
    html += `
      <div class="domain-bar-row">
        <span class="domain-bar-name">${escapeHtml(d.name)}</span>
        <span class="domain-bar-track"><span class="domain-bar-fill" style="width:${dpct}%; background:${d.color};"></span></span>
        <span class="domain-bar-pct">${dpct}%</span>
        <span class="domain-bar-pct">${s.right}/${s.total}</span>
      </div>`;
  });
  html += `</div>`;

  const missed = quizQuestions.map((q,i)=>({q,i})).filter(({q,i})=> quizAnswers[i] !== q.a);
  if(missed.length){
    html += `<div class="section-head"><h2>Review</h2><span class="sub">${missed.length} missed</span></div>`;
    missed.forEach(({q,i})=>{
      const letters = ['A','B','C','D','E','F'];
      const yours = quizAnswers[i] != null ? `${letters[quizAnswers[i]]}. ${q.o[quizAnswers[i]]}` : 'No answer';
      html += `<div class="review-item">
        <p class="review-q">${escapeHtml(q.q)}</p>
        <p class="review-line bad">Your answer: ${escapeHtml(yours)}</p>
        <p class="review-line good">Correct: ${letters[q.a]}. ${escapeHtml(q.o[q.a])}</p>
        <p class="review-line">${escapeHtml(q.e)}</p>
      </div>`;
    });
  }

  html += `<div class="quiz-actions" style="justify-content:flex-start; margin-top:20px;">
    <button class="btn btn-primary" onclick="exitQuiz()">Back to practice</button>
  </div>`;
  return html;
}

/* ---------- Live relative time ----------
   "2m ago" that actually ticks over is one of the clearest signals that an
   app is live rather than a static page. Elements carry the raw timestamp in
   a data attribute and a single shared interval refreshes them all, rather
   than each row owning its own timer. */
function relativeTime(ts){
  if(!ts) return '';
  const secs = Math.floor((Date.now() - ts) / 1000);
  if(secs < 45) return 'just now';
  if(secs < 90) return '1m ago';
  const mins = Math.floor(secs / 60);
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if(days === 1) return 'yesterday';
  if(days < 7) return days + 'd ago';
  return new Date(ts).toLocaleDateString(undefined,{month:'short', day:'numeric'});
}

function refreshRelativeTimes(){
  document.querySelectorAll('[data-ts]').forEach(el=>{
    const ts = Number(el.getAttribute('data-ts'));
    if(ts) el.textContent = relativeTime(ts);
  });
}
setInterval(refreshRelativeTimes, 30000); // one timer for the whole app

/* Counts the dashboard stats up from zero on entry. Uses requestAnimationFrame
   with an eased curve so it decelerates rather than ticking linearly. */
function animateCountUps(){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-countup]').forEach(el=>{
    const target = Number(el.getAttribute('data-countup')) || 0;
    if(reduce || target === 0){ el.textContent = String(target); return; }
    const duration = 900;
    const start = performance.now();
    const step = (now)=>{
      const p = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
      el.textContent = String(Math.round(target * eased));
      if(p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

    const time = m.timestamp ? relativeTime(m.timestamp) : '';
    const avatarColor = nameToColor(m.author || 'Teammate');
    const avatar = !mine ? `<div class="chat-avatar" style="background:linear-gradient(140deg, ${avatarColor}, ${darkenHex(avatarColor, 30)});">${escapeHtml(initialsOf(m.author || 'Teammate'))}</div>` : '';
    return `
      <div class="chat-bubble-row ${mine ? 'me' : 'them'}${notifiedMessageIds.has(m.id) ? '' : ' fresh'}">
        ${avatar}
        <div class="chat-bubble-col">
          ${!mine ? `<div class="chat-author">${escapeHtml(m.author || 'Teammate')}</div>` : ''}
          ${m.text ? `<div class="chat-bubble">${escapeHtml(m.text)}</div>` : ''}
          ${m.attachment ? `<div class="attach-row" style="margin-top:${m.text?'6px':'0'};">${attachmentChipHtml(m.attachment, null)}</div>` : ''}
          <div class="chat-meta-row">
            <span class="chat-time" data-ts="${m.timestamp||''}" title="${m.timestamp ? escapeAttr(new Date(m.timestamp).toLocaleString()) : ''}">${time}</span>
            <button class="chat-delete" title="Delete this message" onclick="deleteChatMessage('${m.id}')">Delete</button>
          </div>
        </div>

    `;
  }).join('');

  if(wasNearBottom){

  }
}

async function sendChatMessage(){
  const input = document.getElementById('chatInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text && !pendingChatAttachment) return;

  const author = whoAmI();
  if(!author){
    showToast('Add your name in the sidebar first, so your team knows who\'s chatting.');
    return;
  }
  if(!db){
    showToast('Not connected to the database.');
    return;
  }

  const attachment = pendingChatAttachment;
  clearTimeout(typingHeartbeat);
  clearTyping();
  input.value = '';
  pendingChatAttachment = null;
  renderChatAttachPreview();
  input.disabled = true;
  try{
    await db.collection('team-chat').add({ text, author, attachment: attachment || null, timestamp: Date.now() });
    // No manual state update needed — the real-time listener picks this up
    // for everyone, including the sender, and calls renderChatMessages().
  }catch(err){
    showToast('Could not send — check your connection.');
    input.value = text; // give the message back so it isn't lost
    pendingChatAttachment = attachment;
    renderChatAttachPreview();
  }
  input.disabled = false;
  // No re-focus here on purpose: keeping the keyboard open after send was
  // also keeping the Home button hidden until a second, unrelated tap.
  // Letting focus release lets the keyboard close and the button reappear
  // right away — tapping the input again for the next message is a small
  // trade worth making for that.
}

function handleChatKeydown(event){
  if(event.key === 'Enter' && !event.shiftKey){
    event.preventDefault();
    sendChatMessage();
  }
}

/* ============ Notes: rendering ============ */
function renderNotes(q){
  let list = NOTES.slice();
  if(q){
    list = list.filter(n => (n.text||'').toLowerCase().includes(q) || (n.author||'').toLowerCase().includes(q));
  }
  list.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));

  const notice = `<div class="hipaa-notice-inline">${ICON_SHIELD}<span>Remember to adhere to HIPAA — no patient names or identifying details here.</span></div>`;

  if(list.length===0){
    const msg = NOTES.length===0
      ? '📝 No guides yet.<br>Leave the first one for your team.'
      : 'No guides match your search.';
    return notice + `<div class="empty"><div class="glyph">${ICON_NOTE}</div>${msg}</div>`;
  }

  let html = `<div class="section-head"><h2>Guides</h2><span class="sub">${list.length} guide${list.length===1?'':'s'}</span></div>`;
  html += notice;
  html += `<div class="grid">`;
  list.forEach((n, cardIdx)=>{
    const dateLabel = n.createdAt ? relativeTime(n.createdAt) : '';
    const delay = Math.min(cardIdx * 0.03, 0.3);
    html += `
      <div class="card" style="--card-accent:#BFA05E; animation-delay:${delay.toFixed(2)}s;">
        <div class="actions" style="position:absolute; top:16px; right:16px;">
          <button class="icon-btn" title="Edit" onclick="openEditNoteModal('${n.id}')">✎</button>
          <button class="icon-btn danger" title="Delete" onclick="deleteNote('${n.id}')">✕</button>
        </div>
        <p class="note-text">${escapeHtml(n.text)}</p>
        ${n.attachment ? `<div class="attach-row">${attachmentChipHtml(n.attachment, null)}</div>` : ''}
        <div class="meta">
          <span class="source">${n.author ? escapeHtml(n.author) : 'Anonymous'}</span>
          <span class="source" data-ts="${n.createdAt||''}">${dateLabel}</span>
        </div>
      </div>
    `;
  });
  html += `</div>`;
  return html;
}

function renderDirectory(q){
  let sectionsHtml = '';
  let totalRows = 0;

  DATA.categories.forEach(cat=>{
    let rows = [];
    // Same approach as the term grid: sort a copy for display, but keep each
    // term's real storage index so the pencil button edits the right one.
    const sortedTerms = cat.terms
      .map((t)=>({ t }))
      .sort((a,b)=> collateTerms(a.t.en, b.t.en));
    sortedTerms.forEach(({ t })=>{
      const label = t.es ? `${t.en} <span style="color:var(--ink-faint); font-weight:400;">/ ${escapeHtml(t.es)}</span>` : escapeHtml(t.en);
      const matches = !q || (t.en||'').toLowerCase().includes(q) || (t.es||'').toLowerCase().includes(q) || (t.def||'').toLowerCase().includes(q);
      if(!matches) return;

      if(t.url){
        rows.push({ term: label, kind: 'Source', confirmed: true, url: t.url, termId: t.id });
      } else if(cat.id !== 'resources'){
        if(t.en) rows.push({ term: label, kind: 'EN lookup', confirmed: false, url: mplusUrl(t.en,'en'), termId: t.id });
        if(t.es) rows.push({ term: label, kind: 'ES lookup', confirmed: false, url: mplusUrl(t.es,'es'), termId: t.id });
      }
    });
    if(rows.length===0) return;
    totalRows += rows.length;

    sectionsHtml += `<div class="section-head"><h2>${escapeHtml(cat.name)}</h2><span class="sub">${rows.length} link${rows.length===1?'':'s'}</span></div>`;
    sectionsHtml += `<div class="dir-group">`;
    rows.forEach(r=>{
      sectionsHtml += `
        <div class="dir-row">
          <span class="dir-dot" style="background:${cat.color}"></span>
          <span class="dir-term">${r.term}</span>
          <span class="dir-kind ${r.confirmed?'confirmed':''}">${r.kind}</span>
          <a class="dir-url" href="${escapeAttr(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.url)}</a>
          <button class="icon-btn" title="Edit this link" onclick="openEditModal('${cat.id}', '${r.termId}')">✎</button>
          <a class="dir-go" href="${escapeAttr(r.url)}" target="_blank" rel="noopener" title="Open link">${ICON_EXTERNAL}</a>
        </div>
      `;
    });
    sectionsHtml += `</div>`;
  });

  if(totalRows===0){
    return `<div class="empty"><div class="glyph">${ICON_CHAIN}</div>No links match your search.</div>`;
  }

  const intro = `<p style="font-size:12.5px; color:var(--ink-soft); max-width:640px; margin:-6px 0 26px 0; line-height:1.6;">
    Every clickable reference in the glossary, in one place — confirmed source links your team has pasted in, plus the live MedlinePlus lookups used as a fallback. Click the pencil on any row to edit a link, or use "+ Add link" above to add a new one to any domain.
  </p>`;

  return intro + sectionsHtml;
}

async function saveTerm(){
  const en = document.getElementById('fEn').value.trim();
  if(!en){ showToast('English term is required.'); return; }
  const es = document.getElementById('fEs').value.trim();
  const def = document.getElementById('fDef').value.trim();
  const source = document.getElementById('fSource').value.trim();
  let url = document.getElementById('fSourceUrl').value.trim();
  if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  const newCategoryId = document.getElementById('fCategory').value;
  const editor = whoAmI();
  const targetCatName = DATA.categories.find(c=>c.id===newCategoryId).name;

  const existingTerm = editingContext
    ? DATA.categories.find(c=>c.id===editingContext.categoryId).terms.find(t=>t.id===editingContext.termId)
    : null;

  // Snapshot the pre-edit values before overwriting them, so an accidental
  // or unwanted change can be undone later. Capped at 10 — enough to catch
  // a mistake without a term's document growing without bound.
  let history = (existingTerm && existingTerm.history) || [];
  if(existingTerm){
    const snapshot = {
      en: existingTerm.en, es: existingTerm.es, def: existingTerm.def,
      source: existingTerm.source, url: existingTerm.url,
      editedBy: existingTerm.editedBy, editedOn: existingTerm.editedOn,
      savedAt: Date.now()
    };
    history = [snapshot, ...history].slice(0, 10);
  }

  const record = {
    id: (existingTerm && existingTerm.id) || genId(), categoryId: newCategoryId,
    en, es, def, source,
    url: url || undefined, editedBy: editor || undefined, editedOn: editor ? timeAgoLabel() : undefined,
    history
  };

  closeModal();
  const ok = await saveTermDoc(record);
  if(!ok) return; // saveTermDoc already showed the error toast

  // Apply locally right away rather than waiting on the real-time listener's
  // round trip — the person who just typed the edit shouldn't have to wait
  // to see it reflected.
  if(editingContext){
    const oldCat = DATA.categories.find(c=>c.id===editingContext.categoryId);
    oldCat.terms = oldCat.terms.filter(t=>t.id!==record.id);
    const targetCat = DATA.categories.find(c=>c.id===newCategoryId);
    targetCat.terms.push(record);
    logActivity(`updated "${en}" in ${targetCatName}`);
  } else {
    const targetCat = DATA.categories.find(c=>c.id===newCategoryId);
    targetCat.terms.push(record);
    logActivity(`added "${en}" to ${targetCatName}`);
  }

  successBurst();
  showToast('Term saved.');
  render();
}

async function deleteTerm(categoryId, termId){
  const cat = DATA.categories.find(c=>c.id===categoryId);
  const term = cat.terms.find(t=>t.id===termId);
  if(!term) return;
  if(!confirm(`Delete "${term.en}"? This can't be undone.`)) return;
  const ok = await deleteTermDoc(termId);
  if(!ok) return;
  cat.terms = cat.terms.filter(t=>t.id!==termId);
  logActivity(`removed "${term.en}" from ${cat.name}`);

  // Clean up any files that were attached to this term.
  const orphaned = ATTACHMENTS.filter(a=>a.termId===term.id);
  if(orphaned.length && db){
    orphaned.forEach(a=> db.collection('term-attachments').doc(a.id).delete().catch(()=>{}));
    ATTACHMENTS = ATTACHMENTS.filter(a=>a.termId!==term.id);
  }

  showToast('Term deleted.');
  render();
}

// Provider photos now go through the same pipeline as every other
// attachment: resized to 1400px and uploaded to Cloud Storage, with only a
// URL kept in Firestore. The old 480px cap was a workaround from when photos
// had to be embedded in the document to fit Firestore's 1MB limit — that
// constraint is gone, and 480px looked blurry when opened full-screen.
async function handlePhotoSelect(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Please choose an image file.'); return; }

  const label = document.querySelector('label[for="fPPhoto"]');
  const originalLabel = label ? label.textContent : '';
  if(label) label.textContent = 'Uploading…';

  try{
    const att = await readFileAsAttachment(file);
    pendingPhotoDataUrl = att.dataUrl;
    pendingPhotoPath = att.storagePath || null;
    renderPhotoPreview();
  }catch(err){
    showToast(err.message || 'Could not process that image.');
  }finally{
    if(label) label.textContent = originalLabel || 'Choose photo';
    event.target.value = '';
  }
}

  };

  try{

async function saveNote(){
  const text = document.getElementById('fNoteText').value.trim();
  if(!text){ showToast('Note can\'t be empty.'); return; }
  const editor = whoAmI();
  const existing = editingNoteId ? NOTES.find(n=>n.id===editingNoteId) : null;
  const isNew = !editingNoteId;

  const record = {
    text,
    attachment: pendingNoteAttachment || null,
    author: editor || (existing && existing.author) || '',
    createdAt: (existing && existing.createdAt) || Date.now(),
    updatedAt: Date.now()
  };

  try{
    const id = await persistNote(record, editingNoteId);
    if(!id) return;
    if(editingNoteId){
      const idx = NOTES.findIndex(n=>n.id===editingNoteId);
      if(idx>-1) NOTES[idx] = { id, ...record };
    } else {
      NOTES.push({ id, ...record });
    }
    closeNoteModal();
    logActivity(isNew ? 'left a guide' : 'updated a guide');
    successBurst();
    showToast('Note saved.');
    render();
  }catch(err){
    showToast(saveErrorMessage(err, 'team-notes'));
  }
}

async function deleteNote(id){
  const n = NOTES.find(x=>x.id===id);
  if(!n) return;
  if(!confirm('Delete this note? This can\'t be undone.')) return;
  try{
    await deleteNoteRemote(id);
    if(storage && n.attachment && n.attachment.storagePath){
      storage.ref().child(n.attachment.storagePath).delete().catch(()=>{});
    }
    NOTES = NOTES.filter(x=>x.id!==id);
    logActivity('deleted a note');
    showToast('Note deleted.');
    render();
  }catch(err){
    showToast('Could not delete — check your connection.');
  }
}

// iOS doesn't reliably reposition fixed elements against the visual
// viewport while the on-screen keyboard is open — a fixed button can end up
// floating mid-screen instead of pinned to the true bottom, overlapping
// whatever's there (like Team Chat's compose bar). The standard fix is to
// hide floating UI while a text field is focused, not fight the keyboard.
document.addEventListener('focusin', (e)=>{
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')){
    document.body.classList.add('kb-open');
  }
});
document.addEventListener('focusout', (e)=>{
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')){
    setTimeout(()=>{
      const active = document.activeElement;
      if(!active || (active.tagName !== 'INPUT' && active.tagName !== 'TEXTAREA')){
        document.body.classList.remove('kb-open');
      }
    }, 50);
  }
});

/* ---------- Install / offline support ----------
   Registered after load so it never delays first paint. Guarded because
   service workers are unavailable on file:// and in some private modes —
   a failure here must never stop the app itself from working. */
if('serviceWorker' in navigator && window.isSecureContext){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>{
      console.warn('Service worker registration failed:', err);
    });
  });
  // Tapping a chat notification asks the app to jump straight to Team Chat.
  navigator.serviceWorker.addEventListener('message', (event)=>{
    if(event.data && event.data.type === 'open-section' && event.data.section){
      setCategory(event.data.section);
    }
  });
}
