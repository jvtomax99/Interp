<!-- ===================================================================
     CLOUD STORAGE SETUP
     This app was originally built in Claude, where "window.storage" is
     provided automatically. Outside Claude (e.g. here on Vercel), it
     doesn't exist — so this block replaces it with a real, free backend
     (Firebase Firestore + Cloud Storage) that has the exact same shape.

     1. Create a project at https://console.firebase.google.com
     2. Build a Firestore Database (Start in test mode is fine to begin)
     3. Project settings → your web app → copy the firebaseConfig object
        and paste it below, replacing the placeholder values.
     4. In Firestore → Rules, set:
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /terminology-hub/{docId} { allow read, write: if true; }
              match /terminology-meta/{docId} { allow read, write: if true; }
              match /terms/{docId} { allow read, write: if true; }
              match /healthcare-providers/{docId} { allow read, write: if true; }
              match /team-chat/{docId} { allow read, write: if true; }
              match /team-notes/{docId} { allow read, write: if true; }
              match /term-attachments/{docId} { allow read, write: if true; }
              match /activity-log/{docId} { allow read, write: if true; }
              match /practice-questions/{docId} { allow read, write: if true; }
            }
          }
     5. This app also uses Cloud Storage for file attachments (photos and
        PDFs), which requires the pay-as-you-go Blaze plan. In Storage →
        Rules, set:
          rules_version = '2';
          service firebase.storage {
            match /b/{bucket}/o {
              match /attachments/{allPaths=**} { allow read, write: if true; }
            }
          }
        (This keeps the app open to your whole team with no login,
        matching how it worked inside Claude. Anyone with the config
        below could also write to your database/storage directly — fine
        for a small trusted team, not fine if this repo goes fully public.)
==================================================================== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyAvCLXI4RT8Ma_SpGzBIbx-U4zCTm12mKg",
    authDomain: "language-specialist.firebaseapp.com",
    projectId: "language-specialist",
    storageBucket: "language-specialist.firebasestorage.app",
    messagingSenderId: "779333254608",
    appId: "1:779333254608:web:899e45cc2f6769a6850dd5"
  };

  let db = null;
  let storage = null;
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    storage = firebase.storage();
  }catch(e){
    console.error('Firebase failed to initialize — check firebaseConfig above.', e);
  }

  // Mimics the same shape Claude's built-in window.storage provided,
  // so nothing else in the app below needs to change.
  window.storage = {
    async get(key){
      if(!db) return null;
      const snap = await db.collection('terminology-hub').doc(key).get();
      if(!snap.exists) return null;
      return { key, value: snap.data().value, shared:true };
    },
    async set(key, value){
      if(!db) return null;
      await db.collection('terminology-hub').doc(key).set({ value, updatedAt: Date.now() });
      return { key, value, shared:true };
    },
    async delete(key){
      if(!db) return null;

/* Classic Spanish/English false friends that matter clinically. These are the
   traps machine translation reliably gets wrong, and several appear on CCHI
   material. The canonical example is "intoxicado" — misread as "intoxicated"
   in a Florida ED in 1980, contributing to a misdiagnosed brain bleed and a
   landmark malpractice settlement. */
const FALSE_FRIENDS = [
  { es:'intoxicado', wrong:'intoxicated (drunk)', right:'poisoned, or sick from something ingested',
    note:'The most cited error in medical interpreting. Family meant food poisoning; it was heard as drunk.' },
  { es:'constipado', wrong:'constipated', right:'congested / has a head cold',
    note:'For constipation, Spanish uses estreñido.' },
  { es:'embarazada', wrong:'embarrassed', right:'pregnant',
    note:'For embarrassed, use avergonzado/a.' },
  { es:'molestar', wrong:'to molest', right:'to bother or disturb',
    note:'"¿Le molesta?" simply means "Does it bother you?"' },
  { es:'droga', wrong:'drug (medication)', right:'illegal drug',
    note:'For prescribed medication use medicamento or medicina.' },
  { es:'condición', wrong:'medical condition', right:'state, status, or stipulation',
    note:'For a medical condition use enfermedad, afección, or padecimiento.' },
  { es:'sano', wrong:'sane', right:'healthy',
    note:'For mentally sound, use cuerdo.' },
  { es:'sensible', wrong:'sensible / reasonable', right:'sensitive',
    note:'For sensible use razonable or sensato.' },
  { es:'severo', wrong:'severe', right:'strict or harsh (traditionally)',
    note:'Grave or intenso are safer for clinical severity, though severo is now common.' },
  { es:'preservativo', wrong:'preservative', right:'condom',
    note:'For a food preservative use conservante.' },
  { es:'remover', wrong:'to remove', right:'to stir or agitate',
    note:'To remove is quitar, extirpar, or extraer.' },
  { es:'realizar', wrong:'to realize (become aware)', right:'to carry out or perform',
    note:'To realize is darse cuenta.' },
  { es:'asistir', wrong:'to assist', right:'to attend',
    note:'To assist is ayudar or atender.' },
  { es:'soportar', wrong:'to support', right:'to tolerate or endure',
    note:'To support is apoyar or sostener.' },
  { es:'actual', wrong:'actual / real', right:'current or present',
    note:'For actual use real or verdadero.' },
  { es:'disgusto', wrong:'disgust', right:'annoyance or upset',
    note:'For disgust use asco or repugnancia.' },
  { es:'contestar', wrong:'to contest', right:'to answer',
    note:'To contest is impugnar or disputar.' },
  { es:'recordar', wrong:'to record', right:'to remember or remind',
    note:'To record is grabar or registrar.' },
  { es:'pretender', wrong:'to pretend', right:'to intend or aim to',
    note:'To pretend is fingir.' },
  { es:'lectura', wrong:'lecture', right:'reading (including a meter or test reading)',
    note:'A lecture is a conferencia or charla.' },
  { es:'vaso', wrong:'vase', right:'glass, or blood vessel',
    note:'Vaso sanguíneo is a blood vessel; a vase is a florero.' },
  { es:'desgracia', wrong:'disgrace', right:'misfortune or tragedy',
    note:'Disgrace is deshonra or vergüenza.' }
];

function findFalseFriends(text){
  const q = (text||'').toLowerCase().trim();
  if(!q) return [];
  return FALSE_FRIENDS.filter(f=>{
    const es = f.es.toLowerCase();
    // Match the Spanish term, or the English word it's commonly mistaken for.
    const wrongWord = f.wrong.split('(')[0].trim().toLowerCase().replace(/^to /,'');
    return q === es || q.includes(es) ||
           q === wrongWord || (wrongWord.length > 4 && q.includes(wrongWord));
  }).slice(0, 2);
}

/* ============ Translate lookup ============
   Deliberately checks the team's own glossary before reaching for machine
   translation. For terms like "Duffy-null associated neutrophil count", a
   colleague-verified entry is far more trustworthy than generic MT — that
   gap is the whole reason this glossary exists. MT is offered only as a
   fallback, and clearly labelled as unverified. */
const TR_LANGS = [
  { code:'en', name:'English' },
  { code:'es', name:'Spanish' },
  { code:'ar', name:'Arabic' },
  { code:'fr', name:'French' },
  { code:'pt', name:'Portuguese' },
  { code:'zh', name:'Chinese' },
  { code:'ko', name:'Korean' },
  { code:'it', name:'Italian' },
  { code:'pl', name:'Polish' },
  { code:'hi', name:'Hindi' },
  { code:'ru', name:'Russian' },
  { code:'tl', name:'Tagalog' }
];
let trFrom = 'en';
let trTo = 'es';
let trQuery = '';
let trContext = '';

function renderTranslate(){
  let html = `<div class="section-head"><h2>Translate</h2><span class="sub">glossary first</span></div>`;
  html += `<div class="tr-panel">`;
  html += `<div class="practice-disclaimer">${ICON_SHIELD}<span>A reference aid for building and studying the glossary. Machine translation is not a substitute for a qualified interpreter and should not be used for patient communication.</span></div>`;

  html += `
    <div class="tr-box">
      <div class="tr-row" style="margin-bottom:12px;">
        <select id="trFrom" onchange="trFrom=this.value">
          ${TR_LANGS.map(l=>`<option value="${l.code}" ${l.code===trFrom?'selected':''}>${l.name}</option>`).join('')}
        </select>
        <button class="tr-swap" title="Swap languages" onclick="swapTrLangs()">${ICON_SWAP}</button>
        <select id="trTo" onchange="trTo=this.value">
          ${TR_LANGS.map(l=>`<option value="${l.code}" ${l.code===trTo?'selected':''}>${l.name}</option>`).join('')}
        </select>
      </div>
      <div class="tr-row" style="margin-bottom:10px;">
        <input id="trInput" type="text" placeholder="Enter a word or phrase…" value="${escapeAttr(trQuery)}"
               onkeydown="if(event.key==='Enter'){event.preventDefault();runTranslate();}">
        <button class="btn btn-primary" onclick="runTranslate()">Translate</button>
      </div>
      <div class="tr-row">
        <input id="trContext" type="text" placeholder="Optional: the full sentence it appeared in — improves accuracy a lot"
               value="${escapeAttr(trContext)}"
               onkeydown="if(event.key==='Enter'){event.preventDefault();runTranslate();}">
      </div>
      <p class="tr-note" style="margin-top:8px;">Single words are the hardest case for any translation engine. "Discharge" alone could be a hospital discharge or a bodily one — the sentence tells it which.</p>
    </div>
    <div id="trResults"></div>
  `;
  html += `</div>`;
  return html;
}

function swapTrLangs(){
  const a = trFrom; trFrom = trTo; trTo = a;
  const q = document.getElementById('trInput');
  const ctx = document.getElementById('trContext');
  trQuery = q ? q.value : trQuery;
  trContext = ctx ? ctx.value : trContext;
  renderContent();
}

// Looks for the term in the team's own glossary, matching either direction.
function searchGlossary(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const hits = [];
  DATA.categories.forEach(cat=>{
    cat.terms.forEach((t, idx)=>{
      const en = (t.en||'').toLowerCase();
      const es = (t.es||'').toLowerCase();
      const exact = en === q || es === q;
      const partial = en.includes(q) || es.includes(q);
      if(exact || partial) hits.push({ t, cat, idx, exact });
    });
  });
  hits.sort((a,b)=> (b.exact - a.exact) || collateTerms(a.t.en, b.t.en));
  return hits.slice(0, 5);
}

// Calls the AI terminology endpoint. Returns null if it isn't set up, so the
// app falls back to the free translation path rather than breaking.
let aiAvailable = null;   // null = untested, false = unavailable this session

async function aiTranslate(text, context, from, to){
  if(aiAvailable === false) return null;
  try{
    const res = await fetch('/api/translate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text, context, from, to })
    });
    if(res.status === 503 || res.status === 404){
      aiAvailable = false;   // not configured — stop retrying this session
      return null;
    }
    if(!res.ok) return null;
    const data = await res.json();
    if(data && data.error) return null;
    aiAvailable = true;
    return data;
  }catch(err){
    aiAvailable = false;
    return null;
  }
}

// Single shared call so the forward and reverse translations use identical logic.
async function mtTranslate(text, from, to){
  try{
    const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`);
    const data = await res.json();
    const out = data && data.responseData && data.responseData.translatedText;
    if(!out || /INVALID|QUERY LENGTH|MYMEMORY WARNING|NO QUERY/i.test(out)) return null;
    return out;
  }catch(err){
    return null;
  }
}

const normalizeForCompare = s => (s||'').toLowerCase().replace(/[^\p{L}\p{N} ]/gu,'').trim();

async function runTranslate(){
  const input = document.getElementById('trInput');
  const ctxEl = document.getElementById('trContext');
  const out = document.getElementById('trResults');
  if(!input || !out) return;
  const q = input.value.trim();
  const ctx = ctxEl ? ctxEl.value.trim() : '';
  trQuery = q; trContext = ctx;
  if(!q){ out.innerHTML = ''; return; }

  // With context supplied, translate the sentence — engines disambiguate far
  // better with surrounding words than with a bare term.
  const toTranslate = ctx || q;
  const gtUrl = `https://translate.google.com/?sl=${trFrom}&tl=${trTo}&text=${encodeURIComponent(toTranslate)}&op=translate`;

  let html = '';

  // 1. False-friend warnings come first — these are the errors that cause harm.
  const traps = findFalseFriends(q).concat(ctx ? findFalseFriends(ctx) : []);
  const seenTraps = new Set();
  traps.forEach(f=>{
    if(seenTraps.has(f.es)) return;
    seenTraps.add(f.es);
    html += `
      <div class="tr-result trap">
        <span class="tr-badge trap">${ICON_ALERT} False friend — check carefully</span>
        <p class="tr-target" style="font-size:18px;">${escapeHtml(f.es)}</p>
        <p class="tr-note"><b>Often mistaken for:</b> ${escapeHtml(f.wrong)}<br>
        <b>Actually means:</b> ${escapeHtml(f.right)}</p>
        <p class="tr-note">${escapeHtml(f.note)}</p>
      </div>`;
  });

  // 2. The team's verified glossary.
  const hits = searchGlossary(q);
  hits.forEach(h=>{
    const isEnQuery = (h.t.en||'').toLowerCase().includes(q.toLowerCase());
    const primary = isEnQuery ? (h.t.es || h.t.en) : (h.t.en || h.t.es);
    const secondary = isEnQuery ? h.t.en : h.t.es;
    html += `
      <div class="tr-result verified">
        <span class="tr-badge verified">${ICON_CHECK} Your team's glossary</span>
        <p class="tr-source">${escapeHtml(secondary || '')}</p>
        <p class="tr-target">${escapeHtml(primary || '')}</p>
        ${h.t.def ? `<p class="tr-note">${escapeHtml(h.t.def)}</p>` : ''}
        <div class="tr-actions">
          <button class="tr-mini" onclick="setCategory('${h.cat.id}')">Open in ${escapeHtml(h.cat.name.split(',')[0])}</button>
          ${primary ? `<button class="tr-mini" onclick="copyText(this, ${JSON.stringify(primary).replace(/"/g,'&quot;')})">${ICON_COPY} Copy</button>` : ''}
        </div>
      </div>`;
  });

  if(!hits.length){
    html += `<div class="tr-result"><p class="tr-note">Not in your team's glossary yet — a good candidate to add.</p></div>`;
  }

  out.innerHTML = html + `<div class="tr-result"><span class="tr-badge ai">${ICON_SPARK} Looking up…</span><p class="tr-target"><span class="tr-spinner"></span></p></div>`;

  // 3. AI terminology breakdown, if the endpoint is configured.
  const ai = await aiTranslate(q, ctx, trFrom, trTo);
  if(ai && (ai.primary || ai.notes)){
    html += `
      <div class="tr-result ai">
        <span class="tr-badge ai">${ICON_SPARK} Interpreter reference — AI assisted</span>
        <p class="tr-source">${escapeHtml(toTranslate)}</p>
        <p class="tr-target">${escapeHtml(ai.primary || '')}</p>
        ${ai.plain ? `<p class="tr-note"><b>Plain language:</b> ${escapeHtml(ai.plain)}</p>` : ''}
        ${ai.register ? `<p class="tr-note"><b>Register:</b> ${escapeHtml(ai.register)}</p>` : ''}
        ${ai.regional ? `<p class="tr-note"><b>Regional:</b> ${escapeHtml(ai.regional)}</p>` : ''}
        ${ai.caution ? `<p class="tr-note tr-caution"><b>Caution:</b> ${escapeHtml(ai.caution)}</p>` : ''}
        ${ai.notes ? `<p class="tr-note">${escapeHtml(ai.notes)}</p>` : ''}
        <div class="tr-actions">
          ${ai.primary ? `<button class="tr-mini" onclick="copyText(this, ${JSON.stringify(ai.primary).replace(/"/g,'&quot;')})">${ICON_COPY} Copy</button>` : ''}
          <button class="tr-mini" onclick="addTermFromTranslate(${JSON.stringify(q).replace(/"/g,'&quot;')}, ${JSON.stringify((ai.primary)||'').replace(/"/g,'&quot;')})">+ Add to glossary</button>
        </div>
        <p class="tr-note" style="margin-top:10px;opacity:.75;">AI-generated reference. Verify before adding to the glossary.</p>
      </div>`;
    out.innerHTML = html + `<div class="tr-result"><span class="tr-badge machine">${ICON_GLOBE} Machine translation</span><p class="tr-target"><span class="tr-spinner"></span></p></div>`;
  }

  // 4. Machine translation, then a back-translation as a sanity check.
  const mt = await mtTranslate(toTranslate, trFrom, trTo);
  let back = null, drift = false;
  if(mt){
    back = await mtTranslate(mt, trTo, trFrom);
    if(back) drift = normalizeForCompare(back) !== normalizeForCompare(toTranslate);
  }

  html += `
    <div class="tr-result">
      <span class="tr-badge machine">${ICON_GLOBE} Machine translation — unverified</span>
      ${mt
        ? `<p class="tr-source">${escapeHtml(toTranslate)}</p>
           <p class="tr-target">${escapeHtml(mt)}</p>
           ${back ? `<p class="tr-note"><b>Translated back:</b> "${escapeHtml(back)}"${
              drift
                ? ` — <span style="color:var(--danger);font-weight:600;">this differs from what you typed, so treat the translation with caution.</span>`
                : ` — round-trips cleanly, a reasonable sign it held its meaning.`
            }</p>` : ''}
           <p class="tr-note">Automatically generated. Confirm before relying on it, and consider adding a verified entry to the glossary.</p>`
        : `<p class="tr-note">Automatic translation isn’t available right now. Use Google Translate below.</p>`}
      <div class="tr-actions">
        <a class="tr-mini" href="${escapeAttr(gtUrl)}" target="_blank" rel="noopener">${ICON_EXTERNAL} Open in Google Translate</a>
        ${mt ? `<button class="tr-mini" onclick="copyText(this, ${JSON.stringify(mt).replace(/"/g,'&quot;')})">${ICON_COPY} Copy</button>` : ''}
        <button class="tr-mini" onclick="addTermFromTranslate(${JSON.stringify(q).replace(/"/g,'&quot;')}, ${JSON.stringify(mt||'').replace(/"/g,'&quot;')})">+ Add to glossary</button>
      </div>
    </div>`;

  out.innerHTML = html;
}

function addTermFromTranslate(en, es){
  openAddModal();
  const enEl = document.getElementById('fEn');
  const esEl = document.getElementById('fEs');
  if(trFrom === 'en'){
    if(enEl) enEl.value = en;
    if(esEl && trTo === 'es') esEl.value = es || '';
  }else{
    if(enEl) enEl.value = (trTo === 'en' ? (es || '') : '');
    if(esEl && trFrom === 'es') esEl.value = en;
  }
}

    a:1, e:'A personal relationship is a potential conflict of interest. The professional standard is to disclose it promptly and withdraw if it could compromise impartiality.' },
  { d:'ethics', q:'A provider steps out and asks the interpreter to "just explain the consent form" to the patient. The interpreter should:',
    o:['Explain the form as clearly as possible','Decline, explaining that explaining the form is the provider\u2019s role','Summarize only the main points','Ask the patient to read it alone'],
    a:1, e:'Explaining a consent form is clinical communication and informed consent is the provider\u2019s legal responsibility. The interpreter interprets that explanation, but does not deliver it.' },
  { d:'ethics', q:'An interpreter feels distressed after interpreting a pediatric death notification. The most professionally appropriate step is to:',
    o:['Ignore it, since emotional reactions are unprofessional','Use self-care strategies and seek debriefing or support','Request never to be assigned to pediatrics again','Discuss the case with family to process it'],
    a:1, e:'Managing emotional well-being through self-monitoring, self-care, and appropriate support is an explicit part of the interpreter\u2019s professional responsibility. Discussing the case outside authorized channels would breach confidentiality.' },
  { d:'ethics', q:'Which situation most clearly justifies interpreter advocacy?',
    o:['The patient seems nervous about a procedure','The patient mentions dissatisfaction with wait times','The interpreter observes the patient being given another patient\u2019s medication','The provider speaks quickly'],
    a:2, e:'Advocacy is reserved for situations involving potential harm to the patient\u2019s health, dignity, or safety. A medication error is an immediate safety risk; the others are handled through normal interpreting or clarification.' },
  { d:'ethics', q:'After an encounter, a nurse asks the interpreter what the patient said about their home situation. The interpreter should:',
    o:['Share it, since the nurse is on the care team','Decline, and suggest the nurse ask the patient directly through an interpreter','Share only non-medical details','Write a summary for the chart'],
    a:1, e:'Confidentiality applies to everything learned in the encounter. Information should flow through the patient, not be relayed independently by the interpreter.' },
  { d:'ethics', q:'An interpreter is offered a gift by a grateful patient\u2019s family. The most appropriate action is generally to:',
    o:['Accept it to avoid causing offense','Politely decline, explaining professional policy','Accept it and share it with staff','Accept only if it is inexpensive'],
    a:1, e:'Accepting gifts can compromise, or appear to compromise, impartiality. The standard practice is a respectful decline that explains the professional boundary.' },

  // ---- Managing the Interpreting Encounter ----
  { d:'encounter', q:'A provider uses an acronym the interpreter does not recognize. The interpreter should:',
    o:['Guess based on context','Omit it and continue','Transparently ask the provider to clarify, then interpret the clarification','Interpret the acronym letter by letter'],
    a:2, e:'Managing unfamiliar terms transparently is a core competency. The interpreter pauses, identifies themself as needing clarification, and makes the exchange visible to both parties.' },
  { d:'encounter', q:'Which mode is generally most appropriate for a lengthy provider monologue during a treatment briefing where equipment is available?',
    o:['Consecutive','Simultaneous','Sight translation','Summary interpreting'],
    a:1, e:'Simultaneous interpreting suits extended one-directional speech such as briefings and educational monologues, preserving flow. Summary interpreting is not an accepted professional mode.' },
  { d:'encounter', q:'The patient begins speaking at length without pausing, exceeding the interpreter\u2019s memory capacity. The best action is to:',
    o:['Interpret only what is remembered','Politely intervene to request a pause, identifying the interpreter as the one speaking','Take detailed notes and wait until the end','Ask the provider to stop the patient'],
    a:1, e:'Managing flow is the interpreter\u2019s responsibility. Intervening transparently in the first person preserves accuracy and completeness.' },
  { d:'encounter', q:'Before an encounter begins, the interpreter should typically deliver a pre-session that includes:',
    o:['The interpreter\u2019s qualifications and rates','The interpreter\u2019s role, confidentiality, first-person interpreting, and the right to intervene','A summary of the patient\u2019s chart','Advice on how to answer the provider'],
    a:1, e:'A pre-session sets expectations: the interpreter\u2019s role, confidentiality, that everything will be interpreted, use of first person, and that the interpreter may intervene for clarification.' },
  { d:'encounter', q:'A remote telephonic encounter has poor audio quality and the interpreter cannot hear reliably. The interpreter should:',
    o:['Interpret what is audible and note gaps later','Disclose the limitation and request a fix or a different modality','Continue and ask the patient to speak louder only','End the call without explanation'],
    a:1, e:'Recognizing modality limitations and self-monitoring the ability to interpret accurately is required. Accuracy cannot be compromised for convenience.' },
  { d:'encounter', q:'A patient makes a remark to the interpreter in a side comment, saying "don\u2019t tell the doctor this." The interpreter should:',
    o:['Honor the request and keep it private','Interpret it, having explained in the pre-session that everything said will be interpreted','Ask the patient to decide at the end of the visit','Report it to the nurse afterward'],
    a:1, e:'Everything said in the encounter is interpreted. This is precisely why the pre-session establishes that expectation in advance.' },
  { d:'encounter', q:'The interpreter realizes they made an error earlier in the session. The correct action is to:',
    o:['Let it go if it seemed minor','Correct it openly and promptly, identifying the correction as the interpreter\u2019s','Correct it quietly in the next rendition','Mention it to the provider after the visit'],
    a:1, e:'Errors are disclosed and corrected transparently as soon as they are recognized, because accuracy outweighs the discomfort of self-correction.' },

  // ---- Healthcare Terminology ----
  { d:'terminology', q:'A patient is described as having "dyspnea on exertion." In plain terms this means:',
    o:['Chest pain when resting','Shortness of breath with activity','Dizziness when standing','Swelling in the legs'],
    a:1, e:'Dyspnea means difficult or labored breathing; "on exertion" indicates it occurs with physical activity.' },
  { d:'terminology', q:'The prefix "hypo-" in "hypoglycemia" indicates:',
    o:['Above normal','Below normal','Rapid onset','Chronic'],
    a:1, e:'Hypo- means under or below normal. Hypoglycemia is low blood glucose; hyperglycemia is high.' },
  { d:'terminology', q:'"NPO" written in a patient\u2019s orders means the patient should:',
    o:['Receive nothing by mouth','Be given pain medication as needed','Have no known allergies','Be placed on oxygen'],
    a:0, e:'NPO is from the Latin nil per os \u2014 nothing by mouth, typically before surgery or certain procedures.' },
  { d:'terminology', q:'"Benign" most accurately describes a growth that is:',
    o:['Spreading to other organs','Not cancerous','Rapidly growing','Resistant to treatment'],
    a:1, e:'Benign means non-cancerous and non-invasive, in contrast to malignant.' },
  { d:'terminology', q:'A patient is scheduled for a "biopsy." This procedure involves:',
    o:['Imaging the organ with sound waves','Removing tissue for examination','Measuring electrical heart activity','Draining fluid from the lungs'],
    a:1, e:'A biopsy removes a tissue sample for laboratory examination, often to determine whether cells are cancerous.' },
  { d:'terminology', q:'The suffix "-ectomy" indicates:',
    o:['Surgical removal','Visual examination','Surgical repair','Creation of an opening'],
    a:0, e:'-ectomy means surgical removal (appendectomy). Compare -oscopy (viewing), -plasty (repair), and -ostomy (creating an opening).' },
  { d:'terminology', q:'"Prognosis" refers to:',
    o:['The identification of the disease','The expected course and outcome of the condition','The treatment plan','The patient\u2019s medical history'],
    a:1, e:'Prognosis is the expected course or outcome. Diagnosis is the identification of the condition itself \u2014 a distinction interpreters must render precisely.' },
  { d:'terminology', q:'A provider says the patient is "afebrile." This means the patient:',
    o:['Has a fever','Does not have a fever','Is dehydrated','Has an infection'],
    a:1, e:'The prefix a- means without; febrile refers to fever. Afebrile means without fever.' },

  // ---- U.S. Health Systems ----
  { d:'systems', q:'Under Title VI of the Civil Rights Act of 1964, healthcare organizations receiving federal funds must:',
    o:['Provide interpreters only for Spanish speakers','Take reasonable steps to provide meaningful access for people with limited English proficiency','Charge patients for language services','Use only bilingual staff'],
    a:1, e:'Title VI prohibits national-origin discrimination, which has been interpreted to require meaningful language access for LEP patients \u2014 and patients cannot be charged for it.' },
  { d:'systems', q:'HIPAA primarily governs:',
    o:['Hospital accreditation standards','The privacy and security of protected health information','Medicare reimbursement rates','Interpreter certification requirements'],
    a:1, e:'HIPAA establishes national standards for protecting patient health information, which directly shapes interpreter confidentiality obligations.' },
  { d:'systems', q:'A patient without insurance arrives at an emergency department with a serious condition. Under EMTALA, the hospital must:',
    o:['Transfer the patient immediately','Provide a medical screening exam and stabilizing treatment regardless of ability to pay','Require payment before treatment','Refer the patient to a clinic'],
    a:1, e:'EMTALA requires a medical screening examination and stabilization of emergency conditions regardless of insurance or ability to pay.' },
  { d:'systems', q:'Which best describes the role of an advance directive?',
    o:['A bill for services rendered','A document stating a patient\u2019s wishes for future medical care if unable to communicate','A referral to a specialist','A record of immunizations'],
    a:1, e:'An advance directive documents a patient\u2019s treatment preferences and may designate a healthcare proxy in case they become unable to communicate.' },

  // ---- Cultural Responsiveness ----
  { d:'cultural', q:'A patient mentions using a traditional remedy alongside prescribed medication. The interpreter should:',
    o:['Omit it to avoid embarrassing the patient','Interpret it accurately so the provider can assess interactions','Advise the patient to stop using it','Explain the remedy to the provider personally'],
    a:1, e:'The information is clinically relevant \u2014 traditional remedies can interact with prescriptions. The interpreter renders it faithfully without editorializing.' },
  { d:'cultural', q:'A provider appears confused when a patient avoids eye contact. The most appropriate interpreter action is to:',
    o:['Explain the patient\u2019s culture to the provider','Continue interpreting and, if a genuine misunderstanding affects care, transparently note that a cultural difference may be present','Tell the patient to make eye contact','Ignore it entirely'],
    a:1, e:'Interpreters may act as cultural mediators when a misunderstanding genuinely impedes communication, intervening transparently \u2014 but they avoid generalizing about a patient\u2019s culture or making assumptions.' },
  { d:'cultural', q:'Two patients speak the same language but use different words for a body part. This most likely reflects:',
    o:['One patient\u2019s poor education','Regional or dialectal variation','A patient error','A translation mistake'],
    a:1, e:'Languages vary regionally and among communities. Interpreters must recognize variation and clarify meaning rather than assume error or judge proficiency.' },
  { d:'cultural', q:'A family asks that the patient not be told a terminal diagnosis, which conflicts with the provider\u2019s plan. The interpreter should:',
    o:['Support the family\u2019s wishes','Interpret both perspectives accurately so the parties can resolve it','Decide based on the patient\u2019s culture','Withhold the diagnosis when interpreting'],
    a:1, e:'The interpreter conveys all parties\u2019 positions faithfully. Resolving the conflict between family expectations and disclosure requirements belongs to the provider and care team, not the interpreter.' },
  // ---- Professional Responsibility & Ethics (additional) ----
  { d:'ethics', q:'A provider hands the interpreter a consent form and asks them to sign as a witness. The interpreter should:',
    o:['Sign, since they were present','Decline witnessing the consent itself, and instead attest only to having interpreted accurately if a designated interpreter line exists','Sign on the patient\u2019s behalf','Refuse to participate further in the encounter'],
    a:1, e:'Witnessing consent is a clinical/legal function. Many forms include a separate interpreter attestation line confirming accurate interpretation \u2014 that is what the interpreter may sign.' },
  { d:'ethics', q:'The interpreter notices the provider state a medication dose that appears inconsistent with what was said moments earlier. The interpreter should:',
    o:['Interpret exactly what was said and say nothing','Transparently flag the possible discrepancy so the provider can verify','Correct the dose while interpreting','Ask the patient which dose sounds right'],
    a:1, e:'Interpreters do not alter content, but a potential safety discrepancy warrants a transparent intervention so the provider can confirm. This is clarification for safety, not advocacy or editing.' },
  { d:'ethics', q:'A patient asks the interpreter for a ride home after the appointment. The most appropriate response is to:',
    o:['Provide the ride to be helpful','Politely decline and refer the request to staff or social services','Provide the ride only if it is on the way','Ask the provider for permission'],
    a:1, e:'Transporting patients falls outside the interpreter role and creates liability and boundary problems. Redirecting to the appropriate department preserves the role while still helping.' },
  { d:'ethics', q:'An interpreter is assigned to a highly technical oncology consultation and does not feel competent in that subject matter. The interpreter should:',
    o:['Accept and do their best','Disclose the limitation and decline or request a more qualified interpreter','Accept and research terms during the encounter','Accept but interpret only the simpler portions'],
    a:1, e:'Self-monitoring one\u2019s ability to interpret in a given encounter is an explicit professional duty. Accepting work beyond one\u2019s competence risks patient harm.' },
  { d:'ethics', q:'Which best describes the purpose of continuing education requirements for certified interpreters?',
    o:['To increase certification revenue','To keep skills, terminology, and knowledge of regulations current','To satisfy employers only','To replace the original certification exam'],
    a:1, e:'Maintaining credentials and pursuing professional growth keeps interpreters current on working languages, legislation, healthcare systems, and public health guidance.' },
  { d:'ethics', q:'Before entering an isolation room, the interpreter should:',
    o:['Interpret from the doorway to avoid risk','Follow the same standard precautions and PPE protocols required of clinical staff','Ask the patient to step outside','Refuse the assignment'],
    a:1, e:'Adhering to personal and occupational safety measures, including standard precautions, is part of professional responsibility. Interpreting from the doorway would compromise accuracy and privacy.' },
  { d:'ethics', q:'A provider leaves the room and asks the interpreter to "keep an eye on" the patient\u2019s young child. The interpreter should:',
    o:['Agree, since it is a small favor','Decline, as supervising a child is outside the interpreter role','Agree only briefly','Take the child to the waiting area'],
    a:1, e:'Supervising a child creates liability and pulls the interpreter out of role. Declining respectfully and redirecting to staff is appropriate.' },
  { d:'ethics', q:'An interpreter strongly disagrees with a patient\u2019s decision to refuse a recommended treatment. The interpreter should:',
    o:['Encourage the patient to reconsider','Interpret the refusal accurately without conveying personal judgment','Tell the provider the patient is making a mistake','Ask the family to intervene'],
    a:1, e:'Impartiality requires suspending one\u2019s own values and beliefs. The patient has the right to refuse, and the interpreter conveys that faithfully.' },
  { d:'ethics', q:'Posting a de-identified but detailed anecdote about an unusual case on social media is:',
    o:['Acceptable if no name is used','A confidentiality risk, because details may still identify the patient','Acceptable within private groups','Encouraged for professional learning'],
    a:1, e:'Removing a name does not guarantee de-identification. Unusual details can identify a patient, so sharing encounter specifics publicly breaches confidentiality.' },
  { d:'ethics', q:'A patient asks the interpreter to call the pharmacy on their behalf after the visit. The interpreter should:',
    o:['Make the call as a courtesy','Decline and direct the patient to appropriate staff or a language line','Make the call only if brief','Give the patient the interpreter\u2019s personal number'],
    a:1, e:'Performing errands for patients extends beyond the interpreter role and creates dependency and liability. Referral to the right resource is the professional response.' },
  { d:'ethics', q:'An interpreter also works part-time for a medical device company whose product is being discussed in an encounter. This is best described as:',
    o:['Irrelevant to the assignment','A conflict of interest that should be disclosed','A benefit, given the product knowledge','A confidentiality issue only'],
    a:1, e:'A financial or professional interest in the subject of the encounter is a conflict of interest and must be disclosed so it can be managed.' },
  { d:'ethics', q:'An interpreter recognizes that they hold a personal bias about a patient\u2019s lifestyle. The professional response is to:',
    o:['Request reassignment for every such patient','Consciously suspend the bias and interpret faithfully, seeking support or reassignment if impartiality cannot be maintained','Mention the bias to the provider','Interpret more briefly to limit involvement'],
    a:1, e:'Impartiality involves recognizing and actively suspending one\u2019s own values and biases. If genuine impartiality is impossible, withdrawal is appropriate.' },
  { d:'ethics', q:'During an encounter, a patient discloses information suggesting a child may be being harmed. The interpreter should:',
    o:['Report it directly to authorities','Interpret the disclosure accurately and completely so the provider, who is a mandated reporter, can act','Ask the patient clarifying questions first','Keep it confidential'],
    a:1, e:'The interpreter\u2019s duty is complete and accurate interpretation so the clinical team \u2014 who hold mandated reporting duties \u2014 receives the information. Interpreters should also know their own jurisdiction\u2019s reporting obligations.' },
  { d:'ethics', q:'The primary purpose of a professional code of ethics for healthcare interpreters is to:',
    o:['Protect interpreters from lawsuits','Guide decision-making that supports patient safety, communication, and professional integrity','Standardize interpreter pay','Define required vocabulary lists'],
    a:1, e:'Codes of ethics provide a framework for resolving dilemmas in ways that protect patients and uphold the profession\u2019s integrity.' },
  { d:'ethics', q:'An interpreter is running late and the provider suggests "just summarizing the key points" to save time. The interpreter should:',
    o:['Summarize as requested','Explain that complete and accurate interpretation is required, not summary','Summarize only the provider\u2019s speech','Ask the patient which parts matter'],
    a:1, e:'Summarizing omits content and undermines accuracy and informed consent. Time pressure does not justify incomplete interpretation.' },
  { d:'ethics', q:'After a distressing encounter, the healthiest professional practice is to:',
    o:['Discuss specifics with family to decompress','Use approved debriefing channels, peer support, or employee assistance while preserving confidentiality','Avoid thinking about it entirely','Post about it anonymously online'],
    a:1, e:'Self-care and debriefing are encouraged, but must occur through channels that preserve patient confidentiality.' },

  // ---- Managing the Interpreting Encounter (additional) ----
  { d:'encounter', q:'Standard practice is for the interpreter to render speech in:',
    o:['Third person, to show neutrality','First person, as if speaking as the original speaker','Whichever the provider prefers','Third person for the patient, first for the provider'],
    a:1, e:'First-person interpreting keeps communication direct between provider and patient and reduces confusion about who is speaking. The interpreter refers to themself in the third person when intervening.' },
  { d:'encounter', q:'A provider says to the interpreter, "Tell her she needs to take this twice a day." The interpreter should:',
    o:['Say "he says you need to take this twice a day"','Interpret in first person as "You need to take this twice a day," and if the pattern persists, remind the provider to address the patient directly','Ask the provider to rephrase every time','Interpret only the medical content'],
    a:1, e:'The interpreter renders the message in the first person and may transparently remind parties to speak directly to one another, which supports a direct provider-patient relationship.' },
  { d:'encounter', q:'When a patient uses informal or colloquial language, the interpreter should:',
    o:['Elevate the register to sound more professional','Preserve the speaker\u2019s register and meaning as closely as possible','Simplify it for the provider','Omit slang entirely'],
    a:1, e:'Register is part of the message. Altering it can change the provider\u2019s clinical impression of the patient and misrepresents the speaker.' },
  { d:'encounter', q:'The generally recommended physical positioning for an on-site interpreter is:',
    o:['Directly between provider and patient','Beside or slightly behind the patient, supporting direct provider-patient eye contact','In a corner out of view','Seated at the provider\u2019s desk'],
    a:1, e:'Positioning should keep the interpreter unobtrusive while allowing the provider and patient to communicate directly with each other.' },
  { d:'encounter', q:'A family member and the patient begin speaking at the same time. The interpreter should:',
    o:['Interpret whoever is loudest','Intervene transparently to manage turn-taking so each speaker is interpreted','Interpret only the patient','Summarize both'],
    a:1, e:'Managing the flow of communication is the interpreter\u2019s responsibility. A transparent intervention restores order without omitting anyone.' },
  { d:'encounter', q:'Sight translation refers to:',
    o:['Writing a translation of a document','Reading a written document aloud in the target language','Interpreting simultaneously','Summarizing a document\u2019s contents'],
    a:1, e:'Sight translation is the oral rendering of a written text. It differs from written translation and from summarizing.' },
  { d:'encounter', q:'Note-taking during consecutive interpreting is best used to:',
    o:['Create a permanent record of the encounter','Support memory for numbers, names, dosages, and sequences','Document the provider\u2019s errors','Prepare a written summary for the chart'],
    a:1, e:'Notes support accuracy for detail-heavy content and are destroyed afterward per confidentiality practice. They are not a medical record.' },
  { d:'encounter', q:'A patient uses profanity while describing their frustration. The interpreter should:',
    o:['Soften it to remain professional','Interpret it faithfully, preserving the force of the message','Omit it','Ask the patient to rephrase'],
    a:1, e:'Emotional intensity is clinically relevant. Softening or omitting language changes the message the provider receives.' },
  { d:'encounter', q:'In a very long or emotionally intense assignment, team interpreting is used primarily to:',
    o:['Reduce cost','Maintain accuracy by managing interpreter fatigue','Allow two languages at once','Satisfy accreditation requirements'],
    a:1, e:'Cognitive fatigue degrades accuracy. Team interpreting with periodic hand-offs protects the quality of the rendition.' },
  { d:'encounter', q:'During a video remote encounter, the interpreter cannot see the patient\u2019s gestures because of the camera angle. The interpreter should:',
    o:['Continue and infer meaning','Request that the camera be adjusted, explaining why visual access matters','Switch to audio only','End the session'],
    a:1, e:'Recognizing and addressing modality limitations is required. Visual cues affect comprehension, so requesting adjustment supports accuracy.' },
  { d:'encounter', q:'A patient asks the interpreter, "What did the doctor just say? I did not understand." The interpreter should:',
    o:['Explain it in simpler words','Interpret the patient\u2019s statement so the provider can re-explain','Repeat the interpretation more slowly only','Tell the patient to ask later'],
    a:1, e:'The patient\u2019s lack of understanding is itself information the provider needs. Explaining clinical content personally would step outside the role.' },
  { d:'encounter', q:'The interpreter encounters a term with no direct equivalent in the target language. The best approach is to:',
    o:['Skip the term','Provide the closest rendering plus a brief transparent explanation, and request clarification if needed','Substitute a similar-sounding word','Ask the patient to guess'],
    a:1, e:'Managing untranslatable concepts transparently \u2014 conveying meaning and flagging the gap \u2014 preserves accuracy without inventing content.' },
  { d:'encounter', q:'The interpreter should intervene in an encounter when:',
    o:['They disagree with the treatment plan','They need clarification, need to correct an error, or communication has broken down','The encounter is running long','The patient seems upset'],
    a:1, e:'Interventions are appropriate for clarification, self-correction, and communication breakdown \u2014 always announced transparently in the third person.' },
  { d:'encounter', q:'A pronoun in the source language is ambiguous about who is being referred to. The interpreter should:',
    o:['Choose the most likely referent','Ask the speaker to clarify before interpreting','Interpret both possibilities','Use a gender-neutral pronoun'],
    a:1, e:'Guessing risks a clinically meaningful error. A brief transparent clarification request resolves the ambiguity accurately.' },
  { d:'encounter', q:'Which mode is generally most appropriate for a back-and-forth history-taking dialogue?',
    o:['Simultaneous','Consecutive','Sight translation','Written translation'],
    a:1, e:'Consecutive interpreting suits turn-taking dialogue, which is why it is the dominant mode in healthcare encounters.' },
  { d:'encounter', q:'At the close of an encounter, an appropriate interpreter action is to:',
    o:['Summarize the visit for the patient','Confirm no further communication is needed, then dispose of notes securely','Give the patient the interpreter\u2019s contact details','Review the chart for accuracy'],
    a:1, e:'Interpreters do not summarize clinical content. Securely destroying notes protects confidentiality.' },
  { d:'encounter', q:'A pre-session with the provider is most useful for:',
    o:['Reviewing the patient\u2019s diagnosis','Clarifying the interpreter\u2019s role, positioning, and how interventions will be signaled','Agreeing on which content to omit','Discussing the interpreter\u2019s opinion of the case'],
    a:1, e:'A brief provider pre-session sets logistics and expectations so the encounter runs smoothly, without discussing content to omit.' },

  // ---- Healthcare Terminology (additional) ----
  { d:'terminology', q:'The suffix "-itis" indicates:',
    o:['Inflammation','Surgical removal','Tumor','Pain'],
    a:0, e:'-itis means inflammation, as in dermatitis or appendicitis. -oma indicates tumor and -algia indicates pain.' },
  { d:'terminology', q:'"Tachycardia" refers to:',
    o:['A slow heart rate','A rapid heart rate','An irregular heartbeat','Chest pain'],
    a:1, e:'Tachy- means rapid; brady- means slow. Tachycardia is an abnormally fast heart rate.' },
  { d:'terminology', q:'A patient with "hypotension" has:',
    o:['High blood pressure','Low blood pressure','High blood sugar','Low oxygen'],
    a:1, e:'Hypo- means below normal; tension here refers to blood pressure. Hypertension is the elevated form.' },
  { d:'terminology', q:'"Edema" describes:',
    o:['Bleeding under the skin','Swelling from fluid accumulation','Skin redness','Muscle wasting'],
    a:1, e:'Edema is swelling caused by excess fluid in body tissues, commonly seen in the legs, ankles, or feet.' },
  { d:'terminology', q:'A medication ordered "PRN" should be given:',
    o:['Every night','As needed','Immediately','By mouth'],
    a:1, e:'PRN is from the Latin pro re nata \u2014 as the situation requires, or as needed.' },
  { d:'terminology', q:'An order marked "STAT" means it should be carried out:',
    o:['Within 24 hours','Immediately','At the next scheduled round','Only if the patient requests it'],
    a:1, e:'STAT derives from the Latin statim, meaning immediately \u2014 a distinction with direct safety consequences.' },
  { d:'terminology', q:'A "CBC" is a laboratory test that measures:',
    o:['Blood glucose over three months','Components of the blood such as red cells, white cells, and platelets','Cholesterol levels','Kidney filtration rate'],
    a:1, e:'A complete blood count evaluates red blood cells, white blood cells, hemoglobin, hematocrit, and platelets.' },
  { d:'terminology', q:'"Local anesthesia" differs from "general anesthesia" in that local anesthesia:',
    o:['Renders the patient fully unconscious','Numbs a specific area while the patient remains awake','Is given only to children','Requires a ventilator'],
    a:1, e:'Local anesthesia numbs a limited area with the patient awake; general anesthesia produces controlled unconsciousness.' },
  { d:'terminology', q:'A "contraindication" is:',
    o:['A reason a treatment should not be used','A side effect of a medication','An alternative treatment','A required follow-up test'],
    a:0, e:'A contraindication is a specific situation in which a drug or procedure should be avoided because of potential harm.' },
  { d:'terminology', q:'A condition described as "chronic" is one that:',
    o:['Comes on suddenly and resolves quickly','Persists over a long period','Is contagious','Is life-threatening'],
    a:1, e:'Chronic conditions are long-lasting or recurrent; acute conditions have rapid onset and shorter duration.' },
  { d:'terminology', q:'The suffix "-ology" means:',
    o:['The study of','Inflammation of','Surgical repair of','Removal of'],
    a:0, e:'-ology means the study of, as in cardiology (heart) or nephrology (kidneys).' },
  { d:'terminology', q:'A "lesion" refers to:',
    o:['An area of abnormal tissue','A surgical instrument','A type of medication','A diagnostic imaging test'],
    a:0, e:'A lesion is any region of tissue damaged or altered by injury or disease. It is not inherently cancerous.' },
  { d:'terminology', q:'"NKDA" documented in a chart indicates:',
    o:['No known drug allergies','Not keeping daily appointments','Needs kidney dialysis assessment','New knee diagnosis added'],
    a:0, e:'NKDA means no known drug allergies \u2014 a critical safety notation.' },
  { d:'terminology', q:'"Myocardial infarction" is commonly known as:',
    o:['A stroke','A heart attack','A blood clot in the leg','An irregular heartbeat'],
    a:1, e:'Myo- (muscle) + cardial (heart) + infarction (tissue death from lost blood supply) \u2014 a heart attack.' },
  { d:'terminology', q:'A provider asks whether the patient has been able to "void." This refers to:',
    o:['Eating solid food','Urinating','Sleeping through the night','Walking unassisted'],
    a:1, e:'To void means to empty the bladder. Interpreters should render it in language the patient will understand.' },
  { d:'terminology', q:'"Palliative care" focuses primarily on:',
    o:['Curing the underlying disease','Relieving symptoms and improving quality of life','Emergency stabilization','Preventive screening'],
    a:1, e:'Palliative care manages symptoms and supports quality of life, and may be provided alongside curative treatment \u2014 it is not limited to end of life.' },
  { d:'terminology', q:'The abbreviation "BID" on a prescription means the medication is taken:',
    o:['Once daily','Twice daily','Three times daily','Before meals'],
    a:1, e:'BID is bis in die \u2014 twice a day. TID is three times daily and QID is four times daily.' },

  // ---- U.S. Health Systems (additional) ----

function genId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// One-time, automatic, and safe: gives any term saved before attachments
// existed a stable id (so a file can be tied to that exact term even if
// it's later edited, reordered, or the list around it changes). Doesn't
// touch any existing content — only adds a new field where it's missing.
function ensureTermIds(){
  let migrated = false;
  DATA.categories.forEach(cat=>{
    cat.terms.forEach(t=>{
      if(!t.id){ t.id = genId(); migrated = true; }
    });
  });
  return migrated;
}

async function loadData(){
  try{
    if(!db){
      // No Firestore in this environment (e.g. this preview) — fall back to
      // the old single-blob path so the app still shows something.
      const result = await window.storage.get(STORAGE_KEY, true);
      DATA = (result && result.value) ? JSON.parse(result.value) : DEFAULT_DATA;
      ensureTermIds();
      render();
      return;
    }

    const metaSnap = await db.collection('terminology-meta').doc('categories').get();

    if(!metaSnap.exists){
      // First run on the new schema — migrate once from the old single-blob
      // storage (or seed fresh) so nobody's existing content is lost.
      let legacyData = null;
      try{
        const result = await window.storage.get(STORAGE_KEY, true);
        if(result && result.value) legacyData = JSON.parse(result.value);
      }catch(e){}
      const source = legacyData || DEFAULT_DATA;
      await migrateToPerTermStorage(source);
    }

    await loadCategoriesMeta();
    await loadAllTerms();
    startTermsListener();
    startCategoriesMetaListener();
    render();
  }catch(err){
    console.error('loadData failed:', err);
    DATA = DEFAULT_DATA;
    render();
  }
}

// One-time migration from the old "one giant document" model to one
// Firestore document per term (plus a small shared doc for domain
// metadata). This is what actually fixes concurrent editing: two people
// saving different terms at the same time now write to different
// documents instead of both overwriting the same blob.
async function migrateToPerTermStorage(source){
  const categoriesMeta = source.categories.map(c=>({ id:c.id, name:c.name, color:c.color, icon:c.icon }));
  await db.collection('terminology-meta').doc('categories').set({ categories: categoriesMeta, updatedAt: Date.now() });

  const batchSize = 400; // Firestore batch limit is 500 writes
  let allTerms = [];
  source.categories.forEach(cat=>{
    cat.terms.forEach(t=>{
      if(!t.id) t.id = genId();
      allTerms.push({ ...t, categoryId: cat.id });
    });
  });
  for(let i=0; i<allTerms.length; i+=batchSize){
    const batch = db.batch();
    allTerms.slice(i, i+batchSize).forEach(t=>{
      const ref = db.collection('terms').doc(t.id);
      batch.set(ref, t);
    });
    await batch.commit();
  }
}

async function loadCategoriesMeta(){
  const snap = await db.collection('terminology-meta').doc('categories').get();
  const meta = snap.exists ? (snap.data().categories || []) : [];
  DATA = { categories: meta.map(c=>({ ...c, terms: [] })) };
}

async function loadAllTerms(){
  const snap = await db.collection('terms').get();
  applyTermsSnapshot(snap);
}

// Rebuilds each category's terms array from a Firestore snapshot. Keeps
// category order stable (order lives in terminology-meta, untouched here)
// and just refills which terms belong where — this is what makes real-time
// sync safe: nobody's array-index-based UI state points at the wrong term,
// because edit/delete now target terms by id, not by position.
function applyTermsSnapshot(snap){
  const byCategory = {};
  snap.forEach(doc=>{
    const t = { ...doc.data(), id: doc.id };
    const catId = t.categoryId;
    if(!byCategory[catId]) byCategory[catId] = [];
    byCategory[catId].push(t);
  });
  DATA.categories.forEach(cat=>{
    cat.terms = byCategory[cat.id] || [];
  });
}

let termsListenerStarted = false;
function startTermsListener(){
  if(termsListenerStarted || !db) return;
  termsListenerStarted = true;
  db.collection('terms').onSnapshot(snap=>{
    applyTermsSnapshot(snap);
    // A full render() (not just renderContent()) so sidebar term counts
    // and "All domains" totals stay live too, not just whatever's open.
    render();
  }, err=> console.error('terms listener error:', err));
}

let categoriesMetaListenerStarted = false;
function startCategoriesMetaListener(){
  if(categoriesMetaListenerStarted || !db) return;
  categoriesMetaListenerStarted = true;
  db.collection('terminology-meta').doc('categories').onSnapshot(snap=>{
    if(!snap.exists) return;
    const meta = snap.data().categories || [];
    const existingTerms = {};
    DATA.categories.forEach(c=>{ existingTerms[c.id] = c.terms; });
    DATA.categories = meta.map(c=>({ ...c, terms: existingTerms[c.id] || [] }));
    render();
  }, err=> console.error('categories-meta listener error:', err));
}

/* ============ Team Chat (real-time — this is the one section that
   uses Firestore's live listener instead of load-once, so messages
   appear for everyone without a refresh, Messenger-style).

   IMPORTANT: the listener callback below NEVER calls the full render()
   function. A background message arriving while someone is mid-edit
   elsewhere in the app (typing a term, filling out a modal) must not
   rebuild the whole page out from under them. It only touches the
   chat panel itself, or a single badge element, by id. ============ */
function startChatListener(){
  if(chatListenerStarted || !db) return;
  chatListenerStarted = true;
  db.collection('team-chat').orderBy('timestamp').onSnapshot(snap=>{
    CHAT_MESSAGES = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(isInitialChatLoad){
      isInitialChatLoad = false;
      lastSeenChatCount = CHAT_MESSAGES.length; // don't flag pre-existing history as "unread"
      // Seed the seen-set so opening the app never fires a burst of
      // notifications for the entire message history.
      CHAT_MESSAGES.forEach(m => notifiedMessageIds.add(m.id));
    }else{
      const me = whoAmI().trim().toLowerCase();
      CHAT_MESSAGES.forEach(m=>{
        if(notifiedMessageIds.has(m.id)) return;
        notifiedMessageIds.add(m.id);
        const mine = me && (m.author||'').trim().toLowerCase() === me;
        // No notification for your own message, and none while you're
        // already looking at the chat — the badge is enough there.
        if(mine) return;
        if(document.visibilityState === 'visible' && activeCategory === 'chat') return;
        showChatNotification(m);
      });
    }
    if(activeCategory === 'chat'){
      lastSeenChatCount = CHAT_MESSAGES.length;
      renderChatMessages();
    }
    updateChatBadge();
  }, err=>{
    console.error('Chat listener error:', err);
  });
}

function pulseBadge(badge){
  if(!badge) return;
  badge.classList.remove('bump');
  void badge.offsetWidth;      // restart the animation rather than ignoring it
  badge.classList.add('bump');
}

function updateChatBadge(){
  const badge = document.getElementById('chatBadge');
  if(!badge) return;
  const unread = Math.max(0, CHAT_MESSAGES.length - lastSeenChatCount);
  const next = String(unread > 0 ? unread : CHAT_MESSAGES.length);
  const changed = badge.textContent !== next;
  badge.textContent = next;
  badge.classList.toggle('unread', unread > 0);
  if(changed) pulseBadge(badge);   // only animate on a real change
}

/* ============ Attachments (terms, chat, notes) ============
   Files are uploaded to Cloud Storage; Firestore only ever stores a
   small download-link string, never the file itself. That's what
   removes the old ~700KB ceiling — Storage doesn't share Firestore's
   1MB-per-document limit. Images are still compressed client-side
   before upload purely for speed, not because of a size limit.
   MAX_PDF_BYTES below is just an abuse guard, not a real constraint. */
const MAX_PDF_BYTES = 25 * 1024 * 1024; // 25MB sanity cap

function compressImageToBlob(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Could not read that image.'));
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('Could not read that image.'));
      img.onload = ()=>{
        const maxDim = 1400;
        let w = img.width, h = img.height;
        if(w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob=>{
          if(!blob) reject(new Error('Could not process that image.'));
          else resolve(blob);
        }, 'image/jpeg', 0.85);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function readFileAsAttachment(file){
  if(!file) throw new Error('No file selected.');
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf';
  if(!isImage && !isPdf) throw new Error('Only images and PDF files are supported.');
  if(isPdf && file.size > MAX_PDF_BYTES) throw new Error('That PDF is larger than 25MB — try compressing it or splitting it up.');
  if(!storage) throw new Error('File storage isn\'t set up yet — check the Firebase Storage setup.');

  const blobToUpload = isImage ? await compressImageToBlob(file) : file;
  const mimeType = isImage ? 'image/jpeg' : file.type;
  const storagePath = `attachments/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${file.name}`;

  const ref = storage.ref().child(storagePath);
  const snapshot = await ref.put(blobToUpload, { contentType: mimeType });
  const url = await snapshot.ref.getDownloadURL();

  return { filename: file.name, mimeType, dataUrl: url, storagePath };
}

function attachmentChipHtml(att, removeJs){
  const isImage = (att.mimeType||'').startsWith('image/');
  const removeBtn = removeJs ? `<button class="attach-remove" title="Remove" onclick="event.preventDefault(); event.stopPropagation(); ${removeJs}">✕</button>` : '';
  if(isImage){
    // JSON-encode the values so filenames containing quotes or apostrophes
    // (common with scanned documents) can't break the inline handler.
    const args = `${JSON.stringify(att.dataUrl)}, ${JSON.stringify(att.filename||'image')}`.replace(/"/g,'&quot;');
    return `<button type="button" class="attach-chip attach-image" title="View image" onclick="openLightbox(${args})">
      <img src="${att.dataUrl}" alt="${escapeAttr(att.filename||'attachment')}">
      ${removeBtn}
    </button>`;
  }
  return `<a class="attach-chip attach-file" href="${att.dataUrl}" download="${escapeAttr(att.filename||'file.pdf')}">
    ${ICON_PDF}<span>${escapeHtml(att.filename||'file.pdf')}</span>
    ${removeBtn}
  </a>`;
}

/* Copies a term to the clipboard and briefly swaps the icon to a
   checkmark so there's immediate inline feedback, not just a toast.
   Falls back to the older execCommand approach on browsers/contexts
   where the async clipboard API isn't available (e.g. non-HTTPS). */
async function copyText(btn, text){
  let ok = false;
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      ok = true;
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    }
  }catch(err){
    ok = false;
  }

  if(!ok){ showToast('Could not copy — try selecting the text manually.'); return; }

  const original = btn.innerHTML;
  btn.innerHTML = ICON_CHECK;
  btn.classList.add('copied');
  clearTimeout(btn._copyTimer);
  btn._copyTimer = setTimeout(()=>{
    btn.innerHTML = original;
    btn.classList.remove('copied');
  }, 1400);
}

/* ---------- Image lightbox ---------- */
function openLightbox(url, filename){
  const box = document.getElementById('lightbox');
  const img = document.getElementById('lightboxImg');
  const name = document.getElementById('lightboxName');
  const dl = document.getElementById('lightboxDownload');
  if(!box || !img) return;
  img.src = url;
  img.alt = filename || 'attachment';
  if(name) name.textContent = filename || '';
  if(dl){ dl.href = url; dl.setAttribute('download', filename || 'image'); }
  box.classList.add('show');
  document.body.style.overflow = 'hidden'; // stop the page scrolling behind the overlay
}

function closeLightbox(event, force){
  // Only close on a click of the backdrop itself or the X — not on the image,
  // otherwise tapping the photo you're trying to look at dismisses it.
  if(!force && event && event.target && event.target.id === 'lightboxImg') return;
  if(!force && event && event.target && event.target.closest && event.target.closest('.lightbox-bar')) return;
  const box = document.getElementById('lightbox');
  if(!box) return;
  box.classList.remove('show');
  document.body.style.overflow = '';
  const img = document.getElementById('lightboxImg');
  if(img) img.src = '';
}

document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    const box = document.getElementById('lightbox');
    if(box && box.classList.contains('show')) closeLightbox(null, true);
  }
});

   - sensitivity 'base' so accented characters sort next to their plain
     counterparts (á with a) rather than being dumped at the end

function collateTerms(a, b){

/* ---------- Chat notifications ----------
   These fire while the app is open (including in a background tab or behind
   the lock screen on an installed app). They do NOT require a server.

   True push-when-fully-closed additionally needs a backend to send the push
   (Firebase Cloud Messaging + a Cloud Function triggered by new chat
   documents), which is a separate piece of infrastructure. */
function loadNotifyPref(){
  try{
    notifyEnabled = localStorage.getItem('interpreterHubNotify') === 'yes';
    notifyActivityEnabled = localStorage.getItem('interpreterHubNotifyActivity') === 'yes';
    notifyCeEnabled = localStorage.getItem('interpreterHubNotifyCe') === 'yes';
  }catch(err){
    notifyEnabled = false; // storage can be blocked in private modes
    notifyActivityEnabled = false;
    notifyCeEnabled = false;
  }
  // A stored preference means nothing if the browser permission was revoked.
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted'){
    notifyEnabled = false;
    notifyActivityEnabled = false;
    notifyCeEnabled = false;
  }
}

function saveNotifyPref(v){
  try{ localStorage.setItem('interpreterHubNotify', v ? 'yes' : 'no'); }catch(err){}
}

function saveNotifyActivityPref(v){
  try{ localStorage.setItem('interpreterHubNotifyActivity', v ? 'yes' : 'no'); }catch(err){}
}

function saveNotifyCePref(v){
  try{ localStorage.setItem('interpreterHubNotifyCe', v ? 'yes' : 'no'); }catch(err){}
}

    notifyCeEnabled = false;
    saveNotifyCePref(false);
    showToast('Training alerts turned off.');

  }
  if(!await ensureNotifyPermission()) return;
  notifyCeEnabled = true;
  saveNotifyCePref(true);
  showToast('You\u2019ll be alerted about new training and webinars.');
  renderContent();
}

function notificationsSupported(){
  return typeof Notification !== 'undefined' && 'serviceWorker' in navigator;
}

// Shared permission gate for both notification toggles. Must be reachable
// from a user gesture, which is why each caller is a button handler.
async function ensureNotifyPermission(){
  if(!notificationsSupported()){
    showToast('This browser doesn\'t support notifications.');
    return false;
  }
  if(Notification.permission === 'denied'){
    showToast('Notifications are blocked in your browser settings for this site.');
    return false;
  }
  let perm = Notification.permission;
  if(perm !== 'granted') perm = await Notification.requestPermission();
  if(perm !== 'granted'){
    showToast('Notifications were not allowed.');
    return false;
  }
  return true;
}

async function toggleNotifications(){
  if(notifyEnabled){
    notifyEnabled = false;
    saveNotifyPref(false);
    showToast('Chat notifications turned off.');
    renderContent();
    return;
  }
  if(!await ensureNotifyPermission()) return;
  notifyEnabled = true;
  saveNotifyPref(true);
  showToast('Chat notifications on.');
  renderContent();
}

  if(notifyActivityEnabled){
    notifyActivityEnabled = false;

// Generic notification sender used by both chat and activity.
async function sendNotification(title, body, section, tag){
  if(!notificationsSupported()) return;
  if(Notification.permission !== 'granted') return;
  try{
    // showNotification via the service worker is required on Android/iOS;
    // the plain Notification constructor is unsupported there.
    const reg = await navigator.serviceWorker.getRegistration();
    if(reg && reg.showNotification){
      await reg.showNotification(title, {
        body,
        icon: './icon-192.png',
        badge: './icon-192.png',
        tag,
        renotify: true,
        data: { section }
      });
    }else if(typeof Notification === 'function'){
      new Notification(title, { body, icon: './icon-192.png' });
    }
  }catch(err){
    console.warn('Notification failed:', err);
  }
}

/* ---------- Typing presence ----------
   Each person writes a single doc keyed by their name with a timestamp, and
   refreshes it while they type. Anything older than 6 seconds is treated as
   stale, so a closed tab or dropped connection can't leave someone stuck
   "typing" forever — there's no reliable disconnect event on the web.

   This degrades silently: if the Firestore rule for 'chat-typing' hasn't been
   added, the writes fail and the rest of the chat is unaffected. */
const TYPING_TTL = 6000;

function startTypingListener(){
  if(typingListenerStarted || !db) return;
  typingListenerStarted = true;
  db.collection('chat-typing').onSnapshot(snap=>{
    const me = whoAmI().trim().toLowerCase();
    const now = Date.now();
    TYPING_USERS = snap.docs
      .map(d => d.data())
      .filter(v => v && v.name && v.at && (now - v.at) < TYPING_TTL)
      .filter(v => v.name.trim().toLowerCase() !== me)
      .map(v => v.name);
    renderTypingIndicator();
  }, err => console.warn('Typing listener unavailable:', err));

  // Entries expire on time even when nobody is actively publishing.
  setInterval(()=>{
    if(!TYPING_USERS.length) return;
    renderTypingIndicator();
  }, 2500);
}

function publishTyping(){
  const me = whoAmI().trim();
  if(!me || !db) return;
  const now = Date.now();
  if(now - typingLastSent < 2000) return;   // throttle writes
  typingLastSent = now;
  db.collection('chat-typing').doc(slugify(me) || 'anon')
    .set({ name: me, at: now })
    .catch(()=>{});   // silent if the rule isn't set up
}

function clearTyping(){
  const me = whoAmI().trim();
  if(!me || !db) return;
  db.collection('chat-typing').doc(slugify(me) || 'anon').delete().catch(()=>{});
}

function handleChatTyping(){
  publishTyping();
  clearTimeout(typingHeartbeat);
  typingHeartbeat = setTimeout(clearTyping, 3500);  // stop after a pause
}

function renderTypingIndicator(){
  const host = document.getElementById('typingIndicator');
  if(!host) return;
  const names = TYPING_USERS.slice(0, 3);
  if(!names.length){ host.innerHTML = ''; host.classList.remove('show'); return; }
  const label = names.length === 1
    ? `${names[0]} is typing`
    : names.length === 2
      ? `${names[0]} and ${names[1]} are typing`
      : `${names[0]}, ${names[1]} and others are typing`;
  host.innerHTML = `<span class="typing-dots"><i></i><i></i><i></i></span><span>${escapeHtml(label)}</span>`;
  host.classList.add('show');
}

/* ============ Global search ============
   One search across every section, opened with Ctrl/Cmd+K or the sidebar
   button. Each result knows where it lives, so selecting one navigates
   straight there. */
let gsIndex = 0;      // highlighted result, for keyboard navigation
let gsMatches = [];

function openGlobalSearch(){
  const ov = document.getElementById('gsOverlay');
  if(!ov) return;
  ov.classList.add('show');
  document.body.style.overflow = 'hidden';
  const inp = document.getElementById('gsInput');
  if(inp){ inp.value = ''; inp.focus(); }
  gsIndex = 0;
  renderGlobalSearch();
}

function closeGlobalSearch(){
  const ov = document.getElementById('gsOverlay');
  if(!ov) return;
  ov.classList.remove('show');
  document.body.style.overflow = '';
}

function gsHighlight(text, q){
  const s = String(text || '');
  if(!q) return escapeHtml(s);
  const i = s.toLowerCase().indexOf(q.toLowerCase());
  if(i === -1) return escapeHtml(s);
  return escapeHtml(s.slice(0, i)) +
         '<span class="gs-mark">' + escapeHtml(s.slice(i, i + q.length)) + '</span>' +
         escapeHtml(s.slice(i + q.length));
}

// Builds a flat, ranked list of matches across every data source.
function collectSearchMatches(q){
  const query = q.trim().toLowerCase();
  if(!query) return [];
  const out = [];
  const hit = (v) => (v || '').toLowerCase().includes(query);
  const starts = (v) => (v || '').toLowerCase().startsWith(query);

  DATA.categories.forEach(cat=>{
    cat.terms.forEach(t=>{
      if(hit(t.en) || hit(t.es) || hit(t.def)){
        out.push({
          group:'Terms', icon:DOMAIN_ICONS[cat.icon] || DOMAIN_ICONS.sparkle, color:cat.color,
          title:t.en, sub:[t.es, cat.name].filter(Boolean).join(' \u00b7 '),
          target:cat.id,
          rank: starts(t.en) || starts(t.es) ? 0 : 1
        });
      }
    });
  });

  PROVIDERS.forEach(p=>{
    if(hit(p.name) || hit(p.role) || hit(p.facility) || hit(p.notes)){
      out.push({ group:'Providers', icon:ICON_PERSON, color:'#6F97AC',
        title:p.name, sub:[p.role, p.facility].filter(Boolean).join(' \u00b7 '),
        target:'providers', rank: starts(p.name) ? 0 : 1 });
    }
  });

  NOTES.forEach(n=>{
    if(hit(n.text) || hit(n.author)){
      out.push({ group:'Guides', icon:ICON_NOTE, color:'#BFA05E',
        title:(n.text||'').slice(0,70) + ((n.text||'').length>70?'\u2026':''),
        sub:n.author ? 'by ' + n.author : '', target:'notes', rank:1 });
    }
  });

  CHAT_MESSAGES.forEach(m=>{
    if(hit(m.text) || hit(m.author)){
      out.push({ group:'Chat', icon:ICON_CHAT, color:'#2E8BD0',
        title:(m.text||'(attachment)').slice(0,70) + ((m.text||'').length>70?'\u2026':''),
        sub:m.author || '', target:'chat', rank:1 });
    }
  });

  allQuestions().forEach(qq=>{
    if(hit(qq.q)){
      const dm = domainMeta(qq.d);
      out.push({ group:'Practice', icon:ICON_EXAM, color:'#0F5FA6',
        title:qq.q.slice(0,72) + (qq.q.length>72?'\u2026':''),
        sub:dm.name, target:'practice', rank:2 });
    }
  });

  DATA.categories.forEach(cat=>{
    if(hit(cat.name)){
      out.push({ group:'Domains', icon:DOMAIN_ICONS[cat.icon] || DOMAIN_ICONS.sparkle, color:cat.color,
        title:cat.name, sub:`${cat.terms.length} term${cat.terms.length===1?'':'s'}`,
        target:cat.id, rank:0 });
    }
  });

  out.sort((a,b)=> a.rank - b.rank);
  return out.slice(0, 30);
}

function renderGlobalSearch(){
  const inp = document.getElementById('gsInput');
  const box = document.getElementById('gsResults');
  if(!inp || !box) return;
  const q = inp.value;
  gsMatches = collectSearchMatches(q);

  if(!q.trim()){
    box.innerHTML = `<div class="gs-empty">Search across terms, providers, notes, chat, and practice questions.</div>`;
    return;
  }
  if(!gsMatches.length){
    box.innerHTML = `<div class="gs-empty">Nothing found for \u201c${escapeHtml(q)}\u201d.</div>`;
    return;
  }
  if(gsIndex >= gsMatches.length) gsIndex = 0;

  let html = '';
  let lastGroup = '';
  gsMatches.forEach((m, i)=>{
    if(m.group !== lastGroup){
      html += `<div class="gs-group">${escapeHtml(m.group)}</div>`;
      lastGroup = m.group;
    }
    html += `
      <button class="gs-item ${i===gsIndex?'active':''}" onclick="gsGo(${i})">
        <span class="gs-ico" style="background:${m.color}1F; color:${m.color};">${m.icon}</span>
        <span class="gs-text">
          <span class="gs-title">${gsHighlight(m.title, q)}</span>
          ${m.sub ? `<span class="gs-sub">${gsHighlight(m.sub, q)}</span>` : ''}
        </span>
      </button>`;
  });
  box.innerHTML = html;
}

function gsGo(i){
  const m = gsMatches[i];
  if(!m) return;
  closeGlobalSearch();
  setCategory(m.target);
}

function handleGsKeys(e){
  if(e.key === 'Escape'){ closeGlobalSearch(); return; }
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    gsIndex = Math.min(gsIndex + 1, gsMatches.length - 1);
    renderGlobalSearch();
    const el = document.querySelector('.gs-item.active');
    if(el && el.scrollIntoView) el.scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key === 'ArrowUp'){
    e.preventDefault();
    gsIndex = Math.max(gsIndex - 1, 0);
    renderGlobalSearch();
    const el = document.querySelector('.gs-item.active');
    if(el && el.scrollIntoView) el.scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key === 'Enter'){ e.preventDefault(); gsGo(gsIndex); }
}
