<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hackensack University Medical Center Interpreter Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F3EC;
    --bg-hi:#FAF8F2;
    --paper:#FFFEFB;
    --ink:#3A3B36;
    --ink-soft:#7A7A70;
    --ink-faint:#A8A79B;
    --line:#EAE6D9;
    --line-soft:#F1EEE3;
    --accent:#5C8374;
    --accent-2:#7FA593;
    --accent-soft:#EAF0EB;
    --danger:#B5707D;
    --danger-soft:#F6ECEE;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'IBM Plex Sans', system-ui, sans-serif;
    --serif:'IBM Plex Serif', Georgia, serif;
    --r-sm:9px; --r-md:14px; --r-lg:20px;
    --sh-1:0 1px 3px rgba(58,59,54,0.03), 0 1px 1px rgba(58,59,54,0.03);
    --sh-2:0 8px 20px rgba(58,59,54,0.05), 0 2px 6px rgba(58,59,54,0.03);
    --sh-3:0 24px 56px rgba(58,59,54,0.10), 0 6px 16px rgba(58,59,54,0.05);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;}
  ::selection{background:var(--accent-soft); color:var(--ink);}
  body{
    margin:0; color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; background:
      radial-gradient(1200px 600px at 100% -10%, #F1F0E6 0%, transparent 60%),
      radial-gradient(1000px 560px at -10% 110%, #F2F1EC 0%, transparent 60%),
      var(--bg);
  }
  .app{display:flex; min-height:100vh;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-thumb{background:#DEDACB; border-radius:8px; border:2px solid transparent; background-clip:padding-box;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:278px; flex-shrink:0; position:sticky; top:0; height:100vh; overflow-y:auto;
    background:linear-gradient(180deg, var(--bg-hi), #F3F1E7 70%);
    border-right:1px solid var(--line); padding:24px 0 20px 0;
    display:flex; flex-direction:column; gap:3px;
  }
  .brand{
    padding:2px 20px 20px 20px; margin-bottom:14px; position:relative;
  }
  .brand::after{
    content:""; position:absolute; left:20px; right:20px; bottom:0; height:1px;
    background:linear-gradient(90deg, var(--line), transparent);
  }
  .brand .mark{
    width:34px; height:34px; border-radius:9px; margin-bottom:12px;
    background:linear-gradient(140deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    box-shadow:var(--sh-2), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .brand .mark svg{width:17px; height:17px;}
  .brand .eyebrow{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:600;
  }
  .brand h1{ font-family:var(--serif); font-size:17px; margin:5px 0 6px 0; font-weight:400; letter-spacing:-.005em; line-height:1.32;}
  .brand p{ font-size:11.5px; color:var(--ink-soft); margin:0; line-height:1.55;}

  .hipaa-notice{
    display:flex; align-items:flex-start; gap:8px; margin-top:12px; padding:10px 11px;
    background:#FBF3E3; border:1px solid #E8D7B0; border-radius:10px;
    font-size:10.5px; line-height:1.5; color:#7A5D28;
  }
  .hipaa-notice svg{ width:14px; height:14px; flex-shrink:0; margin-top:1px; color:#B8923E; }
  .hipaa-notice-inline{
    display:flex; align-items:center; gap:7px; margin:-4px 0 16px 0; padding:8px 12px;
    background:#FBF3E3; border:1px solid #E8D7B0; border-radius:20px;
    font-size:11px; color:#7A5D28; width:fit-content;
  }
  .hipaa-notice-inline svg{ width:13px; height:13px; flex-shrink:0; color:#B8923E; }

  .tab{
    position:relative; display:flex; align-items:center; gap:10px;
    padding:10px 16px 10px 12px; margin:0 8px 0 10px; border-radius:9px 20px 20px 9px;
    cursor:pointer; border:none; background:transparent; text-align:left;
    font-family:var(--sans); font-size:13px; color:var(--ink-soft); width:calc(100% - 18px);
    transition:background .16s var(--ease), color .16s var(--ease);
  }
  .tab:hover{ background:rgba(255,255,255,0.7); color:var(--ink); }
  .tab.active{
    background:var(--paper); font-weight:600; color:var(--ink);
    box-shadow:var(--sh-1), inset 0 0 0 1px var(--line-soft);
  }
  .tab .flag{
    width:9px; height:9px; border-radius:3px; flex-shrink:0; transform:rotate(45deg);
    box-shadow:0 0 0 4px color-mix(in srgb, currentColor 14%, transparent);
  }
  .tab .name{flex:1; line-height:1.3;}
  .tab .count{
    font-family:var(--mono); font-size:10px; color:var(--ink-faint);
    background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:2px 7px;
  }
  .tab.active .count{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }

  .tab-delete{
    opacity:0; font-size:11px; color:var(--ink-faint); padding:3px 5px; border-radius:5px; cursor:pointer;
    transition:opacity .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
  }
  .tab:hover .tab-delete{ opacity:1; }
  .tab-delete:hover{ color:var(--danger); background:var(--danger-soft); }

  .tab.add-domain-btn{
    border:1px dashed var(--line); color:var(--ink-faint); margin-top:2px; margin-bottom:6px;
  }
  .tab.add-domain-btn .flag{ box-shadow:none; display:flex; align-items:center; justify-content:center; width:16px; height:16px; transform:none; }
  .tab.add-domain-btn:hover{ border-color:var(--accent-2); color:var(--accent); background:var(--accent-soft); }

  .swatch-row{ display:flex; flex-wrap:wrap; gap:9px; margin-top:2px; }
  .swatch{
    width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent; padding:0;
    transition:transform .15s var(--ease), box-shadow .15s var(--ease);
  }
  .swatch:hover{ transform:scale(1.1); }
  .swatch.selected{ box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--ink-soft); }

  /* ---------- Healthcare Providers ---------- */
  .provider-top{ display:flex; align-items:center; gap:12px; margin-bottom:11px; }
  .provider-avatar{
    width:52px; height:52px; border-radius:50%; object-fit:cover; flex-shrink:0;
    box-shadow:inset 0 0 0 1px var(--line);
  }
  .provider-avatar-fallback{
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(140deg, var(--accent-2), var(--accent)); color:#fff;
    font-family:var(--sans); font-weight:600; font-size:15px;
  }
  .provider-name{ font-family:var(--sans); font-weight:600; font-size:15.5px; margin-bottom:4px; line-height:1.3; }
  .provider-role-tag{ color:var(--accent); background:var(--accent-soft); }
  .provider-facility{ font-size:12.5px; color:var(--ink-soft); margin:0 0 9px 0; line-height:1.5; }
  .provider-phone{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--accent);
    text-decoration:none; font-weight:600; margin-bottom:4px;
  }
  .provider-phone:hover{ text-decoration:underline; }
  .provider-phone svg{ width:12px; height:12px; }

  .photo-field{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .photo-preview{ width:54px; height:54px; border-radius:50%; object-fit:cover; box-shadow:inset 0 0 0 1px var(--line); flex-shrink:0; }
  .photo-placeholder{
    width:54px; height:54px; border-radius:50%; flex-shrink:0; background:var(--bg-hi);
    box-shadow:inset 0 0 0 1px var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-faint);
  }
  .photo-placeholder svg{ width:20px; height:20px; }
  .file-input-label{
    font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--accent); cursor:pointer;
    background:var(--accent-soft); padding:8px 14px; border-radius:var(--r-sm); display:inline-block;
  }
  .file-input-label:hover{ filter:brightness(0.97); }
  .file-input-hidden{ display:none; }

  .count.unread{ background:var(--danger); color:#fff; font-weight:700; border-color:transparent; }

  /* ---------- Team Chat ---------- */
  .chat-panel{ display:flex; flex-direction:column; height:65vh; min-height:380px; max-height:640px; }
  .chat-messages{
    flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px;
    padding:6px 6px 16px 6px; scroll-behavior:smooth;
  }
  .chat-empty{ margin:auto; text-align:center; color:var(--ink-faint); font-size:13px; line-height:1.6; }
  .chat-bubble-row{ display:flex; flex-direction:column; max-width:66%; }
  .chat-bubble-row.me{ align-self:flex-end; align-items:flex-end; }
  .chat-bubble-row.them{ align-self:flex-start; align-items:flex-start; }
  .chat-author{ font-family:var(--sans); font-size:10.5px; font-weight:600; color:var(--ink-faint); margin:0 4px 3px 4px; }
  .chat-bubble{ padding:10px 14px; border-radius:16px; font-size:13.5px; line-height:1.55; word-break:break-word; }
  .chat-bubble-row.me .chat-bubble{
    background:linear-gradient(140deg, var(--accent-2), var(--accent)); color:#fff; border-bottom-right-radius:4px;
  }
  .chat-bubble-row.them .chat-bubble{
    background:var(--paper); color:var(--ink); border-bottom-left-radius:4px;
    box-shadow:var(--sh-1), inset 0 0 0 1px var(--line-soft);
  }
  .chat-time{ font-family:var(--mono); font-size:9px; color:var(--ink-faint); margin:4px 4px 0 4px; }
  .chat-join-hint{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin:2px 0 12px 0; line-height:1.6; }
  .chat-input-row{ display:flex; gap:10px; padding-top:14px; margin-top:4px; border-top:1px solid var(--line); }
  .chat-input-row input{
    flex:1; padding:12px 16px; border:1px solid var(--line); border-radius:24px;
    font-family:var(--sans); font-size:14px; background:var(--paper); color:var(--ink);
    transition:box-shadow .15s var(--ease), border-color .15s var(--ease);
  }
  .chat-input-row input:focus{ outline:none; border-color:var(--accent-2); box-shadow:0 0 0 4px var(--accent-soft); }
  .chat-send-btn{
    width:44px; height:44px; border-radius:50%; flex-shrink:0; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(140deg, var(--accent-2), var(--accent));
    box-shadow:0 8px 16px -8px rgba(92,131,116,0.45); transition:filter .15s var(--ease), transform .15s var(--ease);
  }
  .chat-send-btn:hover{ filter:brightness(1.05); }
  .chat-send-btn:active{ transform:scale(0.94); }
  .chat-send-btn svg{ width:17px; height:17px; margin-left:-1px; }

  /* ---------- Notes ---------- */
  .note-text{ font-size:14px; line-height:1.68; color:var(--ink); white-space:pre-wrap; margin:6px 0 0 0; }

  /* ---------- Recent Updates ---------- */
  .activity-row{
    display:flex; align-items:baseline; gap:9px; padding:11px 14px; border-radius:10px;
    background:var(--paper); box-shadow:var(--sh-1), inset 0 0 0 1px var(--line-soft); margin-bottom:7px;
  }
  .activity-row .activity-author{ font-family:var(--sans); font-weight:600; font-size:13px; color:var(--ink); flex-shrink:0; }
  .activity-row .activity-summary{ font-size:13px; color:var(--ink-soft); flex:1; min-width:0; }
  .activity-row .activity-time{ font-family:var(--mono); font-size:10px; color:var(--ink-faint); flex-shrink:0; white-space:nowrap; }

  /* ---------- Attachments (terms, chat, notes) ---------- */
  .attach-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:11px; }
  .attach-chip{
    position:relative; display:inline-flex; align-items:center; gap:6px; text-decoration:none;
    border-radius:10px; overflow:hidden; box-shadow:inset 0 0 0 1px var(--line-soft);
  }
  .attach-chip.attach-image{ width:60px; height:60px; }
  .attach-chip.attach-image img{ width:100%; height:100%; object-fit:cover; display:block; }
  .attach-chip.attach-file{
    padding:8px 12px 8px 10px; background:var(--bg-hi); color:var(--accent);
    font-family:var(--sans); font-size:11.5px; font-weight:600; max-width:170px;
  }
  .attach-chip.attach-file svg{ width:15px; height:15px; flex-shrink:0; }
  .attach-chip.attach-file span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .attach-remove{
    position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; border:none;
    background:rgba(20,20,18,0.55); color:#fff; font-size:10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .attach-chip.attach-file .attach-remove{ position:static; margin-left:2px; background:transparent; color:var(--ink-faint); width:auto; height:auto; }
  .attach-chip.attach-file .attach-remove:hover{ color:var(--danger); }
  .attach-btn{
    border:none; background:var(--bg); border-radius:8px; width:26px; height:26px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
    box-shadow:inset 0 0 0 1px var(--line); transition:all .15s var(--ease); flex-shrink:0;
  }
  .attach-btn:hover{ background:var(--paper); color:var(--accent); box-shadow:var(--sh-2), inset 0 0 0 1px var(--line); }
  .attach-btn svg{ width:14px; height:14px; }
  .chat-attach-preview{ margin-bottom:10px; }

  .nav-divider{ height:1px; margin:10px 20px; background:linear-gradient(90deg, var(--line), transparent); }
  .tab .link-flag{
    width:18px; height:18px; border-radius:5px; flex-shrink:0; transform:none;
    background:linear-gradient(140deg, var(--accent-2), var(--accent)); color:#fff;
    display:flex; align-items:center; justify-content:center; box-shadow:none;
  }
  .tab .link-flag svg{ width:10px; height:10px; }

  /* ---------- Link Directory ---------- */
  .dir-group{ margin-bottom:8px; }
  .dir-row{
    display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:10px;
    background:var(--paper); box-shadow:var(--sh-1), inset 0 0 0 1px var(--line-soft);
    margin-bottom:7px; transition:box-shadow .15s var(--ease), transform .15s var(--ease);
  }
  .dir-row:hover{ box-shadow:var(--sh-2), inset 0 0 0 1px var(--line); transform:translateX(2px); }
  .dir-row .dir-dot{ width:8px; height:8px; border-radius:2px; flex-shrink:0; transform:rotate(45deg); }
  .dir-row .dir-term{ font-family:var(--sans); font-weight:600; font-size:13.5px; min-width:0; flex:0 1 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:220px; }
  .dir-row .dir-kind{
    font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);
    background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:2px 8px; flex-shrink:0;
  }
  .dir-row .dir-kind.confirmed{ color:var(--accent); background:var(--accent-soft); border-color:transparent; }
  .dir-row .dir-url{
    flex:1; min-width:0; font-family:var(--mono); font-size:11.5px; color:var(--accent);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-decoration:none;
  }
  .dir-row .dir-url:hover{ text-decoration:underline; }
  .dir-row .dir-go{ flex-shrink:0; color:var(--ink-faint); display:flex; text-decoration:none; }
  .dir-row .dir-go:hover{ color:var(--accent); }
  .dir-row .dir-go svg{ width:12px; height:12px; }

  .sidebar-footer{margin-top:auto; padding:16px 20px 0 20px; position:relative;}
  .sidebar-footer::before{
    content:""; position:absolute; left:20px; right:20px; top:0; height:1px;
    background:linear-gradient(90deg, var(--line), transparent);
  }
  .whoami{font-size:10.5px; color:var(--ink-faint); margin:14px 0 7px 0; font-family:var(--mono); letter-spacing:.05em; text-transform:uppercase;}
  .whoami-input{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:var(--r-sm);
    font-family:var(--sans); font-size:12.5px; background:var(--paper); color:var(--ink);
    box-shadow:var(--sh-1); transition:box-shadow .15s var(--ease);
  }
  .whoami-input:focus{outline:none; box-shadow:0 0 0 3px var(--accent-soft), var(--sh-1);}

  /* ---------- Main ---------- */
  .main{flex:1; padding:40px 48px 80px 48px; max-width:1060px;}
  .topbar{
    display:flex; gap:12px; align-items:center; margin-bottom:30px; flex-wrap:wrap;
    position:sticky; top:0; z-index:10; padding:14px 0; margin-top:-14px;
    background:linear-gradient(var(--bg) 72%, transparent);
  }
  .search{ flex:1; min-width:240px; position:relative; }
  .search input{
    width:100%; padding:12px 16px 12px 40px; border:1px solid var(--line); border-radius:12px;
    font-family:var(--sans); font-size:14px; background:var(--paper); color:var(--ink);
    box-shadow:var(--sh-1); transition:box-shadow .15s var(--ease), border-color .15s var(--ease);
  }
  .search input:focus{ outline:none; border-color:var(--accent-2); box-shadow:0 0 0 4px var(--accent-soft); }
  .search::before{
    content:"⌕"; position:absolute; left:15px; top:50%; transform:translateY(-50%);
    color:var(--ink-faint); font-size:17px; pointer-events:none;
  }
  .btn{
    font-family:var(--sans); font-size:13.5px; font-weight:600; border:none; border-radius:12px;
    padding:12px 19px; cursor:pointer; transition:transform .15s var(--ease), box-shadow .15s var(--ease), filter .15s var(--ease);
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{
    background:linear-gradient(140deg, var(--accent-2), var(--accent)); color:#fff;
    box-shadow:0 8px 16px -8px rgba(92,131,116,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .btn-primary:hover{ filter:brightness(1.04); box-shadow:0 10px 20px -8px rgba(92,131,116,0.5), inset 0 1px 0 rgba(255,255,255,0.25); }
  .btn-ghost{ background:var(--paper); color:var(--ink); box-shadow:var(--sh-1), inset 0 0 0 1px var(--line); }
  .btn-ghost:hover{ box-shadow:var(--sh-2), inset 0 0 0 1px var(--line); }

  .stat-strip{ display:flex; gap:20px; margin:-14px 0 26px 0; flex-wrap:wrap; }
  .stat{ display:flex; align-items:baseline; gap:6px; }
  .stat b{ font-family:var(--mono); font-size:17px; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .stat span{ font-family:var(--sans); font-size:11.5px; color:var(--ink-faint); }

  .section-head{display:flex; align-items:baseline; gap:11px; margin:36px 0 18px 0;}
  .section-head:first-child{ margin-top:4px; }
  .section-head h2{font-family:var(--serif); font-weight:400; font-size:23px; margin:0; letter-spacing:-.01em;}
  .section-head .sub{font-family:var(--mono); font-size:11px; color:var(--ink-faint);}
  .section-head::after{ content:""; flex:1; height:1px; background:var(--line); }

  .grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:18px;}
  @media (max-width:760px){ .grid{grid-template-columns:1fr;} .sidebar{width:100%; height:auto; position:relative;} .app{flex-direction:column;} .main{padding:26px 20px;} .dir-row{flex-wrap:wrap;} .dir-row .dir-term{max-width:100%;} }

  @keyframes cardIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .card{
    background:var(--paper); border-radius:var(--r-md);
    padding:20px 20px 17px 20px; position:relative;
    box-shadow:var(--sh-1), inset 0 0 0 1px var(--line-soft);
    transition:box-shadow .2s var(--ease);
    animation:cardIn .3s var(--ease) both;
  }
  .card:hover{ box-shadow:var(--sh-2), inset 0 0 0 1px var(--line); }
  .card-top{ display:flex; align-items:center; justify-content:space-between; padding-right:52px; }
  .card .chart-id{
    font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); letter-spacing:.06em;
  }
  .card .tag{
    display:inline-flex; align-items:center; gap:6px; font-family:var(--sans); font-size:10.5px; font-weight:600; letter-spacing:.02em;
    padding:5px 11px; border-radius:20px;
  }
  .card .tag::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.7; }
  .card .term-en{font-family:var(--sans); font-weight:600; font-size:15.5px; margin:13px 0 4px 0; line-height:1.4; letter-spacing:-.003em;}
  .card .term-es{font-family:var(--serif); font-style:italic; color:var(--accent); font-size:13.5px; margin:0 0 10px 0;}
  .card .def{font-size:13.5px; line-height:1.68; color:var(--ink-soft); margin:0;}
  .card .links{ display:flex; flex-wrap:wrap; gap:7px; margin-top:12px; }
  .link-pill{
    display:inline-flex; align-items:center; gap:5px; font-family:var(--sans); font-size:11.5px; font-weight:600;

<!-- ===================================================================
     CLOUD STORAGE SETUP
     This app was originally built in Claude, where "window.storage" is
     provided automatically. Outside Claude (e.g. here on Vercel), it
     doesn't exist — so this block replaces it with a real, free backend
     (Firebase Firestore + Cloud Storage) that has the exact same shape.

     1. Create a project at https://console.firebase.google.com
     2. Build a Firestore Database (Start in test mode is fine to begin)
     3. Project settings → your web app → copy the firebaseConfig object
        and paste it below, replacing the placeholder values.
     4. In Firestore → Rules, set:
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              match /terminology-hub/{docId} { allow read, write: if true; }
              match /healthcare-providers/{docId} { allow read, write: if true; }
              match /team-chat/{docId} { allow read, write: if true; }
              match /team-notes/{docId} { allow read, write: if true; }
              match /term-attachments/{docId} { allow read, write: if true; }
              match /activity-log/{docId} { allow read, write: if true; }
            }
          }
     5. This app also uses Cloud Storage for file attachments (photos and
        PDFs), which requires the pay-as-you-go Blaze plan. In Storage →
        Rules, set:
          rules_version = '2';
          service firebase.storage {
            match /b/{bucket}/o {
              match /attachments/{allPaths=**} { allow read, write: if true; }
            }
          }
        (This keeps the app open to your whole team with no login,
        matching how it worked inside Claude. Anyone with the config
        below could also write to your database/storage directly — fine
        for a small trusted team, not fine if this repo goes fully public.)
==================================================================== -->

/* ============ State ============ */

/* ============ Storage ============ */
function genId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// One-time, automatic, and safe: gives any term saved before attachments
// existed a stable id (so a file can be tied to that exact term even if
// it's later edited, reordered, or the list around it changes). Doesn't
// touch any existing content — only adds a new field where it's missing.
function ensureTermIds(){
  let migrated = false;
  DATA.categories.forEach(cat=>{
    cat.terms.forEach(t=>{
      if(!t.id){ t.id = genId(); migrated = true; }
    });
  });
  return migrated;
}

async function loadData(){
  try{
    const result = await window.storage.get(STORAGE_KEY, true);
    if(result && result.value){
      DATA = JSON.parse(result.value);
    } else {
      DATA = DEFAULT_DATA;
      await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), true);
    }
  }catch(err){
    DATA = DEFAULT_DATA;
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), true); }catch(e2){}
  }
  if(ensureTermIds()){
    persist(); // silently save the newly-assigned ids so they stick
  }
  render();
}

async function persist(){
  try{
    const res = await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), true);
    if(!res){ showToast('Saved locally — sync failed, try again.'); }
  }catch(err){
    showToast('Could not save. Check connection and retry.');
  }
}

/* ============ Healthcare Providers (own Firestore collection —
   keeps each provider + photo well under the 1MB per-document limit,
   instead of bundling everything into the single terminology blob) ============ */
async function loadProviders(){
  try{
    if(!db){ PROVIDERS = []; return; }
    const snap = await db.collection('healthcare-providers').get();
    PROVIDERS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }catch(err){
    console.error('Could not load providers', err);
    PROVIDERS = [];
  }
  render();
}

async function persistProvider(record, existingId){
  if(!db){ showToast('Not connected to the database.'); return null; }
  if(existingId){
    await db.collection('healthcare-providers').doc(existingId).set(record);
    return existingId;
  }
  const ref = await db.collection('healthcare-providers').add(record);
  return ref.id;
}

async function deleteProviderRemote(id){
  if(!db) return;
  await db.collection('healthcare-providers').doc(id).delete();
}

/* ============ Notes (own collection, loaded once like providers —
   refresh to see a teammate's new note, same tradeoff as the rest
   of the app except chat, which is genuinely real-time) ============ */

    if(!db){ NOTES = []; return; }

}

async function persistNote(record, existingId){

}

/* ============ Team Chat (real-time — this is the one section that
   uses Firestore's live listener instead of load-once, so messages
   appear for everyone without a refresh, Messenger-style).

   IMPORTANT: the listener callback below NEVER calls the full render()
   function. A background message arriving while someone is mid-edit
   elsewhere in the app (typing a term, filling out a modal) must not
   rebuild the whole page out from under them. It only touches the
   chat panel itself, or a single badge element, by id. ============ */
function startChatListener(){
  if(chatListenerStarted || !db) return;
  chatListenerStarted = true;
  db.collection('team-chat').orderBy('timestamp').onSnapshot(snap=>{

/* ============ Recent Updates (activity log) ============
   Fire-and-forget logging: called after any successful add/edit/delete
   elsewhere in the app. It never blocks or fails the action it's
   logging — if writing the log entry itself fails, that's silently
   swallowed so it can never turn a successful save into an error. */
function logActivity(summary){
  if(!db) return;
  try{
    db.collection('activity-log').add({
      summary,
      author: whoAmI() || 'Someone',
      timestamp: Date.now()
    }).catch(err=>console.error('Activity log failed', err));
  }catch(err){
    console.error('Activity log failed', err);
  }
}

  if(activityListenerStarted || !db) return;
  activityListenerStarted = true;
  db.collection('activity-log').orderBy('timestamp').onSnapshot(snap=>{
    ACTIVITY = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if(isInitialActivityLoad){
      isInitialActivityLoad = false;
      lastSeenActivityCount = ACTIVITY.length;

    if(activeCategory === 'updates'){

function updateActivityBadge(){
  const badge = document.getElementById('activityBadge');
  if(!badge) return;
  const unread = Math.max(0, ACTIVITY.length - lastSeenActivityCount);
  badge.textContent = unread > 0 ? unread : ACTIVITY.length;

  const container = document.getElementById('activityFeed');
  if(!container) return;
  if(ACTIVITY.length===0){
    container.innerHTML = `<div class="empty"><div class="glyph">${ICON_BELL}</div>No activity yet.<br>Changes your team makes will show up here.</div>`;

/* ============ Attachments (terms, chat, notes) ============
   Files are uploaded to Cloud Storage; Firestore only ever stores a
   small download-link string, never the file itself. That's what
   removes the old ~700KB ceiling — Storage doesn't share Firestore's
   1MB-per-document limit. Images are still compressed client-side
   before upload purely for speed, not because of a size limit.
   MAX_PDF_BYTES below is just an abuse guard, not a real constraint. */
const MAX_PDF_BYTES = 25 * 1024 * 1024; // 25MB sanity cap

function compressImageToBlob(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Could not read that image.'));
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('Could not read that image.'));
      img.onload = ()=>{
        const maxDim = 1400;
        let w = img.width, h = img.height;
        if(w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob=>{
          if(!blob) reject(new Error('Could not process that image.'));
          else resolve(blob);
        }, 'image/jpeg', 0.85);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function readFileAsAttachment(file){
  if(!file) throw new Error('No file selected.');
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type === 'application/pdf';
  if(!isImage && !isPdf) throw new Error('Only images and PDF files are supported.');
  if(isPdf && file.size > MAX_PDF_BYTES) throw new Error('That PDF is larger than 25MB — try compressing it or splitting it up.');
  if(!storage) throw new Error('File storage isn\'t set up yet — check the Firebase Storage setup.');

  const blobToUpload = isImage ? await compressImageToBlob(file) : file;
  const mimeType = isImage ? 'image/jpeg' : file.type;
  const storagePath = `attachments/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${file.name}`;

  const ref = storage.ref().child(storagePath);
  const snapshot = await ref.put(blobToUpload, { contentType: mimeType });
  const url = await snapshot.ref.getDownloadURL();

  return { filename: file.name, mimeType, dataUrl: url, storagePath };
}

function attachmentChipHtml(att, removeJs){
  const isImage = (att.mimeType||'').startsWith('image/');
  const removeBtn = removeJs ? `<button class="attach-remove" title="Remove" onclick="event.preventDefault(); event.stopPropagation(); ${removeJs}">✕</button>` : '';
  if(isImage){
    return `<a class="attach-chip attach-image" href="${att.dataUrl}" target="_blank" rel="noopener">
      <img src="${att.dataUrl}" alt="${escapeAttr(att.filename||'attachment')}">
      ${removeBtn}
    </a>`;
  }
  return `<a class="attach-chip attach-file" href="${att.dataUrl}" download="${escapeAttr(att.filename||'file.pdf')}">
    ${ICON_PDF}<span>${escapeHtml(att.filename||'file.pdf')}</span>
    ${removeBtn}
  </a>`;
}

/* ---- Term attachments: their own collection, keyed by each term's
   stable id, since terms themselves live packed together in one
   shared document that can't safely hold embedded files. ---- */
async function loadAttachments(){
  try{
    if(!db){ ATTACHMENTS = []; return; }
    const snap = await db.collection('term-attachments').get();
    ATTACHMENTS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }catch(err){
    console.error('Could not load attachments', err);
    ATTACHMENTS = [];
  }
  render();
}

function attachToTerm(termId){
  pendingAttachTermId = termId;
  document.getElementById('termAttachInput').click();
}

async function handleTermAttachSelected(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  const termId = pendingAttachTermId;
  pendingAttachTermId = null;
  if(!file || !termId) return;
  if(!db){ showToast('Not connected to the database.'); return; }

  try{
    const att = await readFileAsAttachment(file);
    const record = { termId, ...att, uploadedBy: whoAmI() || '', uploadedAt: Date.now() };
    const ref = await db.collection('term-attachments').add(record);
    ATTACHMENTS.push({ id: ref.id, ...record });
    logActivity(`attached "${att.filename}" to a term`);
    showToast('File attached.');
    render();
  }catch(err){
    showToast(err.message || 'Could not attach that file.');
  }
}

async function deleteAttachment(id){
  if(!confirm('Remove this attachment?')) return;
  const att = ATTACHMENTS.find(a=>a.id===id);
  try{
    if(db) await db.collection('term-attachments').doc(id).delete();
    if(storage && att && att.storagePath){
      storage.ref().child(att.storagePath).delete().catch(()=>{}); // best-effort, don't block on it
    }
    ATTACHMENTS = ATTACHMENTS.filter(a=>a.id!==id);
    render();
  }catch(err){
    showToast('Could not remove — check your connection.');
  }
}

    links.push(`<a class="link-pill" href="${escapeAttr(t.url)}" target="_blank" rel="noopener">Source ${ICON_EXTERNAL}</a>`);

    links.push(`<a class="link-pill" href="${escapeAttr(mplusUrl(t.en,'en'))}" target="_blank" rel="noopener">Look up ${ICON_EXTERNAL}</a>`);
  }
  if(!t.url && categoryId !== 'resources' && t.es){

  if(!html){

/* ============ Team Chat: rendering + sending ============
   renderChatMessages() ONLY touches #chatMessages — it's called both
   when you open the tab and by the background real-time listener, so
   it must never disturb the input field or the rest of the page. */
function renderChatMessages(){
  const container = document.getElementById('chatMessages');
  if(!container) return;

  const wasNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 120;
  const myName = whoAmI().trim().toLowerCase();

  if(CHAT_MESSAGES.length===0){
    container.innerHTML = `<div class="chat-empty">No messages yet.<br>Say hello to the team.</div>`;
    return;
  }

  container.innerHTML = CHAT_MESSAGES.map(m=>{
    const mine = !!myName && (m.author||'').trim().toLowerCase() === myName;
    const time = m.timestamp ? new Date(m.timestamp).toLocaleString(undefined,{month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
    return `
      <div class="chat-bubble-row ${mine ? 'me' : 'them'}">
        ${!mine ? `<div class="chat-author">${escapeHtml(m.author || 'Teammate')}</div>` : ''}
        ${m.text ? `<div class="chat-bubble">${escapeHtml(m.text)}</div>` : ''}
        ${m.attachment ? `<div class="attach-row" style="margin-top:${m.text?'6px':'0'};">${attachmentChipHtml(m.attachment, null)}</div>` : ''}
        <div class="chat-time">${time}</div>
      </div>
    `;
  }).join('');

  if(wasNearBottom){
    container.scrollTop = container.scrollHeight;
  }
}

async function sendChatMessage(){
  const input = document.getElementById('chatInput');
  if(!input) return;
  const text = input.value.trim();
  if(!text && !pendingChatAttachment) return;

  const author = whoAmI();
  if(!author){
    showToast('Add your name in the sidebar first, so your team knows who\'s chatting.');
    return;
  }
  if(!db){
    showToast('Not connected to the database.');
    return;
  }

  const attachment = pendingChatAttachment;
  input.value = '';
  pendingChatAttachment = null;
  renderChatAttachPreview();
  input.disabled = true;
  try{
    await db.collection('team-chat').add({ text, author, attachment: attachment || null, timestamp: Date.now() });
    // No manual state update needed — the real-time listener picks this up
    // for everyone, including the sender, and calls renderChatMessages().
  }catch(err){
    showToast('Could not send — check your connection.');
    input.value = text; // give the message back so it isn't lost
    pendingChatAttachment = attachment;
    renderChatAttachPreview();
  }
  input.disabled = false;
  input.focus();
}

function handleChatKeydown(event){
  if(event.key === 'Enter' && !event.shiftKey){
    event.preventDefault();
    sendChatMessage();
  }
}

function joinChat(){
  const nameInput = document.getElementById('chatNameInput');
  if(!nameInput) return;
  const name = nameInput.value.trim();
  if(!name){ showToast('Enter a name to continue.'); return; }

  window.__lastWho = name;
  const whoEl = document.getElementById('whoInput');
  if(whoEl) whoEl.value = name; // keep the sidebar field in sync too

  renderContent(); // swaps the join prompt for the real message input, in place
}

function handleChatNameKeydown(event){
  if(event.key === 'Enter'){
    event.preventDefault();
    joinChat();
  }
}

function renderDirectory(q){
  let sectionsHtml = '';
  let totalRows = 0;

  DATA.categories.forEach(cat=>{
    let rows = [];
    cat.terms.forEach((t, idx)=>{
      const label = t.es ? `${t.en} <span style="color:var(--ink-faint); font-weight:400;">/ ${escapeHtml(t.es)}</span>` : escapeHtml(t.en);
      const matches = !q || (t.en||'').toLowerCase().includes(q) || (t.es||'').toLowerCase().includes(q) || (t.def||'').toLowerCase().includes(q);
      if(!matches) return;

      if(t.url){
        rows.push({ term: label, kind: 'Source', confirmed: true, url: t.url, idx });
      } else if(cat.id !== 'resources'){
        if(t.en) rows.push({ term: label, kind: 'EN lookup', confirmed: false, url: mplusUrl(t.en,'en'), idx });
        if(t.es) rows.push({ term: label, kind: 'ES lookup', confirmed: false, url: mplusUrl(t.es,'es'), idx });
      }
    });
    if(rows.length===0) return;
    totalRows += rows.length;

    sectionsHtml += `<div class="section-head"><h2>${escapeHtml(cat.name)}</h2><span class="sub">${rows.length} link${rows.length===1?'':'s'}</span></div>`;
    sectionsHtml += `<div class="dir-group">`;
    rows.forEach(r=>{
      sectionsHtml += `
        <div class="dir-row">
          <span class="dir-dot" style="background:${cat.color}"></span>
          <span class="dir-term">${r.term}</span>
          <span class="dir-kind ${r.confirmed?'confirmed':''}">${r.kind}</span>
          <a class="dir-url" href="${escapeAttr(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.url)}</a>
          <button class="icon-btn" title="Edit this link" onclick="openEditModal('${cat.id}', ${r.idx})">✎</button>
          <a class="dir-go" href="${escapeAttr(r.url)}" target="_blank" rel="noopener" title="Open link">${ICON_EXTERNAL}</a>
        </div>
      `;
    });
    sectionsHtml += `</div>`;
  });

  if(totalRows===0){
    return `<div class="empty"><div class="glyph">${ICON_CHAIN}</div>No links match your search.</div>`;
  }

  const intro = `<p style="font-size:12.5px; color:var(--ink-soft); max-width:640px; margin:-6px 0 26px 0; line-height:1.6;">
    Every clickable reference in the glossary, in one place — confirmed source links your team has pasted in, plus the live MedlinePlus lookups used as a fallback. Click the pencil on any row to edit a link, or use "+ Add link" above to add a new one to any domain.
  </p>`;

  return intro + sectionsHtml;
}

async function saveTerm(){
  const en = document.getElementById('fEn').value.trim();
  if(!en){ showToast('English term is required.'); return; }
  const es = document.getElementById('fEs').value.trim();
  const def = document.getElementById('fDef').value.trim();
  const source = document.getElementById('fSource').value.trim();
  let url = document.getElementById('fSourceUrl').value.trim();
  if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url;
  const newCategoryId = document.getElementById('fCategory').value;
  const editor = whoAmI();
  const targetCatName = DATA.categories.find(c=>c.id===newCategoryId).name;

  const existingId = editingContext ? DATA.categories.find(c=>c.id===editingContext.categoryId).terms[editingContext.idx].id : null;
  const record = { id: existingId || genId(), en, es, def, source, url: url || undefined, editedBy: editor || undefined, editedOn: editor ? timeAgoLabel() : undefined };

  if(editingContext){
    const oldCat = DATA.categories.find(c=>c.id===editingContext.categoryId);
    if(editingContext.categoryId === newCategoryId){
      // Same domain — update in place so the term doesn't jump to the bottom of the list.
      oldCat.terms[editingContext.idx] = record;
    } else {
      // Moved to a different domain — remove from the old one, append to the new one.
      oldCat.terms.splice(editingContext.idx, 1);
      const targetCat = DATA.categories.find(c=>c.id===newCategoryId);
      targetCat.terms.push(record);
    }
    logActivity(`updated "${en}" in ${targetCatName}`);
  } else {
    const targetCat = DATA.categories.find(c=>c.id===newCategoryId);
    targetCat.terms.push(record);
    logActivity(`added "${en}" to ${targetCatName}`);
  }

  closeModal();
  await persist();
  showToast('Term saved.');
  render();
}

async function deleteTerm(categoryId, idx){
  const cat = DATA.categories.find(c=>c.id===categoryId);
  const term = cat.terms[idx];
  if(!confirm(`Delete "${term.en}"? This can't be undone.`)) return;
  cat.terms.splice(idx,1);
  await persist();
  logActivity(`removed "${term.en}" from ${cat.name}`);

  // Clean up any files that were attached to this term.
  const orphaned = ATTACHMENTS.filter(a=>a.termId===term.id);
  if(orphaned.length && db){
    orphaned.forEach(a=> db.collection('term-attachments').doc(a.id).delete().catch(()=>{}));
    ATTACHMENTS = ATTACHMENTS.filter(a=>a.termId!==term.id);
  }

  showToast('Term deleted.');
  render();
}

function slugify(s){
  return (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'domain';
}

async function saveDomain(){
  const name = document.getElementById('fDomainName').value.trim();

  const reserved = ['all','directory','providers','chat','notes','updates'];
  const existingIds = DATA.categories.map(c=>c.id).concat(reserved);
  const base = slugify(name);
  let id = base, n = 2;
  while(existingIds.includes(id)){ id = `${base}-${n}`; n++; }

  DATA.categories.push({ id, name, color: selectedSwatch, terms: [] });
  closeDomainModal();
  await persist();
  activeCategory = id;
  logActivity(`created the "${name}" domain`);
  showToast('Domain created.');
  render();
}

function deleteDomain(id){
  const cat = DATA.categories.find(c=>c.id===id);
  if(!cat) return;
  if(cat.terms.length>0){ showToast('Remove all terms from a domain before deleting it.'); return; }
  if(!confirm(`Delete the empty "${cat.name}" domain?`)) return;
  DATA.categories = DATA.categories.filter(c=>c.id!==id);
  if(activeCategory===id) activeCategory = 'all';
  persist().then(()=>{ logActivity(`deleted the "${cat.name}" domain`); showToast('Domain deleted.'); render(); });
}

// Resizes/compresses the chosen photo client-side (max 480px, JPEG ~70%)
// before it's ever saved, so a single provider document stays well under
// Firestore's 1MB limit — no separate file-storage service needed.
function handlePhotoSelect(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('Please choose an image file.'); return; }

  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxDim = 480;
      let w = img.width, h = img.height;
      if(w >= h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
      else if(h > w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      pendingPhotoDataUrl = canvas.toDataURL('image/jpeg', 0.72);
      renderPhotoPreview();
    };
    img.onerror = ()=>{ showToast('Could not read that image.'); };
    img.src = e.target.result;
  };
  reader.onerror = ()=>{ showToast('Could not read that image.'); };
  reader.readAsDataURL(file);
}

async function saveProvider(){
  const name = document.getElementById('fPName').value.trim();
  if(!name){ showToast('Provider name is required.'); return; }
  const role = document.getElementById('fPRole').value.trim();
  const facility = document.getElementById('fPFacility').value.trim();
  const phone = document.getElementById('fPPhone').value.trim();
  const notes = document.getElementById('fPNotes').value.trim();
  const editor = whoAmI();
  const existing = editingProviderId ? PROVIDERS.find(p=>p.id===editingProviderId) : null;

  const record = {
    name, role, facility, phone, notes,
    photo: pendingPhotoDataUrl || null,
    addedBy: editor || (existing && existing.addedBy) || '',
    updatedAt: Date.now()
  };

  try{
    const id = await persistProvider(record, editingProviderId);
    if(!id) return;
    if(editingProviderId){
      const idx = PROVIDERS.findIndex(p=>p.id===editingProviderId);
      if(idx>-1) PROVIDERS[idx] = { id, ...record };
      const photoChanged = pendingPhotoDataUrl && pendingPhotoDataUrl !== (existing && existing.photo);
      logActivity(photoChanged ? `added a photo for ${name}` : `updated the provider ${name}`);
    } else {
      PROVIDERS.push({ id, ...record });
      logActivity(pendingPhotoDataUrl ? `added a provider with a photo: ${name}` : `added a provider: ${name}`);
    }
    closeProviderModal();
    showToast('Provider saved.');
    render();
  }catch(err){
    showToast('Could not save provider — check your connection.');
  }
}

async function deleteProvider(id){
  const p = PROVIDERS.find(x=>x.id===id);
  if(!p) return;
  if(!confirm(`Delete "${p.name}"? This can't be undone.`)) return;
  try{
    await deleteProviderRemote(id);
    PROVIDERS = PROVIDERS.filter(x=>x.id!==id);
    logActivity(`removed the provider ${p.name}`);
    showToast('Provider deleted.');
    render();
  }catch(err){
    showToast('Could not delete — check your connection.');
  }
}

/* ============ Notes: modal ============ */
function openAddNoteModal(){
  editingNoteId = null;
  pendingNoteAttachment = null;
  document.getElementById('noteModalTitle').textContent = 'Add note';
  document.getElementById('fNoteText').value = '';
  renderNoteAttachPreview();
  document.getElementById('noteOverlay').classList.add('show');
  document.getElementById('fNoteText').focus();
}

function openEditNoteModal(id){
  const n = NOTES.find(x=>x.id===id);
  if(!n) return;
  editingNoteId = id;
  pendingNoteAttachment = n.attachment || null;
  document.getElementById('noteModalTitle').textContent = 'Edit note';
  document.getElementById('fNoteText').value = n.text || '';
  renderNoteAttachPreview();
  document.getElementById('noteOverlay').classList.add('show');
  document.getElementById('fNoteText').focus();
}

function closeNoteModal(){
  document.getElementById('noteOverlay').classList.remove('show');
  editingNoteId = null;
  pendingNoteAttachment = null;
}

async function saveNote(){
  const text = document.getElementById('fNoteText').value.trim();
  if(!text){ showToast('Note can\'t be empty.'); return; }
  const editor = whoAmI();
  const existing = editingNoteId ? NOTES.find(n=>n.id===editingNoteId) : null;
  const isNew = !editingNoteId;

  const record = {
    text,
    attachment: pendingNoteAttachment || null,
    author: editor || (existing && existing.author) || '',
    createdAt: (existing && existing.createdAt) || Date.now(),
    updatedAt: Date.now()
  };

  try{
    const id = await persistNote(record, editingNoteId);
    if(!id) return;
    if(editingNoteId){
      const idx = NOTES.findIndex(n=>n.id===editingNoteId);
      if(idx>-1) NOTES[idx] = { id, ...record };
    } else {
      NOTES.push({ id, ...record });
    }
    closeNoteModal();
    logActivity(isNew ? 'left a note' : 'updated a note');
    showToast('Note saved.');
    render();
  }catch(err){
    showToast('Could not save note — check your connection.');
  }
}

async function deleteNote(id){
  const n = NOTES.find(x=>x.id===id);
  if(!n) return;
  if(!confirm('Delete this note? This can\'t be undone.')) return;
  try{
    await deleteNoteRemote(id);
    if(storage && n.attachment && n.attachment.storagePath){
      storage.ref().child(n.attachment.storagePath).delete().catch(()=>{});
    }
    NOTES = NOTES.filter(x=>x.id!==id);
    logActivity('deleted a note');
    showToast('Note deleted.');
    render();
  }catch(err){
    showToast('Could not delete — check your connection.');
  }
}

/* ============ Init ============ */
loadData();
loadProviders();
loadNotes();
loadAttachments();
startChatListener();
startActivityListener();
</script>
