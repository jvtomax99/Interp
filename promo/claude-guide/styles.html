<!doctype html>
<html><head><meta charset="utf-8">
<title>Claude guide: style frames</title>
<style>
@font-face{font-family:Fredoka;src:url(fonts/fredoka-latin-wght.woff2) format('woff2');font-weight:300 700}
@font-face{font-family:Inter;src:url(fonts/inter-latin-var.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden}
:root{--navy:#252E6D;--ink:#151C2C;--accent:#0F5FA6;--accent2:#2E8BD0;--cyan:#01B8E6;--danger:#C2485C}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute}

/* ---------- Direction A: sticker book ---------- */
.A .stage{background:#FFF6E9;font-family:Fredoka,sans-serif;color:#2B2A4C}
.A .stage::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 15% 12%,#FFD9E4 0 160px,transparent 161px),
             radial-gradient(circle at 92% 30%,#D6F0FF 0 220px,transparent 221px),
             radial-gradient(circle at 8% 78%,#E4F7D9 0 200px,transparent 201px),
             radial-gradient(#F0DCC4 2.2px,transparent 2.6px) 0 0/44px 44px}
.A .tag{left:60px;top:90px;padding:18px 34px;border-radius:999px;background:#2B2A4C;color:#FFF6E9;font-size:38px;font-weight:600;transform:rotate(-2deg)}
.A .tag b{color:#FFC94D;font-weight:700}
.A .sticker{filter:drop-shadow(0 0 0 #fff) drop-shadow(8px 0 0 #fff) drop-shadow(-8px 0 0 #fff) drop-shadow(0 8px 0 #fff) drop-shadow(0 -8px 0 #fff) drop-shadow(0 14px 18px rgba(80,60,40,.28))}
.A .cap{left:60px;right:60px;bottom:120px;padding:40px 46px;border-radius:44px;background:#fff;border:6px solid #2B2A4C;box-shadow:0 14px 0 #2B2A4C;font-size:60px;line-height:1.18;font-weight:600;text-align:center}
.A .cap em{font-style:normal;background:linear-gradient(transparent 52%,#FFB3C7 52%,#FFB3C7 92%,transparent 92%);padding:0 6px}
.A .doodle{stroke:#2B2A4C;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Direction B: Hub glass ---------- */
.B .stage{background:#EAF1FB;font-family:Inter,sans-serif;color:var(--ink)}
.B .stage::before{content:"";position:absolute;inset:-200px;filter:blur(60px);
  background:radial-gradient(circle at 20% 15%,#9FD3FF 0 260px,transparent 520px),
             radial-gradient(circle at 85% 40%,#C9C2FF 0 240px,transparent 520px),
             radial-gradient(circle at 25% 80%,#9FF0E6 0 200px,transparent 480px),
             radial-gradient(circle at 80% 95%,#FFD3E8 0 180px,transparent 420px)}
.B .tag{left:60px;top:90px;padding:18px 30px;border-radius:999px;background:rgba(255,255,255,.62);backdrop-filter:blur(20px) saturate(180%);
  box-shadow:0 1px 0 0 inset rgba(255,255,255,.82),0 1px 2px rgba(20,43,67,.06),0 8px 20px -12px rgba(22,55,90,.22);font-size:34px;font-weight:650;letter-spacing:-.01em;color:var(--navy)}
.B .tag b{color:var(--accent2);font-weight:750}
.B .sticker{filter:drop-shadow(0 22px 30px rgba(22,55,90,.28))}
.B .cap{left:60px;right:60px;bottom:120px;padding:40px 46px;border-radius:40px;background:rgba(255,255,255,.72);backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 1px 0 0 inset rgba(255,255,255,.9),0 2px 4px rgba(20,43,67,.06),0 30px 60px -30px rgba(22,55,90,.45);font-size:58px;line-height:1.2;font-weight:650;letter-spacing:-.02em;text-align:center;color:var(--navy)}
.B .cap em{font-style:normal;color:#0B3F73;background:linear-gradient(transparent 55%,#BFE0FF 55%,#BFE0FF 92%,transparent 92%);padding:0 6px}
.B .doodle{stroke:var(--navy);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
.glass{background:rgba(255,255,255,.66);backdrop-filter:blur(20px) saturate(180%);border-radius:40px;
  box-shadow:0 1px 0 0 inset rgba(255,255,255,.9),0 2px 4px rgba(20,43,67,.06),0 30px 60px -30px rgba(22,55,90,.45)}

/* shared pieces */
.smiley{width:520px;height:520px}
.smiley>svg{width:100%;height:100%;overflow:visible}
.pin{width:150px;height:150px}
.note{font-size:46px;line-height:1.15;padding:34px 36px;width:430px}
.A .note{background:#FFF27A;border-radius:6px;font-weight:600;box-shadow:0 18px 24px -10px rgba(80,60,40,.35)}
.A .note.p{background:#FFC6D9}.A .note.b{background:#C8ECFF}
.B .note{font-weight:600;letter-spacing:-.015em;color:var(--navy)}
.screen{border-radius:46px;overflow:hidden;width:400px;height:640px;background:#fff}
.A .screen{border:10px solid #2B2A4C;box-shadow:0 16px 0 #2B2A4C}
.B .screen{box-shadow:0 0 0 10px rgba(255,255,255,.7),0 40px 70px -30px rgba(22,55,90,.55)}
.screen img{width:100%;display:block;margin-top:-96px}
.mono{font-family:ui-monospace,Menlo,monospace}
</style></head>
<body>
<div class="stage" id="stage"></div>
<script>
const P = new URLSearchParams(location.search), DIR = P.get('dir') || 'A', F = +(P.get('f') || 1);
document.body.className = DIR;
const FRAMES = ['rest','blink1','blink2','shut','wink1','wink2','wink','smile1','smile2','smile','laugh1','laugh2','laugh','laughB','lookL','lookR','love','sleep',
  'halfL','halfR','lookU','lookD','lookUL','lookUR','lookDL','lookDR','surprised','sad','worried','doubt'];
const FW = 151, FH = 111;
/* Dr. Smiley as the app draws him (drSmileyArt in features/smiley-engine.js), one face frame */
function smiley(face, hat){
  const i = FRAMES.indexOf(face);
  return `<svg viewBox="4 4 112 112">
    <image href="assets/drsmiley/base.webp" x="14" y=".8" width="106" height="132.5" preserveAspectRatio="none"/>
    <svg x="31.667" y="47.617" width="66.692" height="49.025" viewBox="${i*FW} 0 ${FW} ${FH}" preserveAspectRatio="none">
      <image href="assets/drsmiley/face.webp" x="0" y="0" width="${FW*FRAMES.length}" height="${FH}" preserveAspectRatio="none"/></svg>
    <image href="assets/drsmiley/brow-l.webp" x="33.875" y="39.446" width="28.708" height="14.354" preserveAspectRatio="none"/>
    <image href="assets/drsmiley/brow-r.webp" x="73.625" y="42.758" width="27.604" height="19.875" preserveAspectRatio="none"/>
    ${hat ? `<image href="assets/drsmiley/hat-${hat}.webp" x="6" y="-50" width="124" height="163" preserveAspectRatio="none"/>` : ''}
  </svg>`;
}
const pin = (k, x, y, s = 150, r = 0) => `<img class="abs sticker pin" src="assets/pins/${k}.webp" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;transform:rotate(${r}deg)">`;
const A = DIR === 'A';

/* the tiny robot (junior developer) at his desk */
const robot = `<svg viewBox="0 0 420 420" width="460" height="460">
  <ellipse cx="210" cy="400" rx="170" ry="16" fill="${A ? '#E9D6BE' : 'rgba(37,46,109,.15)'}"/>
  <line x1="210" y1="40" x2="210" y2="80" stroke="${A ? '#2B2A4C' : '#252E6D'}" stroke-width="8" stroke-linecap="round"/>
  <circle cx="210" cy="32" r="16" fill="${A ? '#FF6B8B' : '#01B8E6'}"/>
  <rect x="110" y="78" width="200" height="150" rx="56" fill="${A ? '#8FD3FF' : '#fff'}" stroke="${A ? '#2B2A4C' : '#C9D6EA'}" stroke-width="${A ? 8 : 4}"/>
  <rect x="140" y="112" width="140" height="78" rx="36" fill="${A ? '#2B2A4C' : '#252E6D'}"/>
  <ellipse cx="182" cy="150" rx="13" ry="17" fill="#7CF5FF"/><ellipse cx="238" cy="150" rx="13" ry="17" fill="#7CF5FF"/>
  <path d="M190 176 q20 12 40 0" stroke="#7CF5FF" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="132" cy="190" r="11" fill="${A ? '#FFB3C7' : '#FFC6DA'}"/><circle cx="288" cy="190" r="11" fill="${A ? '#FFB3C7' : '#FFC6DA'}"/>
  <rect x="140" y="232" width="140" height="70" rx="26" fill="${A ? '#8FD3FF' : '#fff'}" stroke="${A ? '#2B2A4C' : '#C9D6EA'}" stroke-width="${A ? 8 : 4}"/>
  <path d="M60 310 h300 l-24 90 h-252z" fill="${A ? '#FFC94D' : '#2E8BD0'}" stroke="${A ? '#2B2A4C' : 'none'}" stroke-width="8" stroke-linejoin="round"/>
  <rect x="120" y="262" width="180" height="58" rx="10" fill="${A ? '#2B2A4C' : '#252E6D'}" transform="skewX(-12) translate(56 0)"/>
  <path d="M130 270 q-30 -8 -20 -40" stroke="${A ? '#2B2A4C' : '#9FB2CF'}" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M290 270 q30 -8 20 -40" stroke="${A ? '#2B2A4C' : '#9FB2CF'}" stroke-width="16" fill="none" stroke-linecap="round"/>
</svg>`;
const chip = (t, x, y, r, c) => `<div class="abs mono" style="left:${x}px;top:${y}px;transform:rotate(${r}deg);padding:12px 20px;border-radius:16px;font-size:30px;font-weight:700;
  background:${A ? c : 'rgba(255,255,255,.75)'};color:${A ? '#2B2A4C' : '#252E6D'};${A ? 'border:5px solid #2B2A4C' : 'box-shadow:0 10px 20px -10px rgba(22,55,90,.4)'}">${t}</div>`;

const scenes = {
  1: () => `
    <div class="abs tag"><b>1</b> · Claude is your junior developer</div>
    <div class="abs" style="left:70px;top:330px">${chip('&lt;button&gt;', 0, 0, -8, '#C8ECFF')}</div>
    ${chip('if (tap) {', 520, 300, 6, '#FFC6D9')}${chip('save()', 760, 420, -5, '#E4F7D9')}${chip('}', 470, 450, 10, '#FFF27A')}
    <div class="abs sticker" style="left:520px;top:560px">${robot}</div>
    <div class="abs sticker smiley" style="left:20px;top:620px;width:560px;height:560px">${smiley('smile', 'grad')}</div>
    <svg class="abs doodle" style="left:330px;top:400px" width="160" height="160" viewBox="0 0 160 160">
      <path d="M80 20 a40 40 0 0 1 24 72 v20 h-48 v-20 a40 40 0 0 1 24 -72z" ${A ? 'fill="#FFE066"' : 'fill="rgba(255,224,102,.8)"'}/><path d="M60 128 h40 M64 142 h32"/>
      <path d="M20 40 l-14 -10 M140 40 l14 -10 M80 0 v-0"/></svg>
    <div class="abs cap">You're the <em>boss</em>. You bring the idea. Claude does the typing.</div>`,
  2: () => `
    <div class="abs tag"><b>2</b> · Profile settings</div>
    ${A ? `<div class="abs" style="left:60px;top:220px;width:960px;height:980px;border-radius:30px;background:#D9A877;border:12px solid #9A6A3F;box-shadow:inset 0 0 0 8px #C8925F, 0 20px 30px -10px rgba(80,60,40,.4);
       background-image:radial-gradient(#C58F5C 3px,transparent 3.5px);background-size:26px 26px"></div>`
       : `<div class="abs glass" style="left:60px;top:220px;width:960px;height:980px"></div>`}
    <div class="abs note" style="left:110px;top:290px;transform:rotate(-4deg)">Use plain words. I'm new to this.</div>
    <div class="abs note p" style="left:560px;top:330px;transform:rotate(3deg)">Give me buttons, and tell me your pick.</div>
    <div class="abs note b" style="left:120px;top:640px;transform:rotate(2deg)">Challenge me. Tell me when my idea is weak.</div>
    <div class="abs note" style="left:575px;top:690px;transform:rotate(-3deg);width:400px">Say "done" when it's done.</div>
    ${A ? '' : `<style>.B .note{background:rgba(255,255,255,.8);border-radius:28px;box-shadow:0 1px 0 0 inset #fff,0 24px 40px -24px rgba(22,55,90,.5)}</style>`}
    ${[[160, 275], [600, 315], [175, 625], [620, 675]].map(([x, y]) => A ? `<div class="abs" style="left:${x+150}px;top:${y}px;width:34px;height:34px;border-radius:50%;background:#E0567A;box-shadow:0 6px 8px rgba(0,0,0,.25)"></div>` : '').join('')}
    <div class="abs sticker smiley" style="left:600px;top:930px;width:440px;height:440px">${smiley('smile')}</div>
    <div class="abs cap">Claude applies your profile to <em>every</em> conversation.</div>`,
  3: () => `
    <div class="abs tag"><b>3</b> · CLAUDE.md, the project's rulebook</div>
    ${A ? `<div class="abs" style="left:150px;top:200px;width:780px;height:1100px;border-radius:40px;background:#E8F4FB;border:10px solid #2B2A4C"></div>
           <div class="abs" style="left:150px;top:610px;width:780px;height:10px;background:#2B2A4C"></div>
           <div class="abs" style="left:205px;top:360px;width:24px;height:150px;border-radius:12px;background:#2B2A4C"></div>
           <div class="abs" style="left:205px;top:700px;width:24px;height:200px;border-radius:12px;background:#2B2A4C"></div>`
        : `<div class="abs glass" style="left:150px;top:200px;width:780px;height:1100px"></div>`}
    <div class="abs ${A ? 'sticker' : ''}" style="left:300px;top:330px;width:560px;padding:40px 44px 50px;transform:rotate(-3deg);background:#fff;${A ? 'border-radius:8px' : 'border-radius:32px;box-shadow:0 1px 0 0 inset #fff,0 30px 50px -24px rgba(22,55,90,.5)'}">
      <div style="font-size:52px;font-weight:700;margin-bottom:20px;${A ? '' : 'color:#252E6D;letter-spacing:-.02em'}">CLAUDE.md</div>
      ${[['About', 'An interpreting app for phones'], ['Map', 'Where every file lives'], ['Rules', 'Never change the version by hand'], ['Lessons', 'Hover doesn’t work on phones']]
        .map(([k, v], j) => `<div style="display:flex;gap:18px;align-items:baseline;margin:16px 0;font-size:34px;line-height:1.2">
          <span style="flex:none;padding:6px 16px;border-radius:999px;font-size:26px;font-weight:700;background:${A ? ['#C8ECFF', '#E4F7D9', '#FFC6D9', '#FFF27A'][j] : ['#E8F1FA', '#E6F7F4', '#FBECEF', '#FFF6DA'][j]};color:#2B2A4C">${k}</span>
          <span style="font-weight:500;color:${A ? '#2B2A4C' : '#5A6478'}">${v}</span></div>`).join('')}
    </div>
    ${A ? `<div class="abs" style="left:540px;top:300px;width:90px;height:90px;border-radius:50%;background:#FF6B8B;border:7px solid #2B2A4C;box-shadow:0 8px 0 #2B2A4C"></div>` : ''}
    <div class="abs sticker smiley" style="left:10px;top:860px;width:480px;height:480px">${smiley('lookUR')}</div>
    <div class="abs cap">Like the note you leave a <em>babysitter</em>.</div>`,
  4: () => `
    <div class="abs tag"><b>4</b> · Handoff</div>
    <svg class="abs sticker" style="left:330px;top:300px" width="420" height="520" viewBox="0 0 420 520">
      <path d="M150 70 q60 -70 120 0" stroke="${A ? '#2B2A4C' : '#7D8FB5'}" stroke-width="22" fill="none" stroke-linecap="round"/>
      <path d="M60 140 q0 -70 70 -70 h160 q70 0 70 70 v300 q0 50 -50 50 h-200 q-50 0 -50 -50z" fill="${A ? '#FF8FA8' : '#2E8BD0'}" stroke="${A ? '#2B2A4C' : 'none'}" stroke-width="9"/>
      <path d="M100 300 h220 v120 q0 24 -24 24 h-172 q-24 0 -24 -24z" fill="${A ? '#FFC6D9' : '#5FA9E3'}" stroke="${A ? '#2B2A4C' : 'none'}" stroke-width="8"/>
      <rect x="180" y="330" width="60" height="22" rx="11" fill="${A ? '#2B2A4C' : '#252E6D'}"/>
    </svg>
    ${['the', 'ing', 'Doc', 'tor', ' pr', 'ep', 'CS', 'S', 'tap', '.md', 'He', 'llo']
      .map((t, j) => chip(t, 240 + (j % 4) * 160 + (j * 37 % 50), 190 + Math.floor(j / 4) * 95 + (j * 53 % 40), (j * 47 % 30) - 15, ['#C8ECFF', '#FFF27A', '#E4F7D9', '#FFC6D9'][j % 4])).join('')}
    <div class="abs sticker smiley" style="left:-20px;top:760px;width:470px;height:470px;transform:rotate(-6deg)">${smiley('worried')}</div>
    <div class="abs sticker smiley" style="left:610px;top:760px;width:470px;height:470px;transform:scaleX(-1)">${smiley('smile')}</div>
    <div class="abs ${A ? 'sticker' : ''}" style="left:385px;top:900px;width:300px;padding:28px 26px;transform:rotate(-6deg);background:#fff;font-size:28px;line-height:1.3;font-weight:600;
      ${A ? 'border-radius:8px;color:#2B2A4C' : 'border-radius:24px;color:#252E6D;box-shadow:0 26px 40px -20px rgba(22,55,90,.55)'}">
      <div style="font-size:34px;font-weight:700;margin-bottom:10px">Handoff</div>Working on: …<br>Where it stands: …<br>Next: …<br><span style="color:${A ? '#E0567A' : '#2E8BD0'}">Paste this ➜</span></div>
    <div class="abs cap">A one-page note, so the next chat starts <em>fresh</em>.</div>`,
};
document.getElementById('stage').innerHTML = scenes[F]();
</script>
</body></html>
