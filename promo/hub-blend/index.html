<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script>
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["hub-blend"] = new Promise((res) => {
        window.__hfBuildResolve = (p) => p.then(res, (e) => { console.error(e); res(); });
      });
    </script>
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.js" } }
    </script>
    <style>
      @font-face { font-family: "Inter Tight"; font-weight: 500; src: url("fonts/inter-tight-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter Tight"; font-weight: 800; src: url("fonts/inter-tight-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter Tight"; font-weight: 900; src: url("fonts/inter-tight-latin-900-normal.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #03061a; }
      #root { position: relative; width: 1080px; height: 1920px; }
      #stage { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
      #fade { position: absolute; inset: 0; background: #02040e; opacity: 1; }
      #endbg { position: absolute; inset: 0; opacity: 0; transform-origin: 30% 40%;
        background: linear-gradient(180deg, rgba(3,6,26,0.15) 0%, rgba(3,6,26,0.55) 45%, rgba(3,6,26,0.92) 70%, #03061a 100%),
                    url("assets/humc/skybridge-sunset.jpg") 0% 30% / cover no-repeat; filter: saturate(0.9); }
      #endcard {
        position: absolute; left: 0; right: 0; top: 860px; display: flex; flex-direction: column; align-items: center;
        color: #fff; text-align: center; opacity: 0; font-family: "Inter Tight", sans-serif;
      }
      #e-smiley { width: 300px; height: auto; transform-origin: 50% 90%; -webkit-mask-image: linear-gradient(#000 80%, transparent); mask-image: linear-gradient(#000 80%, transparent); }
      #e-name { margin-top: 8px; font-weight: 800; font-size: 96px; letter-spacing: -0.02em; text-shadow: 0 0 40px rgba(120,200,255,0.55); }
      #e-tag { margin-top: 6px; font-weight: 500; font-size: 36px; color: rgba(255,255,255,0.8); }
      #e-url { margin-top: 34px; padding: 14px 40px; border-radius: 999px; background: #fff; color: #0b1a4a; font: 500 32px "JetBrains Mono", monospace; }
      #e-live { margin-top: 18px; font-weight: 500; font-size: 28px; color: rgba(255,255,255,0.65); }
      #e-c1 { margin-top: 44px; font-weight: 800; font-size: 84px; letter-spacing: -0.02em; }
      #e-c2 { --wipe: 0; position: relative; margin-top: 6px; font-weight: 800; font-size: 84px; letter-spacing: -0.02em; color: #0b1a4a; padding: 0 22px; border-radius: 10px;
        background: linear-gradient(90deg, #3fc6ee calc(var(--wipe) * 100%), transparent calc(var(--wipe) * 100%)); box-shadow: 0 0 40px rgba(63,198,238,0.35); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="31" data-width="1080" data-height="1920">
      <canvas id="stage" class="clip" data-start="0" data-duration="31" data-track-index="0"></canvas>
      <div id="fade" class="clip" data-start="0" data-duration="31" data-track-index="1"></div>
      <div id="endbg" class="clip" data-start="0" data-duration="31" data-track-index="4"></div>
      <div id="endcard" class="clip" data-start="0" data-duration="31" data-track-index="2">
        <img id="e-smiley" src="assets/drsmiley.png" alt="" />
        <div id="e-name"></div>
        <div id="e-url"></div>
        <div id="e-live"></div>
        <div id="e-c1"></div>
        <div id="e-c2"></div>
      </div>
      <audio id="music" src="assets/music.m4a" data-start="0" data-duration="31" data-track-index="3" data-timeline-role="music"></audio>
    </div>
    <script src="./vendor/gsap.min.js"></script>
    <script>
      // Motion is driven by hf-seek in src/main.js; empty root timeline satisfies the runtime contract.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
