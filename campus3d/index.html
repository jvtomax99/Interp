<style>
/* The CoreCHI campus full screen (opened from its card): the board in 3D, glass controls over it in the Hub's look. */
:root{
  --sky:linear-gradient(#5f95d0,#93c0ec 40%,#c3def6);
  --ink:#151C2C; --ink-soft:#5A6478; --glass:rgba(255,255,255,.74); --line:rgba(255,255,255,.9);
  --gold:#FFD58A; --gold-2:#FFB443; --navy:#252E6D;
  --ui:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  --finish:0 1px 0 0 inset rgba(255,255,255,.82),0 1px 2px rgba(20,43,67,.06),0 8px 20px -12px rgba(22,55,90,.22);
}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#5f95d0;color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;background:var(--sky);touch-action:none}
#stage canvas{position:relative;display:block;width:100%;height:100%;opacity:0;transition:opacity .5s}
body.ready #stage canvas{opacity:1}
.sun{position:absolute;left:0;top:0;width:118px;height:118px;transform:translate(-50%,-50%);will-change:transform;pointer-events:none}
.sun .night{display:none}.sun.is-night .day{display:none}.sun.is-night .night{display:inline}.sun.is-night .halo{opacity:.35}
.sun .rays{animation:spin 40s linear infinite;transform-origin:0 0}
.sun .eyes{animation:blink 5.5s infinite;transform-origin:0 0;transform-box:view-box}
.sun .face{animation:bob 3.2s ease-in-out infinite}.sun .rays{transform-box:view-box}
@keyframes bob{50%{transform:translateY(-2.5px) scale(1.02,.98)}}
.sun.giggle svg{animation:giggle .9s cubic-bezier(.3,1.6,.5,1)}.sun.giggle .rays{animation-duration:2s}
.sun .zz{animation:zz 3s ease-in-out infinite}.sun .z2{animation-delay:1.2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.1)}}
@keyframes giggle{0%{transform:scale(1)}20%{transform:scale(1.18,.86)}40%{transform:scale(.9,1.12) rotate(-6deg)}60%{transform:scale(1.06,.95) rotate(5deg)}80%{transform:rotate(-2deg)}100%{transform:none}}
@keyframes zz{0%,100%{opacity:0;transform:translateY(4px)}40%,70%{opacity:1;transform:none}}

#loading{position:fixed;inset:0;display:grid;place-items:center;font-weight:550;color:#fff;text-shadow:0 1px 3px rgba(20,43,67,.4);pointer-events:none;padding:0 26px;text-align:center}
body.ready #loading{display:none}
.glass{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--finish);border:1px solid var(--line)}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 13px);left:max(13px,env(safe-area-inset-left,0px));right:max(13px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:9px;pointer-events:none}
.top .title{pointer-events:auto;border-radius:999px;padding:7px 13px;min-width:0}
.top .title b{display:block;font-size:15px;font-weight:650;letter-spacing:-.2px}
.top .title small{display:block;font-size:12px;font-weight:550;color:var(--ink-soft)}
.top .sp{flex:1}
.round{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);font:650 20px var(--ui);padding:0}
.round svg{width:20px;height:20px}
#badges{position:fixed;inset:0;pointer-events:none}
.badge{position:absolute;left:0;top:0;pointer-events:auto;font:650 13px var(--ui);color:#fff;background:rgba(21,28,44,.78);border:1.5px solid rgba(255,255,255,.35);border-radius:99px;padding:6px 11px;white-space:nowrap;cursor:pointer}
.badge b{color:var(--gold);font-weight:650}
.badge.on{background:linear-gradient(var(--gold),var(--gold-2));color:#2a1a08;border-color:#fff}.badge.on b{color:#2a1a08}
.badge.done{border-color:var(--gold)}
body.is-finished .badge b{display:none}
button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
#card{position:fixed;left:max(13px,env(safe-area-inset-left,0px));right:max(13px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 136px);border-radius:20px;padding:13px 13px 13px 17px;display:grid;grid-template-columns:1fr auto auto;gap:2px 9px;align-items:center;max-width:560px;margin:0 auto;animation:up .45s cubic-bezier(.2,.8,.2,1)}
#cardK{font-size:20px;font-weight:650;letter-spacing:-.3px}
#cardP,#cardF{font-size:13px;color:var(--ink-soft);grid-column:1}
#cardF{color:#8a5a12;font-weight:650}
.go{grid-row:1/4;grid-column:2;border:0;border-radius:14px;min-height:44px;padding:0 17px;font:650 15px var(--ui);color:#2a1a08;background:linear-gradient(180deg,var(--gold),var(--gold-2));box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 4px 0 #C9801E;cursor:pointer}
.go:active{transform:translateY(3px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 1px 0 #C9801E}
#cardX{grid-row:1/4;grid-column:3;width:36px;height:36px;border-radius:50%;border:0;background:rgba(21,28,44,.08);color:var(--ink);font-size:18px;cursor:pointer}
@keyframes up{from{transform:translateY(16px);opacity:0}}
.bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 17px);display:flex;justify-content:center;pointer-events:none;padding:0 13px}
.bar .glass{pointer-events:auto;border-radius:22px;display:flex;flex-direction:column;gap:6px;padding:6px;width:100%;max-width:420px;box-sizing:border-box}
.bar .row{display:flex;align-items:center;gap:9px}
.bar .row.look{padding-left:11px;justify-content:space-between}
.bar span{font-size:13px;font-weight:550;color:var(--ink-soft);white-space:nowrap}
/* the time of day: the clock, today's sky as a track to slide along, and Now to follow your own clock again */
.time{padding-left:9px}
.time svg{flex:none;width:20px;height:20px;color:#C9801E}
#hourOut{flex:none;width:74px;white-space:nowrap;font-size:15px;font-weight:650;letter-spacing:-.2px;font-variant-numeric:tabular-nums;color:var(--ink)}
#hour{flex:1;min-width:0;height:44px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;border-radius:999px;background-clip:content-box;padding:12px 0;box-sizing:border-box;cursor:pointer;touch-action:pan-x}
#hour::-webkit-slider-runnable-track{height:20px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px rgba(21,28,44,.12)}
#hour::-moz-range-track{height:20px;border-radius:999px;background:transparent;box-shadow:inset 0 0 0 1px rgba(21,28,44,.12)}
#hour::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;margin-top:-4px;border-radius:50%;background:#fff;border:3px solid var(--gold-2);box-shadow:0 2px 6px rgba(22,55,90,.3)}
#hour::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--gold-2);box-shadow:0 2px 6px rgba(22,55,90,.3)}
#now{flex:none;border:1px solid rgba(21,28,44,.14);background:transparent;color:var(--ink);font:650 15px var(--ui);border-radius:999px;min-height:44px;padding:0 15px;cursor:pointer}
#now.on{background:var(--gold);border-color:var(--gold);color:#2a1a08}
#finished{border:0;border-radius:999px;min-height:44px;padding:0 17px 0 13px;display:flex;align-items:center;gap:9px;font:650 15px var(--ui);color:#fff;background:var(--navy);cursor:pointer;white-space:nowrap}
#finished i{width:34px;height:20px;border-radius:999px;background:rgba(255,255,255,.3);position:relative;transition:background .3s}
#finished i::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#finished[aria-pressed="true"] i{background:#34C77B}
#finished[aria-pressed="true"] i::after{transform:translateX(14px)}
@media (max-width:380px){.bar .row.look span{display:none} .bar .row.look{padding-left:0;justify-content:center}}
@media (prefers-reduced-motion:reduce){.sun *{animation:none!important}#card{animation:none}#stage canvas{transition:none}#finished i,#finished i::after{transition:none}}
</style>
</head>

    $('cardK').textContent = name; $('cardP').textContent = `${place} · ${w}% of the exam`; $('cardF').textContent = FINISHED ? 'When you have mastered it' : f >= 1 ? 'Finished!' : `${Math.round(f*100)}% built`; $('card').hidden = false; }
  else { $('card').hidden = true; }
  document.querySelectorAll('.badge').forEach(el => el.classList.toggle('on', el.dataset.k === picked)); }
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x:e.clientX, y:e.clientY, t:performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => { if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), quick = performance.now() - down.t < 350; down = null;
  if (moved > 8 || !quick) return; { const sr = SUN.getBoundingClientRect(); if (e.clientX > sr.left && e.clientX < sr.right && e.clientY > sr.top && e.clientY < sr.bottom){ giggle(); return; } }
  const r = renderer.domElement.getBoundingClientRect(); ndc.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1); ray.setFromCamera(ndc, cam);
  const hits = ray.intersectObjects(Object.keys(BOX).map(k => BG[k]), true).filter(h => h.object.visible);
  let k = null; for (const h of hits){ let o = h.object; while (o && !(o.userData.key in BOX)) o = o.parent; if (o){ k = o.userData.key; break; } }
  pick(k); });
$('cardX').onclick = () => pick(null);

// ---- badges over the roofs ----
const BADGES = {}; for (const k in BOX){ const el = document.createElement('button'); el.className = 'badge'; el.dataset.k = k; el.innerHTML = `${NAMES[k][0]} <b></b>`; el.onclick = () => pick(k); $('badges').appendChild(el); BADGES[k] = el; }
const v3 = new THREE.Vector3();
function badges(){ const r = renderer.domElement.getBoundingClientRect(), at = [];
  for (const k in BOX){ const b = BOX[k], f = levelOf(k), y = Math.min(b.top, CUT[k].value) + 0.9 + LIFT[k].y;
    v3.set(b.x, y, b.z).project(cam); const el = BADGES[k], txt = f >= 1 ? '★' : Math.round(f*100) + '%', bb = el.querySelector('b'); if (bb.textContent !== txt) bb.textContent = txt; el.classList.toggle('done', f >= 1);
    if (!el._w || el._t !== el.textContent){ el._t = el.textContent; el._w = el.offsetWidth; el._h = el.offsetHeight; }
    at.push({ el, x:Math.max(el._w/2 + 6, Math.min(r.width - el._w/2 - 6, (v3.x+1)/2*r.width)), y:(1-v3.y)/2*r.height, w:el._w, h:el._h, back:v3.z > 1 }); }
  // nearest first; a badge that would cover one already placed moves up above it
  at.sort((a, b) => b.y - a.y); const placed = [];
  for (const a of at){ for (let g = 0; g < 8; g++){ const hit = placed.find(q => Math.abs(q.x - a.x) < (q.w + a.w)/2 + 4 && Math.abs(q.y - a.y) < a.h + 3); if (!hit) break; a.y = hit.y - a.h - 4; }
    placed.push(a); a.el.style.transform = `translate(${a.x.toFixed(1)}px, ${a.y.toFixed(1)}px) translate(-50%, -100%)`; } }

// ---- controls in the sheet ----
const nowH = () => { const [, , , h, mi] = nyParts(Date.now()); return h + mi/60; };
let follow = true;
$('hour').value = nowH(); setHour(nowH()); dayTrack();
$('hour').oninput = e => { follow = false; $('now').classList.remove('on'); $('now').setAttribute('aria-pressed', 'false'); setHour(+e.target.value); };
$('now').onclick = () => { follow = true; $('now').classList.add('on'); $('now').setAttribute('aria-pressed', 'true'); $('hour').value = nowH(); setHour(nowH()); };
const repick = () => { if (picked){ const k = picked; picked = null; pick(k); } };
if (!APP){ $('prog').oninput = e => { setProgress(+e.target.value/100); repick(); }; setProgress(0.6); }
else {
  // your coverage per building, and the names and weights the app knows, by message
  addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.ih !== 'campus3d-data') return;
    const d = e.data; for (const k in BOX) if (d.levels && k in d.levels) LEVEL[k] = +d.levels[k] || 0;
    if (d.names) for (const k in d.names) if (NAMES[k]) NAMES[k] = [d.names[k].short || NAMES[k][0], d.names[k].place || NAMES[k][1], d.names[k].weight ?? NAMES[k][2]];
    for (const k in BOX){ const el = BADGES[k]; el.firstChild.textContent = NAMES[k][0] + ' '; el._w = 0; }
    build(); repick(); });
  build(); tell({ t:'want' });
  $('finished').onclick = () => { FINISHED = !FINISHED; $('finished').setAttribute('aria-pressed', FINISHED ? 'true' : 'false'); document.body.classList.toggle('is-finished', FINISHED); build(); repick(); };
  $('cardGo').onclick = () => { if (picked) tell({ t:'practice', key:picked }); };
  $('close').onclick = () => tell({ t:'close' });
  addEventListener('keydown', e => { if (e.key === 'Escape'){ if (picked) pick(null); else tell({ t:'close' }); } });
  $('reset').onclick = () => { cam.position.set(-34, 70, 82); controls.target.set(0.5, -1.5, -3); controls.update(); };
  // a hidden page draws nothing
  document.addEventListener('visibilitychange', () => { if (!document.hidden){ last = performance.now(); requestAnimationFrame(frame); } });
}

// ---- the loop, with a frame meter ----
let slowSecs = 0, last = performance.now(), frames = 0, acc = 0, worst = 0, t0 = last;
function frame(now){ const dt = now - last; last = now; frames++; acc += dt; worst = Math.max(worst, dt);
  if (acc > 1000){ const fps = frames*1000/acc; $('fps').textContent = `${Math.round(fps)} fps`; $('fps').classList.toggle('slow', fps < 45);
    slowSecs = fps < 42 ? slowSecs + 1 : 0; if (slowSecs >= 2 && DPR > 1){ DPR = Math.max(1, DPR - 0.25); renderer.setPixelRatio(DPR); fit(); slowSecs = 0; }
    $("draws").textContent = `${DPR}x · ${renderer.info.render.calls} draws · ${Math.round(renderer.info.render.triangles/1000)}k tris`; frames = 0; acc = 0; worst = 0; }
  const t = (now - t0)/1000; if (!REDUCE) life(t);
  for (const k in BOX){ const L = LIFT[k], goal = k === picked ? 1.6 : 0; L.v += (goal - L.y)*0.12; L.v *= 0.72; L.y += L.v; if (Math.abs(L.y - BG[k].position.y) > 0.002) shadowsDirty(); BG[k].position.y = L.y; }
  if (ring) ring.material.opacity = 0.6 + Math.sin(t*4)*0.3;
  if (follow && frames === 1){ setHour(nowH()); $('hour').value = nowH(); }
  controls.update(); renderer.render(scene, cam); badges(); sunAt(); if (!document.hidden) requestAnimationFrame(frame); }
life(0); if (!APP) $("draws").textContent = `${draws} draws`;
document.body.classList.add('ready');
requestAnimationFrame(frame);

</script>
