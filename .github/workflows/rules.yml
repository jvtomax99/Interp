# The database rules (firestore.rules, storage.rules) against Firebase's own
# emulators: every write the app really makes passes, every listed attack is
# refused (tests/rules/rules.test.mjs, docs/features/deleted-items.md). Only
# when the rules or their test change: the emulators need Java and a download.
# The rules on GitHub change nothing by themselves; the live ones are what
# was last pasted into the Firebase console.
name: Rules check

on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'storage.rules', 'tests/rules/**', '.github/workflows/rules.yml']
  pull_request:
    paths: ['firestore.rules', 'storage.rules', 'tests/rules/**', '.github/workflows/rules.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the emulator tools
        working-directory: tests/rules
        run: npm ci --no-audit --no-fund
      - name: Run the rules against the emulators
        working-directory: tests/rules
        run: npm test
