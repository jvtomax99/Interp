name: ChatGPT standalone icon refresh
on:
  push:
    paths:
      - '.github/workflows/chatgpt-standalone-icons.yml'

permissions:
  contents: write

jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace bubble icons with standalone artwork
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          start = text.index('const DOMAIN_ICONS = {')
          end = text.index('\n};', start) + 3
          block = text[start:end]

          # Undo the previous framed/bubble treatment while preserving every
          # icon key that is not explicitly redrawn below.
          generic = re.compile(
              r'(<svg viewBox="0 0 32 32" xmlns="http://www\.w3\.org/2000/svg">)'
              r'<defs>.*?</defs><rect[^>]*/><path[^>]*/><g transform="translate\(2\.4 2\.4\) scale\(\.85\)">(.*?)</g></svg>',
              re.S
          )
          block, unwrapped = generic.subn(r'\1\2</svg>', block)

          GOLD = '#A96F22'
          DARK = '#2E3440'
          new_icons = {
          'doctor': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="9.7" r="5.3" fill="#F3BE94" stroke="{GOLD}" stroke-width="1.1"/><path d="M10.8 8.5c.5-3.4 2.6-5.2 5.3-5.2s4.8 1.8 5.2 5.1c-1.5-.7-2.8-1.1-4.3-1.2-1.8 1.1-3.8 1.5-6.2 1.3Z" fill="#5A3C32" stroke="{GOLD}" stroke-width=".9"/><circle cx="14" cy="9.7" r=".6" fill="{DARK}"/><circle cx="18" cy="9.7" r=".6" fill="{DARK}"/><path d="M13.3 11.8q2.7 2.5 5.4 0" fill="none" stroke="#8B4B45" stroke-width=".9" stroke-linecap="round"/><path d="M10.8 17.2 7.6 18.6a3.2 3.2 0 0 0-1.9 2.9v6.2h20.6v-6.2a3.2 3.2 0 0 0-1.9-2.9l-3.2-1.4-3.1 3H13.9Z" fill="#FFF" stroke="{GOLD}" stroke-width="1.1" stroke-linejoin="round"/><path d="M13.9 17.3 16 20.2l2.1-2.9" fill="#CDEEFF" stroke="{GOLD}" stroke-width=".8"/><path d="M11.3 18.2v3.3a2.7 2.7 0 0 0 5.4 0v-1" fill="none" stroke="#245A92" stroke-width="1.1"/><circle cx="16.7" cy="21.4" r="1.35" fill="#EAF5FF" stroke="#245A92" stroke-width="1"/></svg>''',
          'nurse': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="10.5" r="5.2" fill="#D99A6C" stroke="{GOLD}" stroke-width="1.1"/><path d="M11.2 8.2h9.6l-.8-3.2h-8Z" fill="#FFF" stroke="{GOLD}" stroke-width="1"/><path d="M14.8 5.5h2.4v1.2h1.2v2.4h-1.2v1.2h-2.4V9.1h-1.2V6.7h1.2Z" fill="#E52E42"/><circle cx="14" cy="10.4" r=".6" fill="{DARK}"/><circle cx="18" cy="10.4" r=".6" fill="{DARK}"/><path d="M13.2 12.4q2.8 2.5 5.6 0" fill="none" stroke="#8B4B45" stroke-width=".9" stroke-linecap="round"/><path d="M10.7 17.4 6.9 19a3 3 0 0 0-1.8 2.8v5.8h21.8v-5.8a3 3 0 0 0-1.8-2.8l-3.8-1.6L16 21.6Z" fill="#2F74D0" stroke="{GOLD}" stroke-width="1.1"/><rect x="20.8" y="21" width="3.2" height="4" rx=".5" fill="#FFF" stroke="{GOLD}" stroke-width=".8"/></svg>''',
          'hospital': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M5 27V12.5h5V8h12v4.5h5V27Z" fill="#F8FBFF" stroke="{GOLD}" stroke-width="1.2" stroke-linejoin="round"/><rect x="12" y="4" width="8" height="8" rx="1" fill="#FFF" stroke="{GOLD}" stroke-width="1"/><path d="M14.7 6h2.6v1.7H19v2.6h-1.7V12h-2.6v-1.7H13V7.7h1.7Z" fill="#E52E42"/><g fill="#39A8E0" stroke="{GOLD}" stroke-width=".55"><rect x="7.2" y="15" width="3" height="3" rx=".4"/><rect x="21.8" y="15" width="3" height="3" rx=".4"/><rect x="7.2" y="20" width="3" height="3" rx=".4"/><rect x="21.8" y="20" width="3" height="3" rx=".4"/></g><rect x="13" y="19" width="6" height="8" rx=".8" fill="#59C3F0" stroke="{GOLD}" stroke-width=".9"/></svg>''',
          'clipboard': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="5.5" width="20" height="23" rx="2.4" fill="#FFF8EA" stroke="{GOLD}" stroke-width="1.2"/><rect x="11" y="3" width="10" height="5" rx="1.5" fill="#AFC4DA" stroke="{GOLD}" stroke-width="1"/><path d="M10 13h3v3h-3Z M10 19h3v3h-3Z" fill="#42A765" stroke="{GOLD}" stroke-width=".6"/><path d="m10.4 14.4 1 1 2-2M10.4 20.4l1 1 2-2" fill="none" stroke="#FFF" stroke-width=".8" stroke-linecap="round"/><path d="M15.5 14.5H22M15.5 20.5H22" stroke="#8D877E" stroke-width="1.2" stroke-linecap="round"/></svg>''',
          'bag': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="10" width="24" height="17" rx="3" fill="#D79B55" stroke="{GOLD}" stroke-width="1.2"/><path d="M11 10V7.5A2.5 2.5 0 0 1 13.5 5h5A2.5 2.5 0 0 1 21 7.5V10" fill="none" stroke="{GOLD}" stroke-width="1.2"/><rect x="13" y="15" width="6" height="7" rx="1" fill="#FFF" stroke="{GOLD}" stroke-width=".9"/><path d="M15 16.5h2v1.5h1.5v2H17v1.5h-2V20h-1.5v-2H15Z" fill="#E52E42"/></svg>''',
          'chat': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M4 6h17a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-8l-5 4v-4H7a3 3 0 0 1-3-3Z" fill="#4C8DF6" stroke="{GOLD}" stroke-width="1.2"/><path d="M14 15h11a3 3 0 0 1 3 3v4a3 3 0 0 1-3 3h-3l-4 3v-3h-4a3 3 0 0 1-3-3v-4" fill="#E9F1FA" stroke="{GOLD}" stroke-width="1.1"/><circle cx="10" cy="13" r="1" fill="#FFF"/><circle cx="14" cy="13" r="1" fill="#FFF"/><circle cx="18" cy="13" r="1" fill="#FFF"/></svg>''',
          'phone': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="3" width="16" height="26" rx="3.5" fill="#26364B" stroke="{GOLD}" stroke-width="1.2"/><rect x="10" y="6" width="12" height="18" rx="1.5" fill="#BDE9FF"/><circle cx="16" cy="13" r="3.2" fill="#C78C68" stroke="{GOLD}" stroke-width=".7"/><path d="M11.5 21c.7-3.2 2.2-4.8 4.5-4.8s3.8 1.6 4.5 4.8" fill="#7A5BCD" stroke="{GOLD}" stroke-width=".7"/><path d="M11.2 12.7c.4-3.4 1.8-5 4.8-5s4.4 1.6 4.8 5" fill="none" stroke="#36495F" stroke-width="1.3"/><path d="M11.3 12.6v3M20.7 12.6v3" stroke="#36495F" stroke-width="1.5" stroke-linecap="round"/><circle cx="16" cy="26.5" r="1" fill="#7E8FA5"/></svg>''',
          'pill': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(-42 16 16)"><rect x="5" y="11" width="22" height="10" rx="5" fill="#FFF7EA" stroke="{GOLD}" stroke-width="1.2"/><path d="M16 11h6a5 5 0 0 1 0 10h-6Z" fill="#F1464B"/><path d="M16 11v10" stroke="{GOLD}" stroke-width="1"/></g><circle cx="24.3" cy="24" r="4" fill="#FFF" stroke="{GOLD}" stroke-width="1.1"/><path d="M21.8 21.5 26.8 26.5" stroke="#B8B0A5" stroke-width="1"/></svg>''',
          'iv': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M10 4h12v14a6 6 0 0 1-12 0Z" fill="#EAF9FF" stroke="{GOLD}" stroke-width="1.2"/><path d="M10.8 12h10.4v6a5.2 5.2 0 0 1-10.4 0Z" fill="#55BCEB"/><path d="M13 8h6M13 11h4" stroke="#347BA6" stroke-width="1" stroke-linecap="round"/><path d="M16 24v4h4v-3" fill="none" stroke="#347BA6" stroke-width="1.2" stroke-linecap="round"/><rect x="19" y="21" width="3" height="5" rx="1" fill="#FFF" stroke="{GOLD}" stroke-width=".8"/></svg>''',
          'shield': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 3 27 7v8c0 7-4.5 11-11 14-6.5-3-11-7-11-14V7Z" fill="#2D74D0" stroke="{GOLD}" stroke-width="1.2"/><path d="M16 7.8v15.4" stroke="#7FC6FF" stroke-width="1" opacity=".7"/><rect x="11" y="13" width="10" height="8" rx="1.8" fill="#FFF"/><path d="M13 13v-2a3 3 0 0 1 6 0v2" fill="none" stroke="#FFF" stroke-width="1.6"/><circle cx="16" cy="17" r="1" fill="#245A92"/><path d="M16 18v1.5" stroke="#245A92" stroke-width="1"/></svg>''',
          'apple': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 9c-3.5-3-9-1.7-10 4.5-1.3 7.7 4.1 14 8 14 1 0 1.4-.5 2-.5s1 .5 2 .5c3.9 0 9.3-6.3 8-14C25 7.3 19.5 6 16 9Z" fill="#EF4246" stroke="{GOLD}" stroke-width="1.2"/><path d="M16 9V5" stroke="#73451F" stroke-width="1.4" stroke-linecap="round"/><path d="M16.5 5c2-1.8 4-2 6-1.7-.6 2.3-2 3.8-5 4" fill="#5CB34A" stroke="{GOLD}" stroke-width=".8"/></svg>''',
          'heart': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 29C9 25.5 5 20.4 5.4 14.1c.3-4.8 3.3-8.4 7-8.1 2 .2 3.2 1.6 3.6 3.6.5-2 1.8-3.4 3.9-3.6 3.9-.3 6.8 3.5 6.7 8.2-.2 6.4-4.2 11.4-10.6 14.8Z" fill="#D81E2F" stroke="{GOLD}" stroke-width="1.2"/><path d="M16 10c-1 5-1.5 9.5-1.3 15M10 14c2.7 1 4.3 2.4 5 4.3M22 13c-2.5 1.1-4.2 2.8-5 5" fill="none" stroke="#F4C845" stroke-width=".8" stroke-linecap="round"/></svg>''',
          'brain': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M15.7 27.2H11a4.5 4.5 0 0 1-3.7-7 4.8 4.8 0 0 1 .9-8.5 5 5 0 0 1 7.5-4.5 5 5 0 0 1 7.7 4.3 4.9 4.9 0 0 1 1.3 8.5 4.6 4.6 0 0 1-3.8 7.2h-5.2Z" fill="#F4A4C4" stroke="{GOLD}" stroke-width="1.2"/><path d="M16 8v18M11 10c2 1 2.8 2.5 2.4 4.2M21 10c-2 1-2.8 2.5-2.4 4.2M9 18c2.4-.8 4-.2 5 1.6M23 18c-2.4-.8-4-.2-5 1.6" fill="none" stroke="#A45773" stroke-width=".9" stroke-linecap="round"/></svg>''',
          'lung': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M15 7v7c-3.5-5-6.6-3.3-8.4.2C5 17.3 4.9 24 8.8 27c2.5 1.8 5.2-.3 6.2-3.2Z" fill="#F58DA0" stroke="{GOLD}" stroke-width="1.2"/><path d="M17 7v7c3.5-5 6.6-3.3 8.4.2C27 17.3 27.1 24 23.2 27c-2.5 1.8-5.2-.3-6.2-3.2Z" fill="#F58DA0" stroke="{GOLD}" stroke-width="1.2"/><path d="M16 3v12M16 10l-5 5M16 10l5 5" fill="none" stroke="#2367A8" stroke-width="1.5" stroke-linecap="round"/></svg>''',
          'lungs': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M15 7v7c-3.5-5-6.6-3.3-8.4.2C5 17.3 4.9 24 8.8 27c2.5 1.8 5.2-.3 6.2-3.2Z" fill="#F58DA0" stroke="{GOLD}" stroke-width="1.2"/><path d="M17 7v7c3.5-5 6.6-3.3 8.4.2C27 17.3 27.1 24 23.2 27c-2.5 1.8-5.2-.3-6.2-3.2Z" fill="#F58DA0" stroke="{GOLD}" stroke-width="1.2"/><path d="M16 3v12M16 10l-5 5M16 10l5 5" fill="none" stroke="#2367A8" stroke-width="1.5" stroke-linecap="round"/></svg>''',
          'kidney': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M12.5 5C7.6 5 5 9 5 14.5S7.8 24 12.2 24c2.3 0 3.8-1.6 3.8-4.1V9.4C16 6.8 14.8 5 12.5 5Z" fill="#A84D43" stroke="{GOLD}" stroke-width="1.2"/><path d="M19.5 5C24.4 5 27 9 27 14.5S24.2 24 19.8 24c-2.3 0-3.8-1.6-3.8-4.1V9.4C16 6.8 17.2 5 19.5 5Z" fill="#A84D43" stroke="{GOLD}" stroke-width="1.2"/><path d="M13 17c-1.3 4-1 7 0 11M19 17c1.3 4 1 7 0 11" fill="none" stroke="#F1D8B6" stroke-width="1.2" stroke-linecap="round"/><path d="M13.5 14h-4M18.5 14h4" stroke="#2A77B9" stroke-width="1.2"/></svg>''',
          'uterus': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M10 10c1.8 1.2 3.8 2 6 2s4.2-.8 6-2v6c0 4-2.5 6-6 6s-6-2-6-6Z" fill="#F47C91" stroke="{GOLD}" stroke-width="1.1"/><path d="M10 11 6 8 3.5 9.5M22 11l4-3 2.5 1.5" fill="none" stroke="#F47C91" stroke-width="2.2" stroke-linecap="round"/><circle cx="3.5" cy="9.5" r="2" fill="#F7A0B0" stroke="{GOLD}" stroke-width=".8"/><circle cx="28.5" cy="9.5" r="2" fill="#F7A0B0" stroke="{GOLD}" stroke-width=".8"/><path d="M16 22v6" stroke="{GOLD}" stroke-width="1.2"/></svg>''',
          'ribbon': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 4c-4 0-6.5 2.4-6.5 6 0 4.5 4.3 7.5 6.5 9.5 2.2-2 6.5-5 6.5-9.5 0-3.6-2.5-6-6.5-6Z" fill="#7B3FB8" stroke="{GOLD}" stroke-width="1.2"/><path d="M13 15 7.5 28l8.5-6 8.5 6L19 15" fill="#7B3FB8" stroke="{GOLD}" stroke-width="1.2" stroke-linejoin="round"/></svg>''',
          'scissors': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><circle cx="8" cy="23" r="4" fill="#F2F5F8" stroke="{GOLD}" stroke-width="1.2"/><circle cx="24" cy="23" r="4" fill="#F2F5F8" stroke="{GOLD}" stroke-width="1.2"/><path d="M10.7 20 25 5M21.3 20 7 5" stroke="#336FB2" stroke-width="2.2" stroke-linecap="round"/><path d="M25 5l2-2M7 5 5 3" stroke="#D9E1EA" stroke-width="1.4" stroke-linecap="round"/></svg>''',
          'xray': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="3" width="22" height="26" rx="2" fill="#263C52" stroke="{GOLD}" stroke-width="1.2"/><path d="M16 6v19M10 8c2 3 3.5 6 3.5 9s-1 5.5-2.5 8M22 8c-2 3-3.5 6-3.5 9s1 5.5 2.5 8" fill="none" stroke="#CFE9F7" stroke-width="1.1"/><path d="M9 11c2.6 1.1 4.2 1.4 7 1.4s4.4-.3 7-1.4M8.8 15c2.8 1 4.6 1.3 7.2 1.3s4.4-.3 7.2-1.3M9.5 19c2.5.8 4 .9 6.5.9s4-.1 6.5-.9" fill="none" stroke="#AFCEDD" stroke-width=".8"/></svg>''',
          'skin': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M4 12h24v15H4Z" fill="#F4B28F" stroke="{GOLD}" stroke-width="1.1"/><path d="M4 15h24M4 19h24M4 23h24" stroke="#E58D78" stroke-width="1"/><path d="M18 4c-3 4-3 8-3 13" fill="none" stroke="#75402A" stroke-width="2" stroke-linecap="round"/><path d="M17.7 4c2 1.5 3.5 2.2 5.5 2.4" stroke="#75402A" stroke-width="1.3" stroke-linecap="round"/><path d="M22 5l1-2M25 7l2-1" stroke="#F0B12F" stroke-width="1.4" stroke-linecap="round"/></svg>''',
          }

          def replace_key(src, key, svg):
              pat = re.compile(rf"(?m)^  {re.escape(key)}: '.*?',\s*$")
              repl = f"  {key}: '{svg}',"
              return pat.subn(lambda m: repl, src, count=1)

          changed = []
          for key, svg in new_icons.items():
              block, n = replace_key(block, key, svg)
              if n:
                  changed.append(key)

          # Doctor was the one icon that had a custom framed wrapper in the
          # previous pass, so the direct replacement above removes it entirely.
          text = text[:start] + block + text[end:]

          # Remove card-like plates around every icon. These overrides affect
          # icon containers only; layout, typography, card sizing and behavior
          # are intentionally untouched.
          override = '''\n/* Standalone illustrated icons: intentionally no bubble, chip or plate. */\n.home-tile-icon,.qa-icon,.qa-tile-icon{background:transparent !important;border:0 !important;box-shadow:none !important;border-radius:0 !important;overflow:visible !important;}\n.home-tile-icon svg,.qa-icon svg,.qa-tile-icon svg{overflow:visible;filter:drop-shadow(0 1.5px 1.5px rgba(60,43,31,.13));}\n'''
          if '/* Standalone illustrated icons: intentionally no bubble, chip or plate. */' not in text:
              pos = text.rfind('</style>')
              if pos == -1:
                  raise SystemExit('Could not find </style>')
              text = text[:pos] + override + text[pos:]

          # HMH must remain the real mark asset, never a generated approximation.
          # If an HMH image already exists, normalize it to the mark-only asset.
          text = text.replace('src="./hmh-logo.png"', 'src="./hmh-mark.png"')
          text = text.replace('src="hmh-logo.png"', 'src="hmh-mark.png"')
          text = text.replace('src="./hmh-logo-white.png"', 'src="./hmh-mark.png"')
          text = text.replace('src="hmh-logo-white.png"', 'src="hmh-mark.png"')

          p.write_text(text, encoding='utf-8')
          print('Unwrapped previous bubble icons:', unwrapped)
          print('Redrawn standalone icons:', ', '.join(changed))
          if 'pinShadow' in block or 'pinFace' in block or 'docFace' in block:
              raise SystemExit('Old bubble artwork is still present in DOMAIN_ICONS')
          if 'doctor' not in changed:
              raise SystemExit('Doctor icon was not replaced')
          PY

      - name: Validate icon-only scope
        shell: bash
        run: |
          git diff --check
          git diff -- index.html | head -n 300
          test "$(git diff --name-only | grep -v '^.github/workflows/chatgpt-standalone-icons.yml$' | grep -v '^index.html$' | wc -l)" -eq 0

      - name: Commit corrected standalone icons
        shell: bash
        run: |
          git config user.name "jvtomax99"
          git config user.email "jvtomax99@gmail.com"
          git add index.html
          git rm .github/workflows/chatgpt-standalone-icons.yml
          git commit -m "Use standalone illustrated icons without bubbles"
          git push
