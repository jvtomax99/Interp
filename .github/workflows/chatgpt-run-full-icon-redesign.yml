name: Run corrected full icon redesign
on:
  push:
    paths:
      - '.github/workflows/chatgpt-run-full-icon-redesign.yml'
permissions:
  contents: write
jobs:
  run-redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute corrected icon redesign script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          wf=Path('.github/workflows/chatgpt-full-icon-redesign.yml').read_text()
          lines=wf.splitlines()
          start=next(i for i,l in enumerate(lines) if "python3 <<'PY'" in l)+1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          script=textwrap.dedent('\n'.join(lines[start:end]))
          script=script.replace("pat=re.compile(rf\"(?m)^  {re.escape(key)}: '.*?',\\s*$\")", "pat=re.compile(rf\"(?m)^  {re.escape(key)}: '.*?',?\\s*$\")")
          if "',?\\s*$" not in script:
              raise SystemExit('Could not correct icon matcher')
          Path('/tmp/redesign.py').write_text(script)
          subprocess.run(['python3','/tmp/redesign.py'],check=True)
          PY
          git diff --check
      - name: Commit website icon changes only
        shell: bash
        run: |
          git config user.name "jvtomax99"
          git config user.email "jvtomax99@gmail.com"
          git add index.html
          git commit -m "Redesign all icons as standalone illustrations"
          git push
