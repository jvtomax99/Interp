# TEMPORARY (removed before the pull request): runs the tab bar test many
# times in WebKit, the old copy against the fixed one, to reproduce the flake.
name: dock-tuck repeat
on:
  push:
    branches: [claude/steady-dock-tuck]
jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        which: [dock-tuck-old, dock-tuck]
        shard: [a, b]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --user 1001 --ipc=host
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-audit --no-fund
      - name: 12 runs
        run: |
          pass=0; fail=0
          for i in $(seq 1 12); do
            if BROWSER=webkit node suites/${{ matrix.which }}.cjs > out-$i.txt 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); echo "--- run $i failed"; grep -E "FAIL|info:|Error|closed" out-$i.txt | cut -c1-600; fi
            grep -h "info: still moving\|info: the page" out-$i.txt || true
          done
          echo "RESULT ${{ matrix.which }}: $pass passed, $fail failed"
