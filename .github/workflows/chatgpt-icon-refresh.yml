name: ChatGPT icon refresh
on:
  push:
    paths:
      - '.github/workflows/chatgpt-icon-refresh.yml'
permissions:
  contents: write
jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh icon artwork only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          start=s.index('const DOMAIN_ICONS = {')
          end=s.index('\n};', start)
          block=s[start:end]

          # Give every existing domain/tool illustration a kawaii enamel-pin body
          # while preserving the original symbol and its meaning.
          pin = '''<defs><filter id="pinShadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.15" flood-color="#5d3b20" flood-opacity=".24"/></filter><linearGradient id="pinFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf8"/><stop offset="1" stop-color="#f8edf5"/></linearGradient></defs><rect x="2.3" y="2.3" width="27.4" height="27.4" rx="8.2" fill="url(#pinFace)" stroke="#C9923E" stroke-width="1.7" filter="url(#pinShadow)"/><path d="M7.2 6.4c3.9-2.2 8.8-2.7 13.2-1.1" fill="none" stroke="#fff" stroke-opacity=".82" stroke-width="1.15" stroke-linecap="round"/>'''
          def add_pin(m):
              opening=m.group(1)
              body=m.group(2)
              # Scale the original artwork slightly so it sits inside the metal edge.
              return opening + pin + '<g transform="translate(2.4 2.4) scale(.85)">' + body + '</g></svg>'
          block=re.sub(r'(<svg viewBox="0 0 32 32" xmlns="http://www\.w3\.org/2000/svg">)(.*?</svg>)', lambda m:add_pin(type('M',(),{'group':lambda self,n: m.group(1) if n==1 else m.group(2)[:-6]})()), block)

          # Purpose-built smiling doctor pin. The smile is intentionally obvious at phone size.
          doctor='''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><defs><filter id="docShadow" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dx="0" dy="1.2" stdDeviation="1.1" flood-color="#5d3b20" flood-opacity=".25"/></filter><linearGradient id="docFace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF8FF"/><stop offset="1" stop-color="#FDEBF5"/></linearGradient></defs><rect x="2.2" y="2.2" width="27.6" height="27.6" rx="8.4" fill="url(#docFace)" stroke="#C9923E" stroke-width="1.8" filter="url(#docShadow)"/><path d="M7 6.3c4-2.2 9-2.6 13.5-1" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round" opacity=".9"/><circle cx="16" cy="11.2" r="5.1" fill="#F4C7A5" stroke="#A96F22" stroke-width="1"/><path d="M11.2 9.1c.7-3.2 2.6-4.6 4.9-4.6 2.4 0 4.2 1.4 4.8 4.4-1.4-.8-2.6-1.4-4-1.6-1.7 1.3-3.6 1.8-5.7 1.8Z" fill="#6B4536" stroke="#A96F22" stroke-width=".8" stroke-linejoin="round"/><circle cx="14.1" cy="10.9" r=".65" fill="#40302C"/><circle cx="17.9" cy="10.9" r=".65" fill="#40302C"/><path d="M13.4 13q2.6 2.7 5.2 0" fill="#fff" stroke="#8D5146" stroke-width=".8" stroke-linecap="round"/><path d="M10.3 18.1 7.5 19.4a3 3 0 0 0-1.8 2.7v4.4h20.6v-4.4a3 3 0 0 0-1.8-2.7l-2.8-1.3-3.2 2.9H13.5Z" fill="#fff" stroke="#A96F22" stroke-width="1" stroke-linejoin="round"/><path d="M13.5 18.2 16 21l2.5-2.8" fill="#CFEFFF" stroke="#A96F22" stroke-width=".8"/><path d="M11.4 18.7v2.8a3.2 3.2 0 0 0 6.4 0v-.5" fill="none" stroke="#36A6B8" stroke-width="1.1" stroke-linecap="round"/><circle cx="17.8" cy="21.4" r="1.45" fill="#E8FAFF" stroke="#36A6B8" stroke-width="1"/><path d="M22.2 8.1v3.2M20.6 9.7h3.2" stroke="#F0A9C3" stroke-width="1" stroke-linecap="round"/></svg>'''
          # Replace doctor entry after generic conversion.
          block=re.sub(r"  doctor: '<svg.*?</svg>',", "  doctor: '"+doctor+"',", block, count=1)

          s=s[:start]+block+s[end:]

          # Use the repository's real HMH mark wherever an HMH-mark image is rendered.
          # This never adds the wordmark.
          s=s.replace('src="./hmh-logo.png"', 'src="./hmh-mark.png"')
          s=s.replace("src='./hmh-logo.png'", "src='./hmh-mark.png'")

          # Enamel finish for icon containers only. No card/layout/text changes.
          css='''\n/* ChatGPT icon-only enamel pin refresh */\n.home-tile-icon svg,.qa-icon svg,.qa-tile-icon svg,.icon-pick svg{overflow:visible}\n.home-tile-icon svg,.qa-icon svg,.qa-tile-icon svg{filter:drop-shadow(0 1px 1px rgba(80,52,25,.10))}\n'''
          s=s.replace('</style>', css+'</style>', 1)
          p.write_text(s)
          PY
      - name: Commit icon-only update and remove one-shot workflow
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-icon-refresh.yml
          git add index.html
          git commit -m "Replace website icons with enamel pin artwork"
          git push
