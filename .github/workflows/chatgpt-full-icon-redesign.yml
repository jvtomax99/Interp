name: ChatGPT full standalone icon redesign
on:
  push:
    paths:
      - '.github/workflows/chatgpt-full-icon-redesign.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace every domain icon with standalone illustrated artwork
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          G='#A96F22'
          D='#263442'

          icons={
          'bag': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="10" width="24" height="17" rx="3" fill="#D69A54" stroke="{G}" stroke-width="1.2"/><path d="M11 10V7.6A2.6 2.6 0 0 1 13.6 5h4.8A2.6 2.6 0 0 1 21 7.6V10" fill="none" stroke="{G}" stroke-width="1.3"/><rect x="12.5" y="14.5" width="7" height="8" rx="1.2" fill="#FFFDF8" stroke="{G}" stroke-width=".9"/><path d="M15 16h2v1.7h1.7v2H17v1.7h-2v-1.7h-1.7v-2H15Z" fill="#E83A46"/></svg>''',
