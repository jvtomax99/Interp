          'sparkle': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="m16 2 2.4 8.6L27 13l-8.6 2.4L16 24l-2.4-8.6L5 13l8.6-2.4Z" fill="#FFD34D" stroke="{G}" stroke-width="1.1"/><path d="m25 20 1.2 3.8L30 25l-3.8 1.2L25 30l-1.2-3.8L20 25l3.8-1.2Z" fill="#F7A62E" stroke="{G}" stroke-width=".8"/><path d="m7 3 .8 2.7 2.7.8-2.7.8L7 10l-.8-2.7-2.7-.8 2.7-.8Z" fill="#FFF0A7" stroke="{G}" stroke-width=".7"/></svg>''',
          'globe': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="13" fill="#59BCEB" stroke="{G}" stroke-width="1.2"/><path d="M5 12c3 1 5 0 7-2 2-2 4-1 5 1s3 2 5 1 3 0 5 1M8 21c2-2 4-2 6 0s3 4 2 7M20 5c-1 3 0 5 2 6" fill="none" stroke="#4CA95F" stroke-width="2.5" stroke-linecap="round"/><path d="M3 16h26M16 3c4 4 6 8 6 13s-2 9-6 13c-4-4-6-8-6-13s2-9 6-13Z" fill="none" stroke="#E9F8FF" stroke-width=".7" opacity=".8"/></svg>''',
          'compass': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="13" fill="#EAF5FF" stroke="{G}" stroke-width="1.2"/><circle cx="16" cy="16" r="10" fill="#CDEBFA" stroke="#5E8FB3" stroke-width=".8"/><path d="m20.5 10.5-3 7-7 3 3-7Z" fill="#E34A55" stroke="{G}" stroke-width="1"/><path d="m11.5 21.5 3-7 7-3-3 7Z" fill="#456FA7" opacity=".7"/><circle cx="16" cy="16" r="1.3" fill="#FFF" stroke="{G}" stroke-width=".7"/></svg>''',
          'exam': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="4" width="20" height="25" rx="2.5" fill="#FFF7E8" stroke="{G}" stroke-width="1.2"/><rect x="11" y="2" width="10" height="5" rx="1.5" fill="#B9C9D8" stroke="{G}" stroke-width=".9"/><path d="m9 13 2 2 4-4M9 21l2 2 4-4" fill="none" stroke="#48A76A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 13h6M17 21h6" stroke="#8B857D" stroke-width="1.1" stroke-linecap="round"/></svg>''',
          'person': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="10" r="6" fill="#E2A275" stroke="{G}" stroke-width="1.1"/><path d="M10.4 8.5c.8-3.5 2.8-5 5.6-5s4.8 1.5 5.6 5c-2-1.2-3.7-1.6-5.6-1.6s-3.6.4-5.6 1.6Z" fill="#43342F"/><circle cx="14" cy="10" r=".6" fill="{D}"/><circle cx="18" cy="10" r=".6" fill="{D}"/><path d="M13.4 12q2.6 2.5 5.2 0" fill="none" stroke="#8B4B45" stroke-width=".8" stroke-linecap="round"/><path d="M5 28c.8-7 4.6-10.5 11-10.5S26.2 21 27 28Z" fill="#4D87D8" stroke="{G}" stroke-width="1.1"/></svg>''',
          'review': f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="8" width="18" height="16" rx="2" fill="#EAF5FF" stroke="{G}" stroke-width="1.1" transform="rotate(-7 14 16)"/><rect x="9" y="6" width="18" height="16" rx="2" fill="#FFF8EA" stroke="{G}" stroke-width="1.1" transform="rotate(5 18 14)"/><text x="12" y="16" font-family="Arial,sans-serif" font-size="7" font-weight="700" fill="#2D6FAF">A</text><text x="19" y="20" font-family="Arial,sans-serif" font-size="7" font-weight="700" fill="#E14E59">Á</text><path d="M13 24q3 3 6 0" fill="none" stroke="#48A76A" stroke-width="1.2" stroke-linecap="round"/></svg>''',
          }

          # Replace all 36 known domain icon entries in place. No wrappers,
          # plates, circles or icon-background containers are added.
          start=text.index('const DOMAIN_ICONS = {')
          end=text.index('\n};',start)+3
          block=text[start:end]
          keys=re.findall(r"(?m)^  ([A-Za-z0-9_-]+): '",block)
          missing=[k for k in keys if k not in icons]
          extra=[k for k in icons if k not in keys]
          if missing or extra:
              raise SystemExit(f'Icon map mismatch. missing designs={missing} extra designs={extra}')
          for key in keys:
              pat=re.compile(rf"(?m)^  {re.escape(key)}: '.*?',\s*$")
              block,n=pat.subn(lambda m,k=key: f"  {k}: '{icons[k]}',",block,count=1)
              if n!=1: raise SystemExit(f'Could not replace {key}')
          text=text[:start]+block+text[end:]

          # Standalone waving hand replaces the emoji in the home greeting.
          wave=f'''<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M10 27c-3-3.2-4.2-7-3.2-10.5l1.4-5c.4-1.4 2.3-1.2 2.4.3l.1 3.1 2-9.7c.3-1.5 2.4-1.3 2.4.2v7.2L17.7 4c.4-1.4 2.4-1 2.2.5l-1.3 8.6 3.4-7.3c.6-1.3 2.5-.6 2 .8l-2.5 7.6 3.5-4.7c.9-1.2 2.6-.1 1.9 1.2l-3.7 7c-1.4 2.8-2.3 5.4-2 8.3-3.7 2.8-7.6 3-11.2 1Z" fill="#F4B071" stroke="{G}" stroke-width="1.1" stroke-linejoin="round"/><path d="M9.1 18c3.5-.6 6.3.6 8.2 3.2" fill="none" stroke="#C77C52" stroke-width="1" stroke-linecap="round"/><path d="M4 11c-2 2.3-2.5 5.1-1.5 7.5M3.8 7C.4 10.6-.4 15 .9 19" fill="none" stroke="#F4B42F" stroke-width="1.8" stroke-linecap="round"/></svg>'''
          marker='const ICON_EXTERNAL = '
          if 'const ICON_WAVE = ' not in text:
              pos=text.index(marker)
              text=text[:pos]+f"const ICON_WAVE = '{wave}';\n"+text[pos:]
          old="${firstName ? escapeHtml(firstName) + ' \\u{1F44B}' : 'Welcome \\u{1F44B}'}"
          new="${firstName ? escapeHtml(firstName) : 'Welcome'} <span class=\"home-wave-icon\">${ICON_WAVE}</span>"
          if old not in text:
              raise SystemExit('Greeting wave target not found')
          text=text.replace(old,new,1)

          css='''\n/* Illustrated icons are the artwork itself: no chip, bubble, plate or frame. */\n.home-tile-icon,.qa-icon,.qa-tile-icon{background:transparent !important;border:0 !important;box-shadow:none !important;border-radius:0 !important;overflow:visible !important;}\n.home-tile-icon svg,.qa-icon svg,.qa-tile-icon svg,.icon-pick svg{overflow:visible;filter:drop-shadow(0 1.2px 1.2px rgba(70,45,25,.13));}\n.home-wave-icon{display:inline-flex;width:.92em;height:.92em;vertical-align:-.09em;margin-left:.1em;}\n.home-wave-icon svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18));}\n'''
          # Replace older ChatGPT icon overrides instead of stacking more rules.
          text=re.sub(r'\n/\* ChatGPT icon-only enamel pin refresh \*/.*?(?=\n</style>)','',text,flags=re.S)
          pos=text.rfind('</style>')
          text=text[:pos]+css+text[pos:]

          # HMH uses only the real mark asset, never generated artwork or wordmark image.
          text=text.replace('src="./hmh-logo.png"','src="./hmh-mark.png"')
          text=text.replace('src="hmh-logo.png"','src="./hmh-mark.png"')
          text=text.replace('src="./hmh-logo-white.png"','src="./hmh-mark.png"')
          text=text.replace('src="hmh-logo-white.png"','src="./hmh-mark.png"')

          p.write_text(text,encoding='utf-8')

          # Safety checks: all 36 keys remain, every one was redrawn, and the
          # previous bubble treatment is gone.
          out=p.read_text(encoding='utf-8')
          a=out.index('const DOMAIN_ICONS = {'); b=out.index('\n};',a)+3
          outblock=out[a:b]
          outkeys=re.findall(r"(?m)^  ([A-Za-z0-9_-]+): '",outblock)
          if outkeys!=keys: raise SystemExit('DOMAIN_ICONS key order changed')
          if 'var(--ic-fill)' in outblock or 'var(--ic-line)' in outblock:
              raise SystemExit('An old line-art icon remains')
          if any(x in outblock for x in ('pinShadow','pinFace','docFace')):
              raise SystemExit('Old bubble artwork remains')
          if '\\u{1F44B}' in out:
              raise SystemExit('Old greeting emoji remains')
          print('Redesigned standalone icons:',len(outkeys))
          print('Greeting wave replaced with standalone illustrated hand')
          PY
          git diff --check

      - name: Verify only icon presentation changed
        shell: bash
        run: |
          git diff --name-only
          test "$(git diff --name-only | grep -v '^index.html$' | grep -v '^.github/workflows/chatgpt-full-icon-redesign.yml$' | wc -l)" -eq 0

      - name: Commit full icon redesign
        shell: bash
        run: |
          git config user.name "jvtomax99"
          git config user.email "jvtomax99@gmail.com"
          git add index.html
          git rm .github/workflows/chatgpt-full-icon-redesign.yml
          git commit -m "Redesign all icons as standalone illustrations"
          git push
