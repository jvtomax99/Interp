name: Fix full icon redesign runner
on:
  push:
    paths:
      - '.github/workflows/chatgpt-fix-redesign-run.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix final icon matcher and retrigger redesign
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/chatgpt-full-icon-redesign.yml')
          s=p.read_text()
          old='pat=re.compile(rf"(?m)^  {re.escape(key)}: \' .*?\',\\s*$")'
          # Replace the actual matcher directly; the final DOMAIN_ICONS entry has no comma.
          s=s.replace("pat=re.compile(rf\"(?m)^  {re.escape(key)}: '.*?',\\s*$\")", "pat=re.compile(rf\"(?m)^  {re.escape(key)}: '.*?',?\\s*$\")")
          if "' .*?'" in s:
              pass
          if "',?\\s*$" not in s:
              raise SystemExit('matcher replacement failed')
          p.write_text(s)
          PY
          git config user.name "jvtomax99"
          git config user.email "jvtomax99@gmail.com"
          git add .github/workflows/chatgpt-full-icon-redesign.yml
          git rm .github/workflows/chatgpt-fix-redesign-run.yml
          git commit -m "Fix final icon matcher and rerun redesign"
          git push
