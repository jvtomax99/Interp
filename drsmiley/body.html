<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dr. Smiley, full body</title>
<!-- The viewer for Dr. Smiley's full-body rig (drsmiley/body.js). Not linked
     from the app: Jose reviews his acting here before deciding where he
     stands full-length. Open it at /drsmiley/body.html. -->
<style>
  :root { --bg:#F4F6FA; --paper:#FFFFFF; --ink:#151C2C; --ink-soft:#5A6478; --ink-faint:#98A1B3; --accent:#0F5FA6; --accent-soft:#E8F1FA;
          --navy:#252E6D; --line:#E2E7F0; --r-md:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
          --finish: 0 1px 0 0 inset rgba(255,255,255,.82), 0 1px 2px rgba(20,43,67,.06), 0 8px 20px -12px rgba(22,55,90,.22); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#10162A; --paper:#1A2238; --ink:#EEF2F8; --ink-soft:#AEB7C8; --ink-faint:#737E95; --accent-soft:#1D3250; --line:#2A3450;
          --finish: 0 1px 0 0 inset rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6); } }
  :root[data-theme="dark"] { --bg:#10162A; --paper:#1A2238; --ink:#EEF2F8; --ink-soft:#AEB7C8; --ink-faint:#737E95; --accent-soft:#1D3250; --line:#2A3450; }
  * { box-sizing:border-box }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased }
  body { min-height:100dvh; padding:max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)) }
  h1 { font-size:17px; font-weight:650; letter-spacing:-.01em; margin:4px 0 2px }
  .sub { font-size:13px; color:var(--ink-soft); margin:0 0 10px }
  .stage { position:relative; height:56dvh; min-height:360px; border-radius:var(--r-lg); background:var(--paper); box-shadow:var(--finish); overflow:hidden;
           display:flex; align-items:flex-end; justify-content:center; padding-bottom:4%;
           background-image: radial-gradient(60% 50% at 50% 100%, rgba(15,95,166,.10), transparent 70%); }
  .stage.is-navy { background:var(--navy); background-image: radial-gradient(70% 60% at 50% 100%, rgba(1,184,230,.25), transparent 70%) }
  .stage.is-mesh { background-image: radial-gradient(40% 40% at 20% 10%, rgba(1,184,230,.18), transparent 70%), radial-gradient(45% 45% at 85% 20%, rgba(15,95,166,.14), transparent 70%), radial-gradient(60% 50% at 50% 100%, rgba(37,46,109,.12), transparent 70%) }
  .who { position:relative; height:var(--size, 72%); aspect-ratio: 1070 / 1470; transform: translateX(var(--dx, 0px)); transition: transform .4s var(--ease) }
  .who svg.db { width:100%; height:100%; display:block }
  .who .db-breath { transform-box:fill-box; transform-origin:50% 100%; animation: dbBreath 3.6s ease-in-out infinite }
  .is-still .who .db-breath { animation:none }
  /* A drawn pose taking over from the cutout arm: a short cross-fade, not a cut. */
  .who .db-pose, .who .db-arm, .who .db-leg { transition: opacity .12s linear }
  @media (prefers-reduced-motion: reduce) { .who .db-breath { animation:none } .who { transition:none } .who .db-pose, .who .db-arm, .who .db-leg { transition:none } }
  @keyframes dbBreath { 0%, 100% { transform:scale(1,1) } 50% { transform:scale(.996,1.012) } }
  .bar { display:flex; flex-wrap:wrap; gap:9px; margin-top:13px }
  button, .seg { font:inherit }
  .act { min-height:44px; padding:0 17px; border:0; border-radius:999px; background:var(--paper); color:var(--ink); font-size:15px; font-weight:550; box-shadow:var(--finish); cursor:pointer;
         transition: transform .368s var(--ease), background .2s; -webkit-tap-highlight-color:transparent }
  .act:active, .act.is-pressed { transform:scale(.96); background:var(--accent-soft) }
  .act:focus-visible { outline:2px solid var(--accent); outline-offset:2px }
  .act.is-on { background:var(--accent-soft); color:var(--accent) }
  .row { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:13px; font-size:13px; color:var(--ink-soft) }
  .seg { display:inline-flex; background:var(--paper); border-radius:999px; padding:3px; box-shadow:var(--finish) }
  .seg button { min-height:38px; padding:0 13px; border:0; border-radius:999px; background:transparent; color:var(--ink-soft); font-size:13px; font-weight:550; cursor:pointer }
  .seg button.is-on { background:var(--accent-soft); color:var(--accent) }
  .seg button:focus-visible { outline:2px solid var(--accent); outline-offset:1px }
  input[type=range] { accent-color:var(--accent); width:120px }
  .note { font-size:12px; color:var(--ink-faint); margin-top:9px }
</style>
</head>
<body>
<h1>Dr. Smiley, full body</h1>
<p class="sub">His acting from the cutout rig. Tap a performance; he breathes, blinks and shifts his weight on his own.</p>
<div class="stage" id="stage"><div class="who" id="who"></div></div>
<div class="bar" id="acts">
  <button class="act" data-perf="greet">Greet</button>
  <button class="act" data-perf="ack">Nod</button>
  <button class="act" data-perf="think">Think</button>
  <button class="act" data-perf="cheer">Cheer</button>
  <button class="act" data-perf="wink">Wink</button>
  <button class="act" data-perf="shrug">Shrug</button>
  <button class="act" data-perf="bounce">Bounce</button>
  <button class="act" data-perf="wince">Wince</button>
  <button class="act" data-perf="walk">Walk</button>
</div>
<div class="row">
  <span class="seg" id="mode" role="group" aria-label="Mode"><button data-mode="lively" class="is-on">Lively</button><button data-mode="focused">Focused</button><button data-mode="still">Still</button></span>
  <span class="seg" id="bgs" role="group" aria-label="Background"><button data-bg="" class="is-on">Light</button><button data-bg="is-mesh">Mesh</button><button data-bg="is-navy">Navy</button></span>
  <label>Size <input type="range" id="size" min="30" max="100" value="72" aria-label="Size"></label>
</div>
<p class="note" id="note">Lively</p>
<script src="./body.js"></script>
<script>
  const who = document.getElementById('who'), stage = document.getElementById('stage');
  who.innerHTML = drBodyArt('', './');
  const svg = who.querySelector('svg.db');
  const opts = { mode: 'lively' };
  const body = drBody(svg, opts);
  window.body = body;   // for the checks (tests/suites/body-rig.cjs)
  let walkDir = 1, dx = 0;
  const stopIdle = drBodyIdle(body);
  window.stopIdle = stopIdle;
  function act(name){
    if(name === 'walk'){
      const room = (stage.clientWidth - who.clientWidth) / 2 - 8, scale = who.clientWidth / DR_BODY.w;
      // Walk toward the side with more room, as far as 6 steps go.
      walkDir = dx > 0 ? -1 : dx < 0 ? 1 : (Math.random() < .5 ? -1 : 1);
      const p = DR_BODY_PERF.walk(body.mode(), { dir: walkDir, steps: 6 });
      if(body.mode() === 'still') return;
      body.play(p.beats, { name: 'walk', done: () => { dx = Math.max(-room, Math.min(room, dx + p.dx * scale)); who.style.setProperty('--dx', dx + 'px'); } });
      return;
    }
    body.perform(name);
  }
  document.getElementById('acts').addEventListener('click', e => {
    const b = e.target.closest('[data-perf]'); if(!b) return;
    b.classList.add('is-pressed'); setTimeout(() => b.classList.remove('is-pressed'), 260);
    act(b.dataset.perf);
  });
  document.getElementById('mode').addEventListener('click', e => {
    const b = e.target.closest('[data-mode]'); if(!b) return;
    opts.mode = b.dataset.mode;
    for(const x of e.currentTarget.children) x.classList.toggle('is-on', x === b);
    document.body.classList.toggle('is-still', body.mode() === 'still');
    body.stop(); body.rest();
    document.getElementById('note').textContent = { lively: 'Lively', focused: 'Focused: the same acting, smaller and calmer', still: 'Still: one held pose, no motion' }[opts.mode];
  });
  document.getElementById('bgs').addEventListener('click', e => {
    const b = e.target.closest('[data-bg]'); if(!b) return;
    stage.className = 'stage ' + b.dataset.bg;
    for(const x of e.currentTarget.children) x.classList.toggle('is-on', x === b);
  });
  document.getElementById('size').addEventListener('input', e => who.style.setProperty('--size', e.target.value + '%'));
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) document.body.classList.add('is-still');
  // A hello once he's on screen.
  setTimeout(() => { if(body.mode() !== 'still') body.perform('greet'); }, 700);
</script>
</body>
</html>
