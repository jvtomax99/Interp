<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;650;800&display=swap');
*{box-sizing:border-box} body{margin:0;width:390px;font-family:Inter,system-ui,sans-serif;background:#F4F6FA;color:#151C2C}
.top{height:64px;display:flex;align-items:center;padding:0 16px;gap:10px;font-weight:650;font-size:17px}
.world{position:relative;margin:0 14px;height:470px;border-radius:24px;overflow:hidden;
 background:radial-gradient(120% 70% at 50% 108%, #f2a46b 0%, #c96a7c 30%, #4b2a63 62%, #1d1840 100%);
 box-shadow:inset 0 2px 0 rgba(255,255,255,.14),0 3px 5px rgba(20,43,67,.14),0 26px 46px -20px rgba(18,28,70,.62)}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.2px 1.2px at 30px 40px,#fff8,transparent),radial-gradient(1px 1px at 120px 80px,#fff6,transparent),radial-gradient(1.4px 1.4px at 300px 50px,#fff9,transparent),radial-gradient(1px 1px at 250px 120px,#fff5,transparent),radial-gradient(1px 1px at 70px 150px,#fff5,transparent)}
.hud{position:absolute;left:16px;top:14px;color:#fff}
.hud small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;font-weight:650}
.hud b{font-size:30px;font-weight:800;letter-spacing:-.03em;color:#FFC86B}
.hud span{display:block;font-size:12px;opacity:.85;margin-top:2px}
.chips{position:absolute;right:12px;top:16px;display:flex;gap:6px}
.chip{background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:650;padding:6px 10px;border-radius:999px;backdrop-filter:blur(8px)}
.city{position:absolute;left:-1px;top:100px;width:392px}
.lab{position:absolute;transform:translate(-50%,-100%);background:#241b33;color:#fff;font-size:11.5px;font-weight:650;padding:4px 8px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 10px rgba(10,6,30,.35)}
.lab.hot{background:#FFB443;color:#2a1a08;animation:bob 1.6s ease-in-out infinite}.lab.hot i{color:#7a3d00}.lab.hot::after{border-top-color:#FFB443}@keyframes bob{50%{transform:translate(-50%,-100%) translateY(-4px)}}
.lab i{font-style:normal;color:#FFC86B;margin-left:4px}
.lab::after{content:'';position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-top-color:#241b33;border-bottom:0}
.focus{position:absolute;display:flex;align-items:flex-end;gap:6px}
.focus img{width:52px;height:52px;object-fit:cover;object-position:50% 10%;border-radius:50%;border:3px solid #fff;background:#cfe6ff;box-shadow:0 6px 14px rgba(10,6,30,.4)}
.bubble{background:#fff;color:#151C2C;border-radius:14px 14px 14px 4px;padding:7px 10px;font-size:11.5px;line-height:1.3;max-width:170px;box-shadow:0 6px 16px rgba(10,6,30,.35)}
.bubble b{color:#B5707D}
.go{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:9px}
.btn{flex:1;border-radius:16px;padding:12px;font-weight:650;font-size:14px;text-align:center;color:#2a1a08;background:linear-gradient(180deg,#FFD58A,#FFB443);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 4px 0 #C9801E,0 10px 18px -6px rgba(255,170,60,.6)}
.btn.ghost{flex:.7;color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.below{padding:18px 16px 0;color:#5A6478;font-size:13px}
.below b{color:#151C2C}
</style></head><body>
<div class="top">CoreCHI Practice <span style="color:#98A1B3;font-weight:500;font-size:14px">145 questions</span></div>
<div class="world">
  <div class="stars"></div>
  <div class="hud"><small>CCHI City</small><b>51%</b><span>ready for the exam</span></div>
  <div class="chips"><span class="chip">🔥 4 days</span><span class="chip">⏱ 12 due</span></div>
  <img class="city" src="city2.png">
  <div id="labs"></div>
  <div class="go"><div class="btn">Play: 12 due</div><div class="btn ghost">Exam sim</div></div>
</div>
<div class="below">Below stay <b>Your scores</b>, <b>Focus next</b>, the modes and the domains, as now.</div>
<script>
const k = 392/1080, T0 = 100;
const L = [[540,99,'Ethics',64],[738,225,'Encounter',54],[937,395,'Terminology',24],[342,203,'US Systems',64],[143,307,'Culture',63]];
const host = document.getElementById('labs');
L.forEach(([x,y,n,p])=>{ const d=document.createElement('div'); d.className='lab'; d.style.left=Math.min(338,Math.max(46,x*k-1))+'px'; if(n==='Terminology') d.classList.add('hot'); d.style.top=(y*k+T0-4)+'px'; d.innerHTML=n+'<i>'+p+'%</i>'; host.appendChild(d); });
const f=document.createElement('div'); f.className='focus'; f.style.left='16px'; f.style.top='318px';
f.innerHTML='<img src="base.webp"><div class="bubble">Build up <b>Terminology</b>: it’s 25% of the exam. Tap it!</div>'; host.appendChild(f);
</script></body></html>
