<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
const P = new URLSearchParams(location.search);
const W = +P.get('w')||1080, H = +P.get('h')||1080;
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(1); renderer.setSize(W,H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const zoom = +P.get('zoom')||13;
const cam = new THREE.OrthographicCamera(-zoom, zoom, zoom*H/W, -zoom*H/W, 0.1, 200);
cam.position.set(30, 26, 30); cam.lookAt(0, 0, 0);
scene.add(new THREE.HemisphereLight(0xf4f0ff, 0x7a6a8a, 1.15));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.position.set(-14, 26, 10); sun.castShadow = true;
sun.shadow.mapSize.set(4096,4096); const sc = sun.shadow.camera; sc.left=-22; sc.right=22; sc.top=22; sc.bottom=-22; sc.near=1; sc.far=80;
sun.shadow.bias = -0.0004; sun.shadow.radius = 4; scene.add(sun);
const fill = new THREE.DirectionalLight(0xc9d8ff, 0.5); fill.position.set(20, 10, -10); scene.add(fill);
const M = (c, o={}) => new THREE.MeshStandardMaterial({ color:c, roughness:o.r??0.75, metalness:o.m??0, ...o.x });
const box = (w,h,d,mat,x,y,z,r=0.08,cast=true) => { const g = new RoundedBoxGeometry(w,h,d,3,Math.min(r,w/2-0.001,h/2-0.001,d/2-0.001)); const m = new THREE.Mesh(g,mat); m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=true; scene.add(m); return m; };
const rnd = (()=>{ let s=7; return ()=> (s = (s*16807)%2147483647)/2147483647; })();

// ---- ground slab: grass top, earth sides ----
const S = 19;
box(S, 1.6, S, M(0xc58f62), 0, -0.8, 0, 0.25, false);
box(S-0.05, 0.3, S-0.05, M(0x9edcab), 0, 0.02, 0, 0.12, false);

// ---- roads ----
const roadM = M(0x5d5c6c, {r:0.9}), dashM = M(0xf4f1e8), walkM = M(0xd7d9e3);
const ROAD = 1.5, B = 5.2; // block size
const lines = [-B/2 - ROAD/2 - B/2 + 0, 0]; // computed below
const centers = [-(B+ROAD), 0, (B+ROAD)];
const edges = [-(B+ROAD)/2, (B+ROAD)/2];
for (const e of edges){
  box(ROAD, 0.06, S-0.6, roadM, e, 0.2, 0, 0.02, false);
  box(S-0.6, 0.06, ROAD, roadM, 0, 0.2, e, 0.02, false);
  for (let t=-S/2+1; t<S/2-1; t+=1.1){ if (Math.abs(t - edges[0])<1 || Math.abs(t-edges[1])<1) continue;
    box(0.08, 0.02, 0.5, dashM, e, 0.24, t, 0.01, false);
    box(0.5, 0.02, 0.08, dashM, t, 0.24, e, 0.01, false); }
}
// sidewalks around blocks
for (const cx of centers) for (const cz of centers){
  box(B+0.3, 0.12, B+0.3, walkM, cx, 0.2, cz, 0.06, false);
  box(B-0.2, 0.14, B-0.2, M(0xa6e2b3), cx, 0.23, cz, 0.06, false);
}

// ---- buildings ----
const WALL = M(0xe9e7f0), ROOF = M(0xc9c6d6), WIN = M(0x6f7fb8, {r:0.3, m:0.05}), WINLIT = M(0xffd27a, {r:0.4, x:{emissive:new THREE.Color(0xffb43a), emissiveIntensity:0.6}});
function tower(x, z, w, d, floors, accent){
  const fh = 0.62, base = 0.3, h = floors*fh;
  const acc = M(new THREE.Color(accent).lerp(new THREE.Color(0xffffff), 0.1));
  // floors alternate wall / accent band like the reference's layered towers
  for (let f=0; f<floors; f++){
    const mat = (f % 2 === 0) ? acc : WALL;
    box(w, fh+0.01, d, mat, x, base + f*fh + fh/2, z, 0.05);
  }
  box(w+0.12, 0.16, d+0.12, ROOF, x, base + h + 0.08, z, 0.05);
  box(w*0.32, 0.22, d*0.28, M(0xb6b3c4), x - w*0.15, base + h + 0.27, z + d*0.12, 0.04);
  box(0.12, 0.6, 0.12, M(0x9a97aa), x + w*0.3, base + h + 0.45, z - d*0.3, 0.03);
  // windows on the two faces the camera sees (+x and +z)
  const cols = Math.max(2, Math.round(w/0.55));
  for (let f=0; f<floors; f++){
    const y = base + f*fh + fh/2;
    for (let c=0; c<cols; c++){
      const t = -w/2 + (c+0.5)*w/cols;
      const lit = rnd() < 0.22;
      box(0.18, 0.26, 0.04, lit?WINLIT:WIN, x + t, y, z + d/2 + 0.01, 0.02, false);
      box(0.04, 0.26, 0.18, lit?WINLIT:WIN, x + w/2 + 0.01, y, z + t*(d/w), 0.02, false);
    }
  }
}
function tree(x, z, s=1){
  box(0.14*s, 0.5*s, 0.14*s, M(0x8a5a3c), x, 0.5 + 0.25*s, z, 0.03);
  const g = new THREE.ConeGeometry(0.55*s, 0.9*s, 7); const m = new THREE.Mesh(g, M(0x3fae7c, {r:0.85}));
  m.position.set(x, 0.5 + 0.75*s, z); m.castShadow = true; scene.add(m);
  const g2 = new THREE.ConeGeometry(0.42*s, 0.75*s, 7); const m2 = new THREE.Mesh(g2, M(0x52c08c, {r:0.85}));
  m2.position.set(x, 0.5 + 1.15*s, z); m2.castShadow = true; scene.add(m2);
}
function car(x, z, rotY, col){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new RoundedBoxGeometry(0.9,0.32,0.5,3,0.1), M(col)); body.position.y=0.36; body.castShadow=true; g.add(body);
  const cab = new THREE.Mesh(new RoundedBoxGeometry(0.5,0.26,0.44,3,0.08), M(0xf4f6fb)); cab.position.set(-0.05,0.62,0); cab.castShadow=true; g.add(cab);
  for (const [dx,dz] of [[0.28,0.24],[-0.28,0.24],[0.28,-0.24],[-0.28,-0.24]]){ const w=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.08,12), M(0x2b2b36)); w.rotation.x=Math.PI/2; w.position.set(dx,0.2,dz); g.add(w); }
  g.position.set(x, 0.12, z); g.rotation.y = rotY; scene.add(g);
}

// districts: 5 domains + a park (centre-front) — mastery 0..1 sets heights
const D = [
  { c:0x8b7bae, at:[centers[0], centers[0]], m:+(P.get('e')||0.64) },
  { c:0x6f97ac, at:[centers[1], centers[0]], m:+(P.get('n')||0.54) },
  { c:0xb5707d, at:[centers[2], centers[0]], m:+(P.get('t')||0.24) },
  { c:0xbfa05e, at:[centers[0], centers[1]], m:+(P.get('s')||0.64) },
  { c:0x7fa173, at:[centers[0], centers[2]], m:+(P.get('c')||0.63) },
];
for (const d of D){
  const [cx, cz] = d.at; const top = 2 + Math.round(d.m*9);
  tower(cx-0.9, cz-0.9, 1.9, 1.9, top, d.c);
  tower(cx+1.3, cz-1.2, 1.3, 1.3, Math.max(2, top-3), d.c);
  tower(cx-1.2, cz+1.35, 1.3, 1.2, Math.max(1, top-5), d.c);
  tree(cx+1.4, cz+1.4, 0.8);
}
// park blocks: trees + plaza
const parks = [[centers[1],centers[1]],[centers[2],centers[1]],[centers[1],centers[2]],[centers[2],centers[2]]];
for (const [px,pz] of parks){
  for (let i=0;i<7;i++) tree(px + (rnd()-0.5)*4.2, pz + (rnd()-0.5)*4.2, 0.75+rnd()*0.35);
}
box(2.4, 0.08, 2.4, M(0xe3e0ea), centers[1], 0.32, centers[1], 0.05, false);
const fount = new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.8,0.3,24), M(0xd0cde0)); fount.position.set(centers[1],0.48,centers[1]); fount.castShadow=true; scene.add(fount);
const water = new THREE.Mesh(new THREE.CylinderGeometry(0.58,0.58,0.05,24), M(0x7fd2f0,{r:0.15})); water.position.set(centers[1],0.62,centers[1]); scene.add(water);
// traffic
car(edges[0], -4, 0, 0xf2c94c); car(edges[1], 2.5, Math.PI, 0xef8f8f); car(-1.5, edges[1], Math.PI/2, 0xf7f3e9); car(5.5, edges[0], -Math.PI/2, 0x6fb3e0);

renderer.render(scene, cam);
window.__labels = D.map(d=>{ const top = 0.3 + (2 + Math.round(d.m*9))*0.62 + 0.5; const v = new THREE.Vector3(d.at[0]-0.9, top, d.at[1]-0.9).project(cam); return [Math.round((v.x+1)/2*W), Math.round((1-v.y)/2*H)]; });
window.__park = (()=>{ const v = new THREE.Vector3(0, 0.6, 0).project(cam); return [Math.round((v.x+1)/2*W), Math.round((1-v.y)/2*H)]; })();
window.__done = true;
</script></body></html>
